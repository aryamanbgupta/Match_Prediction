name: Embeddings and simulator contracts

on:
  pull_request:
    paths:
      - "scripts/sim_t1.py"
      - "scripts/sim_v1_2.py"
      - "scripts/run_t1_*.py"
      - "scripts/run_xr_*.py"
      - "scripts/transformer_t1.py"
      - "scripts/transformer_xr.py"
      - "scripts/t1_ppc_common.py"
      - "scripts/registered_experiment.py"
      - "scripts/audit_t1_sim_parity.py"
      - "scripts/build_bowler_roster_policy.py"
      - "scripts/rebuild_b18_extras_sidecar.py"
      - "scripts/sim_eval/**"
      - "tests/**"
      - "experiments/configs/t1_*.yaml"
      - "experiments/configs/xr_*.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/embeddings-contracts.yml"
  push:
    branches: [main]
    paths:
      - "scripts/sim_t1.py"
      - "scripts/sim_v1_2.py"
      - "scripts/run_t1_*.py"
      - "scripts/run_xr_*.py"
      - "scripts/transformer_t1.py"
      - "scripts/transformer_xr.py"
      - "scripts/t1_ppc_common.py"
      - "scripts/registered_experiment.py"
      - "scripts/audit_t1_sim_parity.py"
      - "scripts/build_bowler_roster_policy.py"
      - "scripts/rebuild_b18_extras_sidecar.py"
      - "scripts/sim_eval/**"
      - "tests/**"
      - "experiments/configs/t1_*.yaml"
      - "experiments/configs/xr_*.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/embeddings-contracts.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        # mlx/mlx-metal ship macOS-only wheels; rpy2-rinterface has no
        # manylinux wheel and needs an R toolchain the runner lacks. None of
        # the contract tests import them.
        run: >-
          uv sync --frozen --group dev
          --no-install-package mlx
          --no-install-package mlx-metal
          --no-install-package rpy2
          --no-install-package rpy2-rinterface
          --no-install-package rpy2-robjects
      - name: Run causal parity, symmetry, ablation, and xR contracts
        run: uv run --no-sync pytest -q tests
