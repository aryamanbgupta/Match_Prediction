experiment:
  name: xgb_v6_hierarchical_shrink
  description: "v6 features with Phase 5 hierarchical shrinkage on the 4 vs-type/vs-hand\
    \ cells. The narrow cells (batter_vs_pace, batter_vs_spin, bowler_vs_lhb, bowler_vs_rhb)\
    \ shrink toward the player's overall distribution (already shrunk toward \u03C0\
    ) instead of directly toward \u03C0. k_narrow=k_overall=30 for like-for-like comparison\
    \ vs v6 baseline."
  tags:
  - xgboost
  - v6
  - outcome_dist
  - hierarchical_shrink
  - phase5
data:
  version: v3
  test_dir: data/polymarket_test
  odds_file: betting_odds_polymarket.json
features:
  groups:
  - basic
  - player_stats
  - h2h
  - momentum
  - pressure
  - chase
  - medium
  - player_metadata
  - matchup
  - type_based
  - team_strength
  - batter_outcome_dist
  - bowler_outcome_dist
  - batter_vs_type_dist
  - bowler_vs_hand_dist
  - venue_outcome_dist
  exclude: []
  include_extra: []
model:
  type: xgboost
  hyperparameters:
    n_estimators: 444
    max_depth: 10
    learning_rate: 0.24036372383981375
    subsample: 0.8776663421127178
    colsample_bytree: 0.7424085095268674
    reg_alpha: 0.8503122682099661
    reg_lambda: 0.18186045420525845
  tune: false
  tune_trials: 50
evaluation:
  n_sims: 100
  parallel: false
  bootstrap_resamples: 1000
pipeline:
  skip_parsing: false
  skip_training: false
  skip_evaluation: false
