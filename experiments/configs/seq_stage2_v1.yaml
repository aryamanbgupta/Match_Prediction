deviations:
  - id: a15_not_adopted
    statement: >-
      early stopping on a validation date-prefix disjoint from the selection
      rows is NOT adopted for any arm.
    reason: >-
      one protocol for all arms, and the k-sweep tolerance is the registered
      guard. It does not correct checkpoint-selection optimism, which is one
      reason every validation number of this stage is screening evidence
      (D2.8, Astra SHOULD 12).
  - id: two_seeds_night_1
    statement: every configuration runs at seeds 7 and 13 on night 1.
    reason: >-
      the user's decision (D2.1); more seeds are added later to whole
      hypothesis families, never to single arms.
  - id: xlstm_simplifications
    statement: >-
      the xLSTM arm is written in plain torch (no xlstm package is
      installed) and departs from Beck et al. 2024 as recorded by
      scripts/sequence_track/recurrent_arms.simplifications().
    simplifications:
      - no causal conv1d pre-block on either cell
      - sLSTM cell is single-head with dense (d, d) input and recurrent
        matrices (no block-diagonal projections)
      - no up/down projection around the mLSTM cell; it runs at dmodel so 4
        heads of 32 holds at dmodel=128, and each block carries a SwiGLU
        feed-forward sublayer (hidden 4*dmodel//3) instead
      - no learnable conv skip inside the mLSTM block
      - exponential forget gate in both cells (paper allows sigmoid or exp);
        zero initial cell states and m_0 = 0
      - sLSTM normaliser denominator clamped below at 1e-6 as a numerical
        guard
  - id: residual_oof_refits
    statement: >-
      the train-split base logits are leave-one-date-block-out refits run at
      a fixed 25 rounds (production best_iteration + 1) with no early
      stopping and no eval set, instead of re-running production's early
      stopping per fold; the production label encoders are reused verbatim.
    reason: >-
      no fold may re-select its round count against the validation split.
      Recorded in the base-logits sidecars (D4).
  - id: encoders_reused
    statement: >-
      every arm reuses the frame's own 50-feature contract and the
      production encoders; no encoder is refit for stage 2.

# Each entry carries an `id` so a report or a review round can name one
# without quoting it (the stage 1 config's mould).
known_asymmetries:
  - id: same_entity_vs_recency_history_input
    text: >-
      same_entity and recency differ in the HISTORY INPUT as well as the mask:
      same_entity reads the participant-aligned input, recency reads the
      innings-previous one. So same_entity_k - recency_k is "ownership plus
      alignment beyond recency"; the mask alone is isolated by
      same_entity_unr - aligned_hist_rf (D3.6, Astra MUST-FIX 5).
  - id: relay_free_keys_carry_own_outcome
    text: >-
      the relay-free arms (recency, same_entity, aligned_hist_rf) read an
      earlier row j < i as a (state, OWN outcome) pair: the key/value token is
      feat_proj(feat_j) + own_out_emb(y_j) + pos_j, with y_j row j's own
      realised outcome. The standard-wiring arms (full, aligned_hist,
      fixed_decay, fox, residual_t1) read every row, key or query, as a
      (state, SHIFTED previous outcome) pair: feat_proj(feat_j) + hist(j) +
      pos_j. The target's own token in both wirings carries hist(i), never
      y_i, so no arm can read its own label (certified in D7). Consequence:
      aligned_hist_rf - aligned_hist measures the wiring PLUS the key
      construction, not the wiring alone, and the same qualification attaches
      to same_entity_unr - aligned_hist_rf only through its aligned_hist_rf
      endpoint (both of its arms are relay-free, so the key construction is
      matched there). Decided at the 2026-09-11 Fable-to-Opus handover, § 3.1:
      the alternative was to keep one construction and widen the dependency
      set S(i), which would have made the ownership certificate weaker than
      the arm register states.
  - id: residual_arms_see_the_production_base
    text: >-
      the residual arms carry the production ball model's log probabilities,
      which no other arm sees; residual_t1 - mlp therefore mixes two changes
      and only residual_t1 - residual_mlp is confirmatory.
  - id: positional_embedding_not_uniform
    text: >-
      the recurrent arms have no positional embedding by construction (position
      is carried by the recurrence), while the masked and standard attention
      arms do — except fixed_decay and fox, whose bias carries position and
      which are registered with no positional embedding.
  - id: token_mlp_parameter_count_not_matched
    text: >-
      a token_mlp arm (mlp, residual_mlp) has no attention layer at all, so its
      parameter count is not matched to the attention arms parameter for
      parameter; counts are reported per run in arm_params.n_parameters.

known_limitations:
  - >-
    the global outcome prior in the stats cache is not as-of-date, an
    inherited limitation of the frame; the direction and size of its effect
    on any stage-2 contrast are unknown.
  - >-
    venue history in the frame is not recency-weighted (TODO.md backlog
    item); every arm inherits the same feature, so it is a level effect on
    all of them rather than a per-arm advantage.
  - >-
    the i7 test split was read by the 2026-08 program, so it is not a clean
    holdout; stage 2 does not load it (score_test false) and the untouched
    cohort exists because of this.
  - >-
    MPS kernels are not bit-reproducible across runs or machines, so a rerun
    of any checkpoint may differ in the low decimals; every checkpoint
    records mps_bit_reproducible false.
  - >-
    checkpoint selection uses the same validation split the contrasts are
    computed on (A15 not adopted), so every number is screening evidence.

