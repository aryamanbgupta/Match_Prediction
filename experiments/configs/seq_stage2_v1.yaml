experiment:
  name: seq_stage2_v1
  registered: 2026-09-11
  purpose: >-
    Register the sixteen stage-2 sequence configurations — the mechanism arms
    (fixed decay, learned forgetting, participant-aligned history, relay-free
    wiring, recency and ownership masks, two recurrent arms) and the two
    residual arms over the production ball model — each trained fresh on the
    i7 identity frame under one protocol, so every contrast in the arm
    register is a matched pair. Stage 1 checkpoints are NOT reused (D2.2):
    these are separate runs, not replications.
  predecessor: experiments/configs/seq_stage1_retrain_i7_v1.yaml
  decision_record: docs/sequence_track/stage2_acceptance.md
  arm_register: docs/sequence_track/stage2_acceptance.md § "Arm register"
  runner: scripts/sequence_track/retrain_stage2.py
  pin: scripts/sequence_track/pin_stage2.py
  queue:
    - research/sequence_track/queue_laptop.yaml
    - research/sequence_track/queue_mini.yaml
  queue_note: >-
    night 1 is split BY SEED across two machines (the user's decision
    2026-09-12, Astra MUST-FIX 9): seed 7 on the laptop, seed 13 on the Mac
    mini, every configuration on both. Each half holds sixteen jobs in the
    registered queue order with a SEED-SPECIFIC output_dir
    (runs/<config_id>/seed_<seed>), because run_queue.sh decides skip-vs-run
    from the COMPLETE marker in output_dir plus the config sha256 alone and
    reads neither the command nor the seed subset.
  sign_convention: >-
    candidate minus reference, in validation log loss, negative favourable.
  evidence_status: >-
    every validation and test number of this stage is SCREENING evidence
    (D2.1): two seeds on night 1, checkpoint selection on the same
    validation split the contrasts are computed on (D2.8), and no market or
    betting layer anywhere. Nothing here can be LANDED on its own.
  forbidden_data:
    - data/golden
    - data/forward_holdout

data:
  directory: data/xgb_data_i7
  frame_version: i7
  frame_role: ball_frame_i7
  stats_cache_role: stats_cache_i7
  splits_read: [train, validation]
  eval_kit: none
  feature_contract: transformer_t1.build_features
  n_features: 50

training:
  # Identical to stage 1's training block (seq_stage1_retrain_i7_v1.yaml), so
  # the two stages' protocols are comparable; only the seed list differs.
  device: mps
  seeds: [7, 13]
  dmodel: 128
  layers: 2
  heads: 4
  batch: 128
  epochs: 30
  learning_rate: 0.0003
  patience: 3
  aux: false
  no_kit: true
  score_test: false
  save_predictions: true
  early_stopping: >-
    on the full validation split, patience 3, as in stage 1. A validation
    date-prefix disjoint from the selection rows (A15) is NOT adopted; see
    deviations.
  seed_policy: >-
    every configuration trains at two seeds (7, 13) on the first night as a
    directional screen; seeds 29, 42, 101 may be added later, and only to
    whole hypothesis families (candidate plus every matched control plus
    every k if k is selected), never to single arms; every validation and
    test number of the stage is screening evidence; the untouched cohort is
    opened exactly once, after candidates, k, controls and families are
    frozen.
  seed_policy_source: >-
    docs/sequence_track/stage2_acceptance.md, D2 check 2.1, quoted verbatim.

outputs:
  directory: models/embeddings/seq_stage2/runs
  summary: summary.yaml
  per_run: [metrics.json, model.pt, run_record.json, predictions_validation.npz]
  save_row_aligned_probabilities: true

configurations:
  - id: mlp
    arm: mlp
    params: {}
    access: {features: true, history: false, identity: false, prod_logits: false}
    history_input: none
    wiring: token_mlp
    reference: []
    reference_note: >-
      the shared control: every candidate arm's primary contrast is against
      this one, so it has none of its own.
    tests: >-
      control — capacity-matched token model with no sequence access.
    queue_order: 1
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/mlp/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/mlp/seed_13

  - id: full
    arm: full
    params: {}
    access: {features: true, history: true, identity: false, prod_logits: false}
    history_input: innings_previous
    wiring: standard
    reference: [mlp]
    tests: >-
      reference — stage 1 arm C's architecture retrained under the stage 2
      protocol; the standard-wiring endpoint the aligned-history and
      relay-free arms are read against.
    queue_order: 2
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/full/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/full/seed_13

  - id: fixed_decay
    arm: fixed_decay
    params: {}
    access: {features: true, history: true, identity: false, prod_logits: false}
    history_input: innings_previous
    wiring: standard
    reference: [mlp]
    tests: >-
      fixed decay — ALiBi additive bias -m_h*(i-j) with slopes
      m_h = 2^(-8h/H) and no positional embedding; also the matched control
      for fox.
    queue_order: 3
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm fixed_decay --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/fixed_decay/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm fixed_decay --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/fixed_decay/seed_13

  - id: fox
    arm: fox
    params: {}
    access: {features: true, history: true, identity: false, prod_logits: false}
    history_input: innings_previous
    wiring: standard
    reference: [mlp, fixed_decay]
    tests: >-
      learned forgetting — per-head scalar gate from the key token's
      layer-zero embedding, cumulative log-gate added before softmax; differs
      from fixed_decay ONLY in the bias and the gate parameters.
    queue_order: 4
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm fox --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/fox/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm fox --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/fox/seed_13

  - id: aligned_hist
    arm: aligned_hist
    params: {}
    access: {features: true, history: true, identity: true, prod_logits: false}
    history_input: participant_aligned
    wiring: standard
    reference: [mlp, full]
    tests: >-
      aligned input alone — the last outcome of the same batter and of the
      same bowler in this innings replace the innings-previous outcome, with
      standard wiring unchanged, so aligned_hist - full is the input change
      by itself.
    queue_order: 5
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm aligned_hist --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/aligned_hist/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm aligned_hist --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/aligned_hist/seed_13

  - id: recency_k30
    arm: recency
    params: {k: 30}
    access: {features: true, history: true, identity: false, prod_logits: false}
    history_input: innings_previous
    wiring: relay_free
    reference: [mlp]
    tests: >-
      recency component — attention restricted to the last 30 delivery rows
      under relay-free wiring; the matched control for same_entity_k30.
    queue_order: 6
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm recency --seed 7 --data-dir data/xgb_data_i7 --k 30 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/recency_k30/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm recency --seed 13 --data-dir data/xgb_data_i7 --k 30 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/recency_k30/seed_13

  - id: same_entity_k30
    arm: same_entity
    params: {k: 30}
    access: {features: true, history: true, identity: true, prod_logits: false}
    history_input: participant_aligned
    wiring: relay_free
    reference: [mlp, recency_k30]
    tests: >-
      ownership at k = 30 — rows of the same batter or the same bowler within
      the window, plus the target. Against recency_k30 the contrast is
      "ownership plus alignment beyond recency" (D3.6), not the mask alone.
    queue_order: 7
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 7 --data-dir data/xgb_data_i7 --k 30 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_k30/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 13 --data-dir data/xgb_data_i7 --k 30 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_k30/seed_13

  - id: aligned_hist_rf
    arm: aligned_hist_rf
    params: {}
    access: {features: true, history: true, identity: true, prod_logits: false}
    history_input: participant_aligned
    wiring: relay_free
    reference: [aligned_hist]
    tests: >-
      wiring effect and the matched unrestricted endpoint — aligned inputs
      with relay-free wiring. aligned_hist_rf - aligned_hist measures the
      relay-free wiring PLUS the key construction (the relay-free arms read
      an earlier row as a (state, own outcome) pair, the standard-wiring arms
      as a (state, shifted previous outcome) pair; see known_asymmetries
      relay_free_keys_carry_own_outcome), not the wiring alone.
      same_entity_unr - aligned_hist_rf isolates the mask given aligned
      inputs, because both of its endpoints are relay-free and their key
      construction is matched.
    queue_order: 8
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm aligned_hist_rf --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/aligned_hist_rf/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm aligned_hist_rf --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/aligned_hist_rf/seed_13

  - id: same_entity_k0
    arm: same_entity
    params: {k: 0}
    access: {features: true, history: true, identity: true, prod_logits: false}
    history_input: participant_aligned
    wiring: relay_free
    reference: [mlp]
    reference_note: >-
      no recency control is registered at this k for night 1 (only k = 30
      has one), so the matched-control contrast for this cell is the k sweep
      itself plus mlp.
    tests: >-
      k sweep floor — the target row alone. It is called "ownership" only
      after the D7 dependency test passes for it.
    queue_order: 9
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 7 --data-dir data/xgb_data_i7 --k 0 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_k0/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 13 --data-dir data/xgb_data_i7 --k 0 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_k0/seed_13

  - id: same_entity_k6
    arm: same_entity
    params: {k: 6}
    access: {features: true, history: true, identity: true, prod_logits: false}
    history_input: participant_aligned
    wiring: relay_free
    reference: [mlp]
    reference_note: >-
      no recency control is registered at this k for night 1.
    tests: k sweep — one over of delivery rows.
    queue_order: 10
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 7 --data-dir data/xgb_data_i7 --k 6 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_k6/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 13 --data-dir data/xgb_data_i7 --k 6 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_k6/seed_13

  - id: same_entity_k12
    arm: same_entity
    params: {k: 12}
    access: {features: true, history: true, identity: true, prod_logits: false}
    history_input: participant_aligned
    wiring: relay_free
    reference: [mlp]
    reference_note: >-
      no recency control is registered at this k for night 1.
    tests: k sweep — two overs of delivery rows.
    queue_order: 11
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 7 --data-dir data/xgb_data_i7 --k 12 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_k12/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 13 --data-dir data/xgb_data_i7 --k 12 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_k12/seed_13

  - id: same_entity_unr
    arm: same_entity
    params: {k: unr}
    access: {features: true, history: true, identity: true, prod_logits: false}
    history_input: participant_aligned
    wiring: relay_free
    reference: [mlp, aligned_hist_rf]
    tests: >-
      ownership over the whole innings — the unrestricted endpoint of the k
      sweep; against aligned_hist_rf it is two relay-free models differing
      only in the mask.
    queue_order: 12
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 7 --data-dir data/xgb_data_i7 --k unr --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_unr/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm same_entity --seed 13 --data-dir data/xgb_data_i7 --k unr --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/same_entity_unr/seed_13

  - id: lstm
    arm: lstm
    params: {}
    access: {features: true, history: true, identity: false, prod_logits: false}
    history_input: innings_previous
    wiring: recurrent
    reference: [mlp]
    tests: >-
      classic forget gate — 2-layer LSTM, hidden 128, dropout 0.1, state
      reset at innings start, full-innings backpropagation.
    queue_order: 13
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm lstm --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/lstm/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm lstm --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/lstm/seed_13

  - id: xlstm
    arm: xlstm
    params: {}
    access: {features: true, history: true, identity: false, prod_logits: false}
    history_input: innings_previous
    wiring: recurrent
    reference: [mlp]
    tests: >-
      exponential gating — sLSTM block then mLSTM block at 128-d, plain
      torch; the documented departures from Beck et al. 2024 are listed under
      deviations.
    queue_order: 14
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm xlstm --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/xlstm/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm xlstm --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/xlstm/seed_13

  - id: residual_mlp
    arm: residual_mlp
    params:
      base_logits_dir: models/embeddings/seq_stage2/base_logits
      residual_l2: 0.001
    access: {features: true, history: false, identity: false, prod_logits: true}
    history_input: none
    wiring: token_mlp
    reference: [mlp]
    tests: >-
      control for residual_t1 — token model over log p_base from the
      production ball model, zero-initialised head, L2 shrinkage on the
      residual.
    queue_order: 15
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm residual_mlp --seed 7 --data-dir data/xgb_data_i7 --base-logits-dir models/embeddings/seq_stage2/base_logits --residual-l2 0.001 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/residual_mlp/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm residual_mlp --seed 13 --data-dir data/xgb_data_i7 --base-logits-dir models/embeddings/seq_stage2/base_logits --residual-l2 0.001 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/residual_mlp/seed_13

  - id: residual_t1
    arm: residual_t1
    params:
      base_logits_dir: models/embeddings/seq_stage2/base_logits
      residual_l2: 0.001
    access: {features: true, history: true, identity: false, prod_logits: true}
    history_input: innings_previous
    wiring: standard
    reference: [residual_mlp]
    reference_note: >-
      residual_t1 - residual_mlp is the confirmatory contrast; residual_t1 -
      mlp is reported but does not qualify (it mixes the sequence and the
      production prior).
    tests: >-
      sequence over production — causal attention on top of the production
      ball model's log probabilities.
    queue_order: 16
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm residual_t1 --seed 7 --data-dir data/xgb_data_i7 --base-logits-dir models/embeddings/seq_stage2/base_logits --residual-l2 0.001 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/residual_t1/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm residual_t1 --seed 13 --data-dir data/xgb_data_i7 --base-logits-dir models/embeddings/seq_stage2/base_logits --residual-l2 0.001 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage2/runs/residual_t1/seed_13

queue_order_note: >-
  night 1 order (D2, arm register "Queue order"): mlp, full, fixed_decay, fox,
  aligned_hist, recency_k30, same_entity_k30, then aligned_hist_rf,
  same_entity_k0, same_entity_k6, same_entity_k12, same_entity_unr, then lstm,
  xlstm, then residual_mlp, residual_t1. Two seeds each: 32 runs.

statistics:
  registered_for: docs/sequence_track/stage2_acceptance.md, D10
  per_row_log_loss: >-
    computed from the row-aligned validation probabilities each run saves
    (predictions_validation.npz), never from a scalar.
  contrasts:
    - {name: arm_minus_mlp, definition: "each arm - mlp", role: primary_screen}
    - {name: fox_minus_fixed_decay, definition: "fox - fixed_decay",
       role: mechanism, tests: learned forgetting beyond fixed decay}
    # The five mechanism contrasts registered above and below are the stage's
    # mechanism set; each one names what it measures and nothing wider.
    - {name: same_entity_minus_recency, definition: "same_entity_k - recency_k at the same k",
       role: mechanism, tests: ownership plus alignment beyond recency,
       registered_pairs: [[same_entity_k30, recency_k30]]}
    - name: same_entity_unr_minus_aligned_hist_rf
      definition: "same_entity_unr - aligned_hist_rf"
      role: mechanism
      tests: >-
        mask alone, given aligned inputs and matched relay-free keys
    - name: aligned_hist_rf_minus_aligned_hist
      definition: "aligned_hist_rf - aligned_hist"
      role: mechanism
      tests: >-
        the relay-free wiring PLUS the key construction — NOT the wiring
        alone. The relay-free arms read an earlier row j < i as a (state, OWN
        outcome) pair while the standard-wiring arms read every row as a
        (state, SHIFTED previous outcome) pair, so the two endpoints differ in
        both the wiring and what the keys carry (known_asymmetries
        relay_free_keys_carry_own_outcome).
    - {name: aligned_hist_minus_full, definition: "aligned_hist - full",
       role: mechanism, tests: the aligned history input}
    - {name: residual_t1_minus_residual_mlp,
       definition: "residual_t1 - residual_mlp", role: confirmatory,
       tests: sequence structure on top of the production prior}
  families:
    definition: >-
      one registered family per candidate configuration, with exactly three
      members: {primary contrast = candidate - its named matched control on
      the `all` slice, death-over non-inferiority gate = candidate - mlp on
      the `death` slice, chase non-inferiority gate = candidate - mlp on the
      `chase` slice}. The map below is the registration: it is not a
      template. Every reference is a config id from the `configurations`
      list, and every family member names the slice it is evaluated on.
    gate_reference_rule: >-
      both non-inferiority gates are taken against mlp for every candidate,
      whatever the candidate's primary control is (D10.6), so the gate asks
      "does this arm lose ground against the shared control on death overs /
      in chases", a question that is comparable across every family.
    primary_slice: all
    death_gate_slice: death
    chase_gate_slice: chase
    multiplicity: holm
    multiplicity_scope: within a family, across its three members
    holm:
      scope: >-
        Holm operates WITHIN each three-member family, separately for each
        estimand / checkpoint readout. It is never pooled across the 15
        families and never applied across the k search.
      adjustment: >-
        with three sorted raw p-values p_(1) <= p_(2) <= p_(3), the adjusted
        value at rank r is min(1, max over j <= r of (4 - j) * p_(j)) — the
        step-down stopping rule, which makes the adjusted values monotone in
        rank.
      ties: stable in the registered member order (primary, death, chase)
      missing_member: >-
        an unavailable member (a run that did not finish, a slice with no
        rows) gets a non-rejecting placeholder (adjusted p = 1) and the family
        CANNOT pass.
      raw_p: >-
        the threshold-centred two-sided percentile form
        p = min(1, 2 * min[P(d* - t <= 0), P(d* - t >= 0)]) over the bootstrap
        draws d*, with t = 0 for the superiority (primary) member and
        t = +0.002 for each non-inferiority gate.
    # 15 families: one per configuration except mlp, which is the shared
    # control and is a candidate in no family.
    map:
      - candidate: full
        primary: {contrast: "full - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "full - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "full - mlp", reference: mlp, slice: chase}
        holm_group: family_full
      - candidate: fixed_decay
        primary: {contrast: "fixed_decay - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "fixed_decay - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "fixed_decay - mlp", reference: mlp, slice: chase}
        holm_group: family_fixed_decay
      - candidate: fox
        primary: {contrast: "fox - fixed_decay", reference: fixed_decay, slice: all}
        death_gate: {contrast: "fox - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "fox - mlp", reference: mlp, slice: chase}
        holm_group: family_fox
      - candidate: aligned_hist
        primary: {contrast: "aligned_hist - full", reference: full, slice: all}
        death_gate: {contrast: "aligned_hist - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "aligned_hist - mlp", reference: mlp, slice: chase}
        holm_group: family_aligned_hist
      - candidate: aligned_hist_rf
        primary: {contrast: "aligned_hist_rf - aligned_hist",
                  reference: aligned_hist, slice: all}
        death_gate: {contrast: "aligned_hist_rf - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "aligned_hist_rf - mlp", reference: mlp, slice: chase}
        holm_group: family_aligned_hist_rf
        note: >-
          the primary contrast measures the relay-free wiring PLUS the key
          construction, not the wiring alone (known_asymmetries
          relay_free_keys_carry_own_outcome).
      - candidate: recency_k30
        primary: {contrast: "recency_k30 - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "recency_k30 - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "recency_k30 - mlp", reference: mlp, slice: chase}
        holm_group: family_recency_k30
      - candidate: same_entity_k30
        primary: {contrast: "same_entity_k30 - recency_k30",
                  reference: recency_k30, slice: all}
        death_gate: {contrast: "same_entity_k30 - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "same_entity_k30 - mlp", reference: mlp, slice: chase}
        holm_group: family_same_entity_k30
        note: >-
          the primary contrast is "ownership plus alignment beyond recency"
          (known_asymmetries same_entity_vs_recency_history_input).
      - candidate: same_entity_unr
        primary: {contrast: "same_entity_unr - aligned_hist_rf",
                  reference: aligned_hist_rf, slice: all}
        death_gate: {contrast: "same_entity_unr - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "same_entity_unr - mlp", reference: mlp, slice: chase}
        holm_group: family_same_entity_unr
        note: >-
          both endpoints are relay-free with matched key construction, so this
          is the mask alone given aligned inputs.
      - candidate: same_entity_k0
        primary: {contrast: "same_entity_k0 - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "same_entity_k0 - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "same_entity_k0 - mlp", reference: mlp, slice: chase}
        holm_group: family_same_entity_k0
        note: >-
          no recency control is registered at this k, so the primary contrast
          is against the shared control and the k sweep carries the rest.
      - candidate: same_entity_k6
        primary: {contrast: "same_entity_k6 - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "same_entity_k6 - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "same_entity_k6 - mlp", reference: mlp, slice: chase}
        holm_group: family_same_entity_k6
        note: no recency control is registered at this k.
      - candidate: same_entity_k12
        primary: {contrast: "same_entity_k12 - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "same_entity_k12 - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "same_entity_k12 - mlp", reference: mlp, slice: chase}
        holm_group: family_same_entity_k12
        note: no recency control is registered at this k.
      - candidate: lstm
        primary: {contrast: "lstm - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "lstm - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "lstm - mlp", reference: mlp, slice: chase}
        holm_group: family_lstm
      - candidate: xlstm
        primary: {contrast: "xlstm - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "xlstm - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "xlstm - mlp", reference: mlp, slice: chase}
        holm_group: family_xlstm
      - candidate: residual_mlp
        primary: {contrast: "residual_mlp - mlp", reference: mlp, slice: all}
        death_gate: {contrast: "residual_mlp - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "residual_mlp - mlp", reference: mlp, slice: chase}
        holm_group: family_residual_mlp
        note: >-
          residual_mlp is registered as residual_t1's matched control; its own
          family measures what the production prior alone buys over mlp and it
          is read as such, not as a sequence claim.
      - candidate: residual_t1
        primary: {contrast: "residual_t1 - residual_mlp",
                  reference: residual_mlp, slice: all}
        death_gate: {contrast: "residual_t1 - mlp", reference: mlp, slice: death}
        chase_gate: {contrast: "residual_t1 - mlp", reference: mlp, slice: chase}
        holm_group: family_residual_t1
        note: >-
          residual_t1 - mlp is reported but does not qualify as a primary
          contrast (it mixes the sequence and the production prior).
    map_is_complete: >-
      every configuration except mlp appears exactly once as a candidate; mlp
      is the shared control and is a candidate in no family. If the k sweep
      selects a k other than 30, that cell's family is the one registered
      above for that k (primary against mlp) — it does not acquire
      recency_k30 as a matched control (see k_selection
      matched_control_constraint).
    exploratory: >-
      every slice other than all, death and chase; every arm - mlp contrast
      that is not a member of the family above (for example aligned_hist -
      mlp, fox - mlp, same_entity_k30 - mlp on the all slice, and
      residual_t1 - mlp on the all slice); the mechanism contrasts that are
      not any family's primary member; and the residual arms' base-only
      comparison.
  slices: [all, death, chase, powerplay, middle, innings_1, innings_2, thin_pair]
  bootstrap:
    contract: tournament_time_block_v1
    blocks_from: scripts/sim_eval/eval_statistics.load_competition_clusters
    block_source_dir: data/t20s_json
    block_key: cricsheet match id
    resample: tournament blocks, not matches
    reps: 2000
    seed: 29
    weighting: ball_weighted
    min_blocks: 10
    below_min_blocks: descriptive
    invariant: >-
      CLAUDE.md critical invariant 7 — fewer than 10 blocks is descriptive,
      never a CI-clean claim.
  estimands:
    - {id: i, definition: per checkpoint (one seed), reported: separately}
    - {id: ii, definition: joint resampling of seeds and tournament blocks,
       reported: separately}
  non_inferiority:
    margin_ll: 0.002
    sign: >-
      a candidate is non-inferior on a gate slice when U95, the 97.5th
      percentile of the paired harm draws of (candidate - mlp), is STRICTLY
      below +0.002 log loss. U95 = 0.002 exactly does not pass.
    applies_to: [death, chase]
    reference: mlp
    raw_p: >-
      the same threshold-centred two-sided percentile form as the primary
      member, with t = +0.002:
      p = min(1, 2 * min[P(d* - 0.002 <= 0), P(d* - 0.002 >= 0)]).
    not_imported_from_stage_1: >-
      stage 1's +-0.007 parity margin and its parity classification are NOT
      imported; this stage's only margin is +0.002 on log loss.
  interval_labelling:
    rank_local: >-
      every per-arm or per-rank interval is labelled "rank-local percentile
      interval; not simultaneous; not the rejection rule", as the stage 1
      report did. The rejection rule is the Holm-adjusted family above, never
      an interval read off a table.
  k_selection:
    tolerance_ll: 0.002
    registered_sweep: [0, 6, 12, 30, unr]
    rule: >-
      ANY k in the registered sweep {0, 6, 12, 30, unr} may win, unr included:
      choose the k with the best (lowest) two-seed mean validation log loss;
      if no k beats k = 30 by more than 0.002, keep 30. The rule is not
      restricted to k smaller than 30 — a larger window or the unrestricted
      innings wins on the same terms as a smaller one.
    matched_control_constraint: >-
      only k = 30 has a registered recency control (recency_k30), so a
      selected k other than 30 does NOT acquire a matched recency comparison:
      it may not borrow recency_k30, because recency_k30's window is a
      different window. At k = unr the matched relay-free endpoint is
      aligned_hist_rf (same wiring, same key construction, no mask), which is
      registered; at k = 0, 6, 12 there is no matched control on night 1 and
      the primary contrast is against mlp. A matched recency control at a
      newly selected k is a new run at the same seeds, queued before 2f.
  labelling:
    two_seed_night: screen
    note: >-
      a two-seed night is a directional screen; no interval from it is a
      confirmation, and no arm is promoted on it.

