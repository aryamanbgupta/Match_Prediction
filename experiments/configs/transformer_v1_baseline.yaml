experiment:
  name: "transformer_v1_baseline"
  description: "Transformer v1 baseline with full innings context"
  tags: ["transformer", "v1", "baseline"]

data:
  version: "v3"
  test_dir: "data/betting_test"
  odds_file: "betting_odds_v3.json"

features:
  groups:
    - basic
    - player_stats
    - h2h
    - momentum
    - pressure
    - chase
    - medium
    - player_metadata
    - matchup
    - type_based
  exclude:
    - venue_encoded
    - is_toss_winner
    - is_batting_first
  include_extra: []

model:
  type: "transformer"
  hyperparameters:
    epochs: 50
    batch_size: 64
    hidden_size: 256
    num_layers: 4
    nhead: 8
    dim_feedforward: 512
    dropout: 0.1
    lr: 0.0001
    weight_decay: 0.01
    warmup_epochs: 5
    max_seq_len: 120
    focal_gamma: 2.0
    label_smoothing: 0.1
  tune: false

evaluation:
  n_sims: 1000
  parallel: false

pipeline:
  skip_parsing: true
  skip_training: false
  skip_evaluation: false
