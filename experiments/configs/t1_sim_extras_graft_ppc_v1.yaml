experiment:
  name: t1_sim_extras_graft_ppc_v1
  registered: 2026-08-12
  purpose: >-
    Isolate the landed B18 empirical extras graft on the exact registered T1
    PPC cohort. Reuse the baseline selection, checkpoint, chronology, bowling
    policy and seeds; change only delivery-event rates and event-run laws.
  forbidden_data: [data/golden, forward_holdout]

data:
  baseline_raw: models/embeddings/t1_sim_ppc_v1/raw.json
  match_dir: data/t1_eval
  context_dir: data/t20s_json
  odds: betting_odds_polymarket_v2.json
  stats_version: v3
  player_metadata: data/all_players_enriched.csv

model:
  checkpoint: models/embeddings/t1
  device: cpu
  delivery_semantics: inclusive_total_runs_v1
  extras_graft: models/auto/b18/extras_graft_v1.json
  ball_calibration: none
  match_calibration: none

simulation:
  bowler_selector: empirical_b10
  bowler_usage: models/bowler_phase_usage.json
  n_sims: 200
  random_seed: 42
  parallel: false
  arm: actual_order_only

statistics:
  cluster: match
  bootstrap_repetitions: 5000
  bootstrap_seed: 29
  primary:
    - extras events per innings moves within 1.0 of actual
    - first-innings total bias and MAE improve versus flat-graft baseline
  context:
    - raw winner log loss and Brier
    - innings and phase posterior means

outputs:
  raw: models/embeddings/t1_sim_extras_graft_ppc_v1/raw.json
  summary: research/reports/embeddings/artifacts/t1_sim_extras_graft_ppc_v1_summary.json
