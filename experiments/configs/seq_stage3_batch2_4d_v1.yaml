# Sequence track — stage 3 / stage 4, BATCH 2, rung 4d (exposure sidecar).
#
# Registered BEFORE any batch-2 run, from
# docs/sequence_track/night3_design_draft.md (v7, 2026-09-12) § "Block E",
# rung 4d. The acceptance contract is
# docs/sequence_track/batch2_acceptance.md and the launch procedure is
# docs/sequence_track/night3_runbook.md § "Batch 2 (4d, 4b, C114)".
#
# WHY BATCH 2 IS THREE CONFIGS AND NOT ONE. `statistics.families` carries
# exactly ONE `shared_control` for the whole file, and that id is forced to
# `role: control` and may be a candidate in no family
# (stage2_stats.config_roles / registered_families). 4d's control is
# `mlp_counts`, C114's is `mlp_114`, and 4b has no run-shaped control at all
# (its reference is a frozen npz). One file cannot express three different
# shared controls, so the batch is registered as three files with one
# shared control each, and the queues carry three job groups.
#
# SCHEMA: identical to experiments/configs/seq_stage3_night3_v1.yaml, which
# scripts/sequence_track/retrain_stage2.py `load_config` validates and
# scripts/sequence_track/stage2_stats.py reads — the general family member
# form, `role`, `shared_control`, `slice_predicates`.
#
# SCHEDULE: this config runs the STAGE 2 EPOCH LOOP, not night 3's step
# budget. No configuration sets `params.max_steps` / `params.eval_every`, so
# `epochs: 30` with `patience: 3` is what every arm actually runs, and
# `_check_freeze_manifest` reads nothing: no arm names a
# `params.train_match_list`, no arm carries a step budget, and this file sets
# no `experiment.freeze_manifest`, so experiments/stage3a/manifest.json is
# never opened by this config. That is why there is no `freeze:` block here —
# there is no frozen match list or step budget to pin.

experiment:
  name: seq_stage3_batch2_4d
  registered: 2026-09-13
  block: E
  rung: 4d
  purpose: >-
    Does telling a token model HOW MUCH evidence its EB rate features rest on
    — and how spread out and how recent that evidence is — buy anything over
    the 50-feature contract alone? Two token-MLP arms on the same frame and
    the same epoch schedule: `mlp_counts` adds only the two as-of ball counts
    (batter and bowler), and `mlp_spread_recency` adds those two plus the
    twelve Dirichlet spread columns and the two recency counts. The contrast
    is spread PLUS recency against counts alone; it does NOT isolate spread.
  predecessor: experiments/configs/seq_stage3_night3_v1.yaml
  predecessor_note: >-
    the night-3 Block B registration, whose general family schema, role key
    and shared-control key this file reuses unchanged. Nothing here reuses a
    Block B or stage 2 checkpoint: every arm is trained fresh, and neither arm
    is any stage 2 `mlp` — both read the exposure sidecar, so neither may ever
    be tabled against a stage 2 or Block B number.
  decision_record: docs/sequence_track/batch2_acceptance.md
  design: docs/sequence_track/night3_design_draft.md
  runbook: docs/sequence_track/night3_runbook.md
  runner: scripts/sequence_track/retrain_stage2.py
  pin: scripts/sequence_track/pin_stage2.py
  queue:
    - research/sequence_track/queue_laptop_batch2.yaml
    - research/sequence_track/queue_mini_batch2.yaml
  queue_note: >-
    batch 2 is split BY SEED across two machines exactly as night 3 was:
    laptop seeds 7, 29, 42 and mini seeds 13, 101, every configuration on both.
    The split is by seed and never by arm, so no arm's five seeds are
    confounded with a machine relative to another arm's. Each job's output_dir
    is models/embeddings/seq_stage3/batch2/runs/<config_id>/seed_<seed>,
    because run_queue.sh decides skip-vs-run from the COMPLETE marker in
    output_dir plus the config sha256 alone and reads neither the command nor
    the seed subset.
  sign_convention: >-
    candidate minus reference, in validation log loss, negative favourable.
  evidence_status: >-
    VALIDATION-ONLY, PROVISIONAL. Checkpoint selection is on the same
    validation split the contrasts are computed on, the untouched cohort is
    NOT opened, and no test split, market price or betting layer is touched
    anywhere. Nothing here can be LANDED (CLAUDE.md invariant 9), nothing
    advances, and no artifact of record changes.
  forbidden_data:
    - data/golden
    - data/forward_holdout
  forbidden_data_note: >-
    no step of this rung reads either tree. The exposure sidecar was built by
    scripts/sequence_track/stage4_exposure.py over the i7 train and validation
    parquets only, with the test split, data/golden and data/forward_holdout
    fail-closed in stage4_guard.assert_permitted_inputs (sidecar manifest
    `sealed`).

data:
  # Identical to stage 2's data block.
  directory: data/xgb_data_i7
  frame_version: i7
  frame_role: ball_frame_i7
  stats_cache_role: stats_cache_i7
  splits_read: [train, validation]
  eval_kit: none
  feature_contract: transformer_t1.build_features
  n_features: 50
  extra_column_read: >-
    NONE from the frame. Both arms read the 50-feature contract unchanged and
    take their additional inputs from the row-aligned exposure sidecar below,
    which is keyed by (innings_id, ball_idx) and joined by the trainer.

# ---------------------------------------------------------------------------
# The frozen rung-4d sidecar. Built by scripts/sequence_track/stage4_exposure.py
# before any run; the driver hashes each `<split>.parquet` it reads into
# `arm_params.extra_features.sha256`, so a sidecar that drifts changes every
# affected run's identity and the reuse check refuses the old checkpoint.
# ---------------------------------------------------------------------------
extra_features_source:
  dir: models/embeddings/stage4/exposure
  manifest: models/embeddings/stage4/exposure/manifest.json
  manifest_sha256: a1072431d5042a7f726789de96666035e89e8f778933451797ed793860e1e60d
  built_at: '2026-09-12 19:47:31'
  k: 30
  variance_formula: "var_c = p_c(1-p_c)/(N+k+1), p_c = (n_c + k*pi_c)/(N+k)"
  as_of_rule: >-
    largest cache snapshot date <= match_date; snapshots for date D exclude
    D's own matches.
  recent_source: >-
    batting.recent_balls / bowling.recent_balls_bowled — ball counts over the
    cache's recency window (the player's five most recent match rows dated
    strictly before the match date; fewer than five uses what exists; zero
    when none).
  prior_provenance: >-
    pi is the i7 cache `_meta` global outcome prior
    [0.3040165819, 0.4113125191, 0.0757958436, 0.107802809, 0.046711275,
    0.0543609713]. It is a WHOLE-CORPUS prior over a cache that runs to
    2026-04-16 while the training split ends 2024-12-30, so it carries
    post-training exposure. The production 50-feature EB columns already carry
    the same prior, so it is a level effect shared by both arms rather than a
    per-arm advantage; its unknown differential effect is disclosed
    (known_asymmetries.prior_is_not_as_of).
  splits:
    - split: train
      file: models/embeddings/stage4/exposure/train.parquet
      sha256: 167730fb55c958c68606aea9cf68dbb29bc2690c01a36a0cdfc8b758f42c0ccc
      n_rows: 1876971
      batter_N_asof_median: 484.0
      bowler_N_asof_median: 500.0
      batter_N_zero_frac: 0.0372
      bowler_N_zero_frac: 0.0443
    - split: validation
      file: models/embeddings/stage4/exposure/validation.parquet
      sha256: aaeab6ba07c225f53d0ba3ac9c6d7efe6770e8bc767d2d14af011da00e6c0316
      n_rows: 124292
      batter_N_asof_median: 849.0
      bowler_N_asof_median: 930.0
      batter_N_zero_frac: 0.0214
      bowler_N_zero_frac: 0.0287
  column_naming_note: >-
    the design draft v7 writes the twelve spread fields as
    `{batter,bowler}_sd_{0,1,2,4,6,w}`. The sidecar on disk, the driver's
    registered `EXTRA_FEATURE_SETS["spread_recency"]` and this config all
    spell them `{batter,bowler}_var_p{0,1,2,4,6,w}`, which is what the
    parquet carries. Same quantity, one spelling; the draft's spelling is a
    prose variant and is recorded here so the two documents cannot be read as
    two different column sets.

training:
  # The stage 2 EPOCH loop, unchanged. No arm of this config sets
  # params.max_steps / params.eval_every, so early stopping is live:
  # `epochs: 30` with `patience: 3` on the validation log loss, and the
  # selected checkpoint is the best validation log loss over ALL validation
  # rows with ties broken by the earliest epoch.
  device: mps
  seeds: [7, 13, 29, 42, 101]
  dmodel: 128
  layers: 2
  heads: 4
  batch: 128
  epochs: 30
  learning_rate: 0.0003
  patience: 3
  aux: false
  no_kit: true
  score_test: false
  save_predictions: true
  early_stopping: >-
    LIVE, the stage 2 rule: training stops when the validation log loss has
    not improved for `patience: 3` consecutive epochs, or at `epochs: 30`,
    whichever comes first. This is the difference from night 3's Block B,
    which overrode the schedule with a fixed step budget; batch 2 does not.
  selection_rule: >-
    validation log loss = ball-weighted mean negative log-likelihood over ALL
    validation rows, for both arms.
  seed_policy: >-
    all five registered seeds run for both configurations; a family with fewer
    than five complete paired seeds is NOT_EVALUABLE and is never reported at
    a reduced seed count. Seeds are split laptop 7/29/42 and mini 13/101.

outputs:
  # The driver writes <outputs.directory>/<config_id>/seed_<seed>, and each
  # queue job's output_dir must be exactly that directory, so this ends in
  # `/runs` and the batch's tree is models/embeddings/seq_stage3/batch2/.
  directory: models/embeddings/seq_stage3/batch2/runs
  summary: summary.yaml
  per_run: [metrics.json, model.pt, run_record.json, predictions_validation.npz]
  save_row_aligned_probabilities: true

configurations:
  - id: mlp_counts
    arm: mlp
    role: control
    params:
      extra_features:
        dir: models/embeddings/stage4/exposure
        cols: [batter_N_asof, bowler_N_asof]
    access: {features: true, history: false, identity: false, prod_logits: false}
    history_input: none
    wiring: token_mlp
    reference: []
    reference_note: >-
      the SHARED CONTROL of this config (statistics.families.shared_control):
      family_4d's primary and both of its gates are taken against it, and it
      is a candidate in no family.
    tests: >-
      control — the 50-feature contract plus the two as-of ball counts
      `batter_N_asof` and `bowler_N_asof` only. It is NOT a bare 50-feature
      arm: both arms of this rung see the counts, so the registered contrast
      isolates spread-plus-recency and never confounds it with "the model was
      told how much data there is".
    queue_order: 1
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 7 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_counts/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 13 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_counts/seed_13
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 29 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_counts/seed_29
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 42 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_counts/seed_42
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 101 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_counts/seed_101

  - id: mlp_spread_recency
    arm: mlp
    role: candidate
    params:
      extra_features:
        dir: models/embeddings/stage4/exposure
        # The registered `spread_recency` set, written out in the driver's
        # exact order: the two counts, then the twelve Dirichlet spread
        # columns batter-before-bowler and class order 0,1,2,4,6,w, then the
        # two recency counts. The ORDER is model identity — the same sidecar
        # read in a different column order is a different model input and a
        # different `arm_params.extra_features` digest — so it is registered
        # explicitly rather than by set name.
        cols:
          - batter_N_asof
          - bowler_N_asof
          - batter_var_p0
          - batter_var_p1
          - batter_var_p2
          - batter_var_p4
          - batter_var_p6
          - batter_var_pw
          - bowler_var_p0
          - bowler_var_p1
          - bowler_var_p2
          - bowler_var_p4
          - bowler_var_p6
          - bowler_var_pw
          - batter_recent_N
          - bowler_recent_N
    access: {features: true, history: false, identity: false, prod_logits: false}
    history_input: none
    wiring: token_mlp
    reference: [mlp_counts]
    tests: >-
      candidate — the same 50-feature contract and the same two counts, plus
      the twelve Dirichlet spread columns
      (var_c = p_c(1-p_c)/(N+k+1), p_c = (n_c + k*pi_c)/(N+k), k = 30) and the
      two recency ball counts. Sixteen sidecar columns against two; everything
      else — frame, schedule, architecture, seeds — is identical.
    queue_order: 2
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 7 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof,batter_var_p0,batter_var_p1,batter_var_p2,batter_var_p4,batter_var_p6,batter_var_pw,bowler_var_p0,bowler_var_p1,bowler_var_p2,bowler_var_p4,bowler_var_p6,bowler_var_pw,batter_recent_N,bowler_recent_N --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_spread_recency/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 13 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof,batter_var_p0,batter_var_p1,batter_var_p2,batter_var_p4,batter_var_p6,batter_var_pw,bowler_var_p0,bowler_var_p1,bowler_var_p2,bowler_var_p4,bowler_var_p6,bowler_var_pw,batter_recent_N,bowler_recent_N --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_spread_recency/seed_13
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 29 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof,batter_var_p0,batter_var_p1,batter_var_p2,batter_var_p4,batter_var_p6,batter_var_pw,bowler_var_p0,bowler_var_p1,bowler_var_p2,bowler_var_p4,bowler_var_p6,bowler_var_pw,batter_recent_N,bowler_recent_N --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_spread_recency/seed_29
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 42 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof,batter_var_p0,batter_var_p1,batter_var_p2,batter_var_p4,batter_var_p6,batter_var_pw,bowler_var_p0,bowler_var_p1,bowler_var_p2,bowler_var_p4,bowler_var_p6,bowler_var_pw,batter_recent_N,bowler_recent_N --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_spread_recency/seed_42
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 101 --data-dir data/xgb_data_i7 --extra-features models/embeddings/stage4/exposure --extra-cols batter_N_asof,bowler_N_asof,batter_var_p0,batter_var_p1,batter_var_p2,batter_var_p4,batter_var_p6,batter_var_pw,bowler_var_p0,bowler_var_p1,bowler_var_p2,bowler_var_p4,bowler_var_p6,bowler_var_pw,batter_recent_N,bowler_recent_N --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_spread_recency/seed_101

queue_order_note: >-
  registered rung 4d order: mlp_counts, mlp_spread_recency. Five seeds each:
  10 runs, three on the laptop (7, 29, 42) and two on the mini (13, 101) per
  configuration. 4d is FIRST in the batch-2 queue order (4d, C114, 4b), as the
  design draft registers ("4d first").

statistics:
  registered_for: docs/sequence_track/batch2_acceptance.md
  per_row_log_loss: >-
    computed from the row-aligned validation probabilities each run saves
    (predictions_validation.npz), never from a scalar.
  contrasts:
    - name: spread_recency
      definition: "mlp_spread_recency - mlp_counts"
      role: mechanism
      registered_pairs: [[mlp_spread_recency, mlp_counts]]
      tests: >-
        the spread-plus-recency benefit — fourteen additional sidecar columns
        on top of the two counts both arms see, with the frame, the schedule
        and the architecture held fixed. This is the ONLY difference between
        the two arms.
  mechanism_note: >-
    exactly one mechanism entry carries `registered_pairs`, so
    stage2_stats.mechanism_contrasts reads the mechanism set FROM THIS CONFIG
    and not from the frozen stage 2 tuple (whose arm ids do not exist here).
  slice_predicates: {}
  slice_predicates_note: >-
    this rung registers NO optional slice. The eight frozen stage 2 names are
    computed unchanged and nothing is composed.
  slices: [all, death, chase, powerplay, middle, innings_1, innings_2,
           thin_pair]
  slices_note: >-
    the eight frozen stage 2 names, computed unchanged. `thin_pair` stays
    UNAVAILABLE: the i7 ball frame carries no exposure column and this config
    registers no
    `slice_predicates.thin_pair.{exposure_columns, threshold}`, so it is
    reported unavailable rather than invented. NOTE that the rung 4d SIDECAR
    does carry as-of exposure counts; wiring `thin_pair` to them would make
    the slice definition depend on an artifact only one rung reads, and is a
    separate registration that this file deliberately does not make.
  families:
    shared_control: mlp_counts
    definition: >-
      ONE registered family, on the single candidate-role configuration
      (`mlp_spread_recency`). It uses the GENERAL member form: every member
      names its own contrast {candidate, reference}, slice, kind and
      threshold, and exactly one member carries `primary: true`.
    gate_reference_rule: >-
      both non-inferiority gates are taken against the shared control
      `mlp_counts`, which is also the primary's reference, so every member of
      this family asks one question on three slices: does adding spread and
      recency cost anything relative to counts alone.
    multiplicity: holm
    multiplicity_scope: within a family, across its members
    holm:
      scope: >-
        Holm operates WITHIN the family, separately for each estimand /
        checkpoint readout.
      adjustment: >-
        step-down over the family's sorted raw p-values; with m members the
        adjusted value at rank r is min(1, max over j <= r of (m + 1 - j) *
        p_(j)), which makes the adjusted values monotone in rank.
      ties: stable in the registered member order
      missing_member: >-
        an unavailable member (a run that did not finish, a slice with no
        rows, a slice below ten blocks) takes a non-rejecting placeholder
        (adjusted p = 1), still occupies its slot, and the family CANNOT pass.
      raw_p: >-
        the threshold-centred two-sided percentile form
        p = min(1, 2 * min[P(d* - t <= 0), P(d* - t >= 0)]) over the bootstrap
        draws d*, with t = 0 for a superiority member and t = +0.002 for a
        non-inferiority gate.
    map:
      - candidate: mlp_spread_recency
        holm_group: family_4d
        all_row_condition: member
        members:
          - name: primary
            primary: true
            kind: superiority
            threshold: 0.0
            slice: all
            contrast: {candidate: mlp_spread_recency, reference: mlp_counts}
            label: "mlp_spread_recency - mlp_counts on all"
            tests: >-
              the spread-plus-recency benefit on all rows. This member IS the
              inherited candidate-minus-shared-control all-row condition, so
              `all_row_condition: member` discharges it inside the family.
          - name: death_gate
            kind: non_inferiority
            threshold: 0.002
            slice: death
            contrast: {candidate: mlp_spread_recency, reference: mlp_counts}
            label: "mlp_spread_recency - mlp_counts on death"
          - name: chase_gate
            kind: non_inferiority
            threshold: 0.002
            slice: chase
            contrast: {candidate: mlp_spread_recency, reference: mlp_counts}
            label: "mlp_spread_recency - mlp_counts on chase"
        screen:
          require: [primary, death_gate, chase_gate]
        note: >-
          decision-bearing and registered once. SCREEN_PASS requires all three
          members to reject favourably (primary U95 < 0, each gate strictly
          U95 < +0.002) under Holm, with at least ten tournament blocks on
          each member's slice, five complete paired seeds, and at least 4 of 5
          favourable per-seed directions on `primary`.
    map_is_complete: >-
      one family, one candidate-role configuration. `mlp_counts` is the shared
      control and a candidate in no family.
    exploratory: >-
      every contrast on every slice that is not a registered family member:
      both arms against the three frozen stage 4 references
      (`ref_eb_ctx` 1.4500, `ref_lin_50` 1.4433, `ref_raw_ctx` 1.4534) as a
      DESCRIPTIVE level readout only — those references are deterministic npz
      files, not runs, so no family member may take one as its reference (see
      deviations.fixed_reference_is_not_a_member) — and
      `mlp_spread_recency - mlp_counts` on the five non-member slices.
  bootstrap:
    contract: tournament_time_block_v1
    blocks_from: scripts/sim_eval/eval_statistics.load_competition_clusters
    block_source_dir: data/t20s_json
    block_key: cricsheet match id
    resample: tournament blocks, not matches
    reps: 2000
    seed: 29
    weighting: ball_weighted
    min_blocks: 10
    below_min_blocks: descriptive
    ten_block_rule_applies_to: >-
      every REQUIRED member slice of the family, checked on tournament blocks
      of that slice's validation rows and never on match counts. A required
      slice with fewer than ten blocks is descriptive and the family CANNOT
      pass.
    invariant: >-
      CLAUDE.md critical invariant 7 — fewer than 10 blocks is descriptive,
      never a CI-clean claim.
  estimands:
    - {id: i, definition: per checkpoint (one seed), reported: separately}
    - {id: ii, definition: joint resampling of seeds and tournament blocks,
       reported: separately}
  non_inferiority:
    margin_ll: 0.002
    sign: >-
      a candidate is non-inferior on a gate slice when U95, the 97.5th
      percentile of the paired harm draws of (candidate - mlp_counts), is
      STRICTLY below +0.002 log loss. U95 = 0.002 exactly does not pass.
    applies_to: [death, chase]
    reference: mlp_counts
    raw_p: >-
      the same threshold-centred two-sided percentile form as a superiority
      member, with t = +0.002:
      p = min(1, 2 * min[P(d* - 0.002 <= 0), P(d* - 0.002 >= 0)]).
    not_imported_from_stage_1: >-
      stage 1's +-0.007 parity margin and its parity classification are NOT
      imported; this rung's only margin is +0.002 on log loss.
  interval_labelling:
    rank_local: >-
      every per-arm or per-rank interval is labelled "rank-local percentile
      interval; not simultaneous; not the rejection rule". The rejection rule
      is the Holm-adjusted family, never an interval read off a table.
  labelling:
    five_seed_night: screen
    note: >-
      five seeds make the direction count readable; they do not make a
      validation-only, selection-on-the-same-split screen confirmatory. No arm
      is promoted on this rung, and no market or betting claim exists.

