deviations:
  - id: fixed_reference_is_not_a_member
    statement: >-
      the three frozen stage 4 references (`ref_eb_ctx`, `ref_lin_50`,
      `ref_raw_ctx`) are read DESCRIPTIVELY only. No family member of this
      config takes one as its reference.
    reason: >-
      stage2_stats loads every family member's candidate and reference from
      `<runs_root>/<config_id>/seed_<s>/predictions_validation.npz`, so a
      member's reference must be a registered CONFIGURATION with runs. A
      deterministic npz has no run directory and no seeds. The design draft
      asks for both arms to be "reported against the three references"; that
      report is a level comparison of validation log losses, carries no
      interval and no Holm slot, and cannot pass or fail anything. The same
      limitation is what defers rung 4b's family — see
      experiments/configs/seq_stage3_batch2_4b_v1.yaml.
  - id: spread_and_recency_move_together
    statement: >-
      `mlp_spread_recency` adds the twelve spread columns AND the two recency
      counts in one step; no arm adds spread alone.
    reason: >-
      registered as the design draft registers it ("the arm adds spread PLUS
      recency; it does not isolate spread"). A favourable primary therefore
      licenses no claim about spread specifically, and an unfavourable one
      licenses no claim about recency specifically.
  - id: epoch_schedule_not_step_budget
    statement: >-
      batch 2 runs the stage 2 epoch loop with live early stopping, while
      night 3's Block B ran a fixed 3,840-step budget.
    reason: >-
      the two are different schedules and their numbers are not comparable. No
      batch-2 arm may be tabled against a Block B arm, and this file registers
      no Block B configuration id.

known_asymmetries:
  - id: prior_is_not_as_of
    text: >-
      the Dirichlet spread columns shrink toward the i7 cache's WHOLE-CORPUS
      global prior, which was computed over a corpus running to 2026-04-16
      while the training split ends 2024-12-30. `mlp_spread_recency` reads
      that prior through fourteen columns and `mlp_counts` through none, so
      the two arms are not equally exposed to it. The production 50-feature EB
      columns both arms read already carry the same prior, so this is a
      difference of degree; the differential effect is unknown and is
      disclosed rather than adjusted for.
  - id: sixteen_inputs_against_two
    text: >-
      the candidate has fourteen more input columns and therefore more
      first-layer parameters than the control. Parameter counts are reported
      per run in `arm_params.n_parameters`; the contrast is "these columns"
      and never "this capacity".
  - id: token_mlp_has_no_attention_layer
    text: >-
      both arms are token_mlp, so neither has an attention layer and none of
      this rung's readings bears on any sequence mechanism.
  - id: exposure_counts_are_as_of_the_cache_not_the_ball
    text: >-
      the sidecar's as-of rule is the largest cache snapshot date <= the match
      date, so within a match every ball of both innings carries the same
      count; exposure does not advance ball by ball. Both arms are affected
      identically, but a reading must not be described as "balls faced so far
      in this innings".

known_limitations:
  - >-
    SEED-MACHINE CONFOUNDING, inherited from nights 1 and 3 and not modelled:
    seeds 7, 29 and 42 run on the laptop and 13, 101 on the mini, and MPS
    kernels are not bit-reproducible across machines. The split is BY SEED, so
    both arms carry the same three-laptop / two-mini mix and neither is
    advantaged; the machine is still a component of each per-seed number and
    is reported, never adjusted for.
  - >-
    checkpoint selection uses the same validation split the contrasts are
    computed on, so every number of this rung is screening evidence.
  - >-
    MPS kernels are not bit-reproducible across runs or machines, so a rerun
    of any checkpoint may differ in the low decimals; every checkpoint records
    mps_bit_reproducible false.
  - >-
    the global outcome prior in the stats cache is not as-of-date and venue
    history in the frame is not recency-weighted. Both are inherited frame
    limitations; see known_asymmetries.prior_is_not_as_of for the part of it
    that is NOT symmetric between these two arms.
  - >-
    early stopping at patience 3 on the validation split means the two arms
    may stop at different epochs. Steps-to-best and the stopping epoch are
    reported per run so the difference is visible; equal-compute is NOT
    claimed.

