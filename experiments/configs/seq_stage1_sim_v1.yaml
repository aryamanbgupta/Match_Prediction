clipping:
  bounds:
  - 0.01
  - 0.99
  seam: MatchLevelEvaluator.prob_clip, applied at the single seam MatchLevelEvaluator._clip_and_normalize
  seam_source: scripts/sim_eval/match_evaluator.py
  applied_where: after the tie-free renormalisation and before log loss, Brier,
    edge and bet placement, on both evaluation paths
  default: prob_clip = None, which reproduces the historical DEFAULT_PROB_CLIP =
    [0.05, 0.95] exactly, so every existing runner and every stored BR2 result is
    unchanged
  replaces_not_composes: the seam REPLACES the evaluator's historical unconditional
    [0.05, 0.95] clip; it does not compose with it. The registered stage-1 clip
    is therefore WIDER than every previous run's, including BR2 G1, so a stage-1
    winner log loss is not comparable to any number produced under the [0.05, 0.95]
    clip
  enabled_by: run_arm.py --clip-low 0.01 --clip-high 0.99
  why: at 100 sims the plug-in winner probability has SE 0.05 at p = 0.5; a 0/100
    or 100/100 draw must not cost an unbounded log loss, and a 0.05 floor would
    hide real confidence at the resolution stage 1 is trying to measure
convergence_protocol:
  candidates: 'n_sims doubles from 100 with no ceiling: 100, 200, 400, 800, ...'
  first_candidate: 100
  batches_per_arm_per_candidate: 3
  batch_base_seeds:
  - 20260910
  - 20260911
  - 20260912
  batch_independence: three independent simulation batches per arm per candidate,
    one per registered batch base seed; the fixture set, chronology, selector and
    extras law are identical across batches
  shard: 'the 1b timing shard: 10 fixtures chosen to include long innings'
  statistic: the paired C-B and B-A winner log loss on the shard, computed per batch
  stop_rule: stop at the smallest n_sims at which the 95% range of the paired C-B
    and B-A winner LL across the three batches is below 0.002
  threshold: 0.002
  chosen_n_sims: to_be_filled_before_1d
  chosen_n_sims_drives: the --n-sims token in every arm's full_run.command; both
    are rendered from pin_stage1.CHOSEN_N_SIMS
  spread_table_columns:
  - n_sims
  - contrast
  - batch_1_delta_ll
  - batch_2_delta_ll
  - batch_3_delta_ll
  - range_95
  - below_threshold
  spread_table: []
  fill_before: 1d (the full 255-fixture run)
decision_rule:
  primary_slice: '>=$50k (--min-volume 50000)'
  reported_slices:
  - all
  - '50000'
  - '100000'
  sign_convention: every contrast is candidate minus reference, in winner log loss,
    so a negative delta is favourable to the candidate
  equivalence_margin_ll: 0.007
  margin_basis: the branch-wide seed-noise floor (claim_gate SEED_FLOOR = 0.007);
    a difference below it is not resolvable by this protocol
  confirmatory_family:
  - contrast: C-B
    candidate: C
    reference: B
    slice: '50000'
    question: incremental sequence value in rollout
    decision_it_feeds: whether learned sequence adds anything over the same features
      without sequence memory; it is evidence, not by itself an advancement
  - contrast: B-A
    candidate: B
    reference: A
    slice: '50000'
    question: system comparison, token MLP vs production
    decision_it_feeds: B advances only if this is favourable
  - contrast: C-A
    candidate: C
    reference: A
    slice: '50000'
    question: system comparison, full T1 vs production
    decision_it_feeds: C advances only if this is favourable
  multiplicity: Holm adjustment across the three confirmatory contrasts (C-B, B-A,
    C-A); the family is fixed here, before any run
  exploratory_contrasts:
  - contrast: A50-A
    candidate: A50
    reference: A
    slice: '50000'
    label: exploratory system contrast
    note: A50 is the equal-information control for the A-vs-B/C comparison; it is
      outside the confirmatory family, is not Holm-adjusted, and cannot advance
      anything
  outcomes:
    parity: the 95% block interval lies entirely inside [-0.007, +0.007]
    favourable: the 95% block interval excludes zero and the point estimate is below
      -0.007
    adverse: the 95% block interval excludes zero and the point estimate is above
      +0.007
    inconclusive: anything else
  advancement: 'symmetric: B advances only if B-A is favourable, C advances only
    if C-A is favourable; a favourable C-B on its own is sequence evidence for stage
    2, not an advancement'
  market_claim: no winner-LL result is a market claim. A market claim additionally
    requires the claim gate's market comparison with the registered cost scenarios
    below, and a paired Δprofit or ΔROI interval, per program.md's LANDED rule
  cost_scenarios:
  - spread 0 bps, fee 0 bps on winnings
  - spread 100 bps, fee 0 bps on winnings
  - spread 200 bps, fee 0 bps on winnings
  - spread 100 bps, fee 100 bps on winnings
  - spread 100 bps, fee 100 bps on stake
  estimands_reported_separately:
  - the registered checkpoint's own performance, with uncertainty from paired tournament-block
    resampling of matches and independent simulation batches
  - across-training-seed robustness, which this single-checkpoint screen does NOT
    measure and must not be read from it
scoring:
  winner_log_loss:
    status: confirmatory
    gate: scripts/sim_eval/claim_gate.py
    kind: match_model
    odds_role: odds_iteration_v2
    cluster_source_dir: data/polymarket_test_v2
    cluster_source_dir_role: iteration_set_v2
    slices:
    - all
    - '50000'
    - '100000'
    uncertainty: 'tournament_time_block_v1: 10,000 seed-42 whole-event resamples
      with explicit bet placement; fewer than 10 blocks is descriptive, never a
      claim'
    prices: the gate recomputes prices, placement and profit from the registered
      odds role; stored prices in an eval JSON are never evidence
    cost_scenarios:
    - spread 0 bps, fee 0 bps on winnings
    - spread 100 bps, fee 0 bps on winnings
    - spread 200 bps, fee 0 bps on winnings
    - spread 100 bps, fee 100 bps on winnings
    - spread 100 bps, fee 100 bps on stake
    command_template: uv run --no-sync python scripts/sim_eval/claim_gate.py --kind
      match_model --candidate <candidate arm dir>/sliced_50000.json --baseline <reference
      arm dir>/sliced_50000.json --odds-role odds_iteration_v2 --cluster-source-dir
      data/polymarket_test_v2 --out <gate output>.json
  realism:
    status: exploratory
    scorer: scripts/sequence_track/score_realism.py
    input: <arm output dir>/raw_sims.jsonl
    output: <arm output dir>/realism.json
    metrics:
    - innings score P10/P50/P90 coverage of the actual innings
    - first-innings score bias
    - extras per innings
    - wickets per innings
    - unique bowlers used per innings
    - batting-first minus chasing flip on the PPC cohort
    note: read after the confirmatory contrasts; no realism number advances an arm
      or supports a claim
  props:
    status: exploratory
    scorer: scripts/sequence_track/score_props.py
    baseline: scripts/sim_eval/prop_fair_baselines.py
    corpus: models/prop_fair_baseline_corpus_v2.pkl
    corpus_role: prop_fair_baseline_corpus_v2
    corpus_md5: a78b7c3f933f68fac5f2422292e979d8
    input: <arm output dir>/raw_sims.jsonl
    output: <arm output dir>/props.json
    metric: paired per-family Brier (mean absolute error for the four *_mae families),
      sim minus as-of fair baseline, per arm
    bar: 'E2 v2: no binary prop family beats an as-of fair baseline, so a prop claim
      must clear the versioned fair baseline, never a base rate'
    families:
    - top_batter
    - top_bowler
    - batter_50plus
    - batter_6plus_six
    - batter_fours_1plus
    - batter_fours_2plus
    - batter_fours_3plus
    - bowler_wkts_1plus
    - bowler_wkts_2plus
    - bowler_wkts_3plus
    - innings_runs_ou_160_5
    - innings_runs_ou_170_5
    - innings_runs_ou_180_5
    - pp_total_ou_45_5
    - pp_total_ou_50_5
    - pp_total_ou_55_5
    - team_highest_individual_ou_29_5
    - team_highest_individual_ou_34_5
    - team_highest_individual_ou_39_5
    - first_wicket_runs_ou_30_5
    - match_total_sixes_ou_15_5
    - match_total_sixes_ou_20_5
    - highest_over_runs_ou_18_5
    - highest_over_runs_ou_24_5
    - batter_runs_mae
    - team_total_fours_mae
    - team_total_sixes_mae
    - team_first_over_mae
    - highest_individual_mae
    note: prop_backtest.py builds its own XGBoostModelV2 and has no T1 seam, so
      the stage-1 prop scorer consumes the arm runner's own per-simulation output
      instead of re-simulating
deviations:
- id: single_global_rng_stream
  what: the plan registers three named RNG sub-streams (outcome, extras, selector);
    the engine seeds ONE global random/np.random stream per simulation (SimulationConfig.random_seed
    + i) and outcome sampling, extras, selector draws and run-outs all draw from
    it
  why: separating the streams needs an engine-wide RNG refactor of sim_v1_2.SimulationEngine,
    which is the BR2-gated engine; stage 1 must not change the engine it is measuring
  consequence: the sub-seeds are derived and recorded in arm_provenance.json but
    are not separately consumed. Every arm still shares one identical draw schedule
    per fixture, which is what the paired comparison needs; what is lost is the
    ability to hold, say, the extras draws fixed while the outcome draws move
  second_consequence: 'the engine''s additive scheme (random_seed + i for the i-th
    simulation) makes ONE fixture occupy the seed interval [fixture_seed, fixture_seed
    + n_sims). Two fixtures whose intervals intersect replay the same draw schedule
    at the shared seeds, so their Monte Carlo errors are correlated inside every
    arm and the run has fewer independent draws than n_sims x fixtures suggests.
    The chance of some collision GROWS with n_sims (about N^2 * n_sims / 2^31 for
    N fixtures), and it does NOT cancel in a paired contrast: the draws are shared,
    but each arm''s model maps them to a different match, so the induced error is
    model-dependent. This is guarded, not assumed away — run_arm refuses to launch
    on any overlap in its own fixture set, and seeds.overlap_check screens every
    convergence candidate over the full registered set for every registered base
    seed'
  status: stream separation deferred; the interval overlap it causes is screened
    and refused at launch
- id: extras_graft_attribute_seam
  what: the B18 extras sidecar reaches the XGBoost arms (A, A50) through the public
    XGBoostModelV2.extras_graft attribute set by run_arm._apply_extras_graft, not
    through a constructor argument
  why: XGBoostModelV2 exposes no explicit-path seam for the graft; it only auto-detects
    an extras_graft_v1.json sitting beside the model artifact, and neither production
    model directory carries one. The attribute is what the engine reads and what
    the T1 wrapper sets from T1_EXTRAS_GRAFT_PATH, so both families end up on the
    same law without editing sim_v1_2.py
  consequence: run_arm refuses to run if a model directory carries its own sidecar
    that differs from the requested one, so an ambiguous extras law fails closed
    rather than passing silently
  status: accepted
- id: run_out_sidecar_absent
  what: the plan lists a run-out sidecar among the pinned artifacts; models/auto/d15/runout_rates.json
    is absent on this checkout
  why: the run-out rate is a code constant, sim_v1_2.RUNOUT_P; the sidecar the engine
    banner cites was never committed
  consequence: the config pins the constant, its value read by import, and its source
    line, and the engine md5 in provenance covers any change to it
  status: accepted
- id: scorers_consume_raw_sims
  what: the realism and prop scorers read the arm runner's raw_sims.jsonl instead
    of re-simulating through prop_backtest.py
  why: prop_backtest.py constructs XGBoostModelV2 directly and has no T1 seam, so
    it cannot score B or C at all; re-simulating would also break the identical-draw-schedule
    guarantee
  consequence: realism and prop numbers describe exactly the simulations the winner-LL
    numbers came from; they are not comparable line for line with historical prop_backtest.py
    reports
  status: accepted
- id: no_parallel_within_a_run
  what: run_arm.py refuses --parallel; sharding across processes is the only parallelism
  why: the same-day replay lifecycle is strictly sequential — it orders every stats
    read — and stage 1 needs one deterministic prediction-time cutoff per fixture
  consequence: the 1c shard-consistency check exists precisely because sharding
    is the only way to use more than one core; each shard keeps the full replay
    context
  status: accepted
- id: clip_seam_replaces_rather_than_composes
  what: MatchLevelEvaluator.prob_clip REPLACES the evaluator's historical unconditional
    [0.05, 0.95] clip; it does not compose with it, so stage 1 runs at a strictly
    wider clip than every earlier run
  why: composing would leave the 0.05 floor in force and make the registered [0.01,
    0.99] bound decorative; replacing is the only way to measure at the resolution
    the plan asks for
  consequence: no stage-1 winner log loss is comparable to any number produced under
    the [0.05, 0.95] clip, BR2 G1 included. prob_clip = None still reproduces the
    legacy behaviour exactly, so no existing runner or stored result moves
  status: accepted
- id: resolved_flag_reads_cricsheet_not_the_odds_row
  what: the `resolved` eligibility flag is read from the cricsheet document's info.outcome.winner,
    not from the odds row's actual_winner field
  why: eligibility must be identical across arms by construction, and the cricsheet
    document is the one input every arm sees identically; an odds-row field could
    differ if the odds loader ever changed
  consequence: a fixture the odds file calls settled but cricsheet records with
    no winner (a no-result or an abandoned match) counts as unresolved for every
    arm alike. The cross-arm audit tests a real invariant rather than a copied field
  status: accepted
- id: as_of_stamp_for_odds_less_fixtures
  what: for a fixture with no odds row there is no prediction lock, so its as-of
    stamp is taken at begin_match instead of at lock_prediction
  why: the runner only locks a prediction when one is required; nothing advances
    between begin_match and lock_prediction, so the begin_match snapshot IS the
    state at the point a lock would have happened
  consequence: the two stamps are equal wherever both exist, and the audit compares
    them across arms uniformly; an odds-less fixture is still stamped and still
    audited
  status: accepted
- id: roster_selector_installed_by_factory_swap
  what: run_sim_eval.py has no roster-policy flag, so run_arm swaps the module-level
    EmpiricalBowlerSelector for a factory that builds RosterEmpiricalBowlerSelector
    when --bowler-roster-policy is given
  why: adding a flag to the frozen runner would change the runner stage 1 is meant
    to leave alone; the factory swap is confined to the arm runner
  consequence: WITHOUT --bowler-roster-policy no roster policy is applied and the
    arm silently runs the plain empirical selector, which is NOT the registered
    configuration. Every command line in this config carries the flag, and the cross-arm
    audit asserts the selector class and roster hash match across arms
  status: accepted
known_asymmetries:
- id: stats_cache_i7_vs_v3
  what: A and A50 serve from the i7 stats cache (models/player_stats_cache_i7.sqlite);
    B and C serve from the legacy v3 cache (models/player_stats_cache_v3.sqlite)
  why: the ablation checkpoints were trained on data/xgb_data_v3 and sim_t1.py refuses
    any other frame
  consequence: B-A and C-A are system contrasts across two caches, not model-only
    contrasts. C-B is within one cache and is the only clean incremental comparison
  removable_in_stage_0: false
- id: training_frame_i7_vs_v3
  what: A and A50 are trained on the i7 identity frame (data/xgb_data_i7); B and
    C are trained on the pre-I7 v3 frame (data/xgb_data_v3, 467 raw venue strings)
  why: 'the same constraint: the ablation lineage predates the I7 identity contract,
    and the v3 frame fail-closes under it, so those checkpoints cannot be retrained
    on i7 without a new training run outside stage 1''s scope'
  consequence: any A-vs-B or A-vs-C difference confounds venue identity resolution
    with the model; A50 narrows the feature-set part of that confound but not the
    frame part
  removable_in_stage_0: false
- id: arm_a_path_is_the_replay_lifecycle
  what: arm A runs through the T1 replay lifecycle (SameDayReplayStatsProvider +
    _T1ReplayEvaluator via run_arm.py), not through the BR2 snapshot runner it was
    measured on
  why: identical prediction-time cutoffs across arms are only possible if one runner
    drives every arm; the replay provider's tracker view implements every provider
    method XGBoostModelV2's feature builder calls
  consequence: BR2's G1 winner-LL line is NOT a stage-1 reference number for arm
    A. The only valid reference for every stage-1 contrast is arm A's own stage-1
    run under this config
  removable_in_stage_0: false
- id: br2_g1_is_not_a_stage_1_number
  what: BR2 G1 ran arm A's model with the plain EmpiricalBowlerSelector, the snapshot
    stats provider, and the evaluator's unconditional [0.05, 0.95] clip. Stage 1
    runs the same model with RosterEmpiricalBowlerSelector, the SameDayReplayStatsProvider,
    and the registered [0.01, 0.99] clip
  why: 'three separate stage-1 requirements force the change: the plan''s roster-aware
    selector, one replay chronology shared by every arm, and a clip wide enough
    not to mask the resolution being measured'
  consequence: NO stage-1 number is comparable to BR2, in either direction. A stage-1
    result that differs from BR2's G1 line is not evidence of anything; the only
    admissible baseline for B-A, C-A and A50-A is arm A's own run under this config
  removable_in_stage_0: false
