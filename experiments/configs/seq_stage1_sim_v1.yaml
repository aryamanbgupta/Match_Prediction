experiment:
  name: seq_stage1_sim_v1
  registered: '2026-09-10'
  purpose: 'Run four ball models (A production i7, A50 the same family at equal
    information, B token MLP, C full T1) through ONE simulator, one chronology,
    one set of same-day replay cutoffs, one bowler selector, one extras law and
    one per-fixture seed schedule, so the winner-market comparison isolates the
    model and nothing else. Two questions: system comparison (B-A, C-A) and the
    registered full-sequence T1 versus token-MLP contrast in rollout (C-B), which
    compares two specific architectures rather than isolating sequence memory.'
  plan: docs/SEQUENCE_TRACK_PLAN.md, sections "Stage 0" and "Stage 1"
  acceptance: docs/sequence_track/stage0_acceptance.md, section "D5"
