deviations:
- id: single_global_rng_stream
  what: the plan registers three named RNG sub-streams (outcome, extras, selector);
    the engine seeds ONE global random/np.random stream per simulation (SimulationConfig.random_seed
    + i) and outcome sampling, extras, selector draws and run-outs all draw from
    it
  why: separating the streams needs an engine-wide RNG refactor of sim_v1_2.SimulationEngine,
    which is the BR2-gated engine; stage 1 must not change the engine it is measuring
  consequence: the sub-seeds are derived and recorded in arm_provenance.json but
    are not separately consumed. Every arm still shares one identical draw schedule
    per fixture, which is what the paired comparison needs; what is lost is the
    ability to hold, say, the extras draws fixed while the outcome draws move
  second_consequence: 'the engine''s additive scheme (random_seed + i for the i-th
    simulation) makes ONE fixture occupy the seed interval [fixture_seed, fixture_seed
    + n_sims). Two fixtures whose intervals intersect replay the same draw schedule
    at the shared seeds, so their Monte Carlo errors are correlated inside every
    arm and the run has fewer independent draws than n_sims x fixtures suggests.
    The chance of some collision GROWS with n_sims (about N^2 * n_sims / 2^31 for
    N fixtures), and it does NOT cancel in a paired contrast: the draws are shared,
    but each arm''s model maps them to a different match, so the induced error is
    model-dependent. This is guarded, not assumed away — run_arm refuses to launch
    on any overlap in its own fixture set, and seeds.overlap_check screens every
    convergence candidate over the full registered set for every registered base
    seed'
  status: stream separation deferred; the interval overlap it causes is screened
    and refused at launch
- id: extras_graft_attribute_seam
  what: the B18 extras sidecar reaches the XGBoost arms (A, A50) through the public
    XGBoostModelV2.extras_graft attribute set by run_arm._apply_extras_graft, not
    through a constructor argument
  why: XGBoostModelV2 exposes no explicit-path seam for the graft; it only auto-detects
    an extras_graft_v1.json sitting beside the model artifact, and neither production
    model directory carries one. The attribute is what the engine reads and what
    the T1 wrapper sets from T1_EXTRAS_GRAFT_PATH, so both families end up on the
    same law without editing sim_v1_2.py
  consequence: run_arm refuses to run if a model directory carries its own sidecar
    that differs from the requested one, so an ambiguous extras law fails closed
    rather than passing silently
  status: accepted
- id: run_out_sidecar_absent
  what: the plan lists a run-out sidecar among the pinned artifacts; models/auto/d15/runout_rates.json
    is absent on this checkout
  why: the run-out rate is a code constant, sim_v1_2.RUNOUT_P; the sidecar the engine
    banner cites was never committed
  consequence: the config pins the constant, its value read by import, and its source
    line, and the engine md5 in provenance covers any change to it
  status: accepted
- id: scorers_consume_raw_sims
  what: the realism and prop scorers read the arm runner's raw_sims.jsonl instead
    of re-simulating through prop_backtest.py
  why: prop_backtest.py constructs XGBoostModelV2 directly and has no T1 seam, so
    it cannot score B or C at all; re-simulating would also break the identical-draw-schedule
    guarantee
  consequence: realism and prop numbers describe exactly the simulations the winner-LL
    numbers came from; they are not comparable line for line with historical prop_backtest.py
    reports
  status: accepted
- id: no_parallel_within_a_run
  what: run_arm.py refuses --parallel; sharding across processes is the only parallelism
  why: the same-day replay lifecycle is strictly sequential — it orders every stats
    read — and stage 1 needs one deterministic prediction-time cutoff per fixture
  consequence: the 1c shard-consistency check exists precisely because sharding
    is the only way to use more than one core; each shard keeps the full replay
    context
  status: accepted
- id: clip_seam_replaces_rather_than_composes
  what: MatchLevelEvaluator.prob_clip REPLACES the evaluator's historical unconditional
    [0.05, 0.95] clip; it does not compose with it, so stage 1 runs at a strictly
    wider clip than every earlier run
  why: composing would leave the 0.05 floor in force and make the registered [0.01,
    0.99] bound decorative; replacing is the only way to measure at the resolution
    the plan asks for
  consequence: no stage-1 winner log loss is comparable to any number produced under
    the [0.05, 0.95] clip, BR2 G1 included. prob_clip = None still reproduces the
    legacy behaviour exactly, so no existing runner or stored result moves
  status: accepted
- id: resolved_flag_reads_cricsheet_not_the_odds_row
  what: the `resolved` eligibility flag is read from the cricsheet document's info.outcome.winner,
    not from the odds row's actual_winner field
  why: eligibility must be identical across arms by construction, and the cricsheet
    document is the one input every arm sees identically; an odds-row field could
    differ if the odds loader ever changed
  consequence: a fixture the odds file calls settled but cricsheet records with
    no winner (a no-result or an abandoned match) counts as unresolved for every
    arm alike. The cross-arm audit tests a real invariant rather than a copied field
  status: accepted
- id: as_of_stamp_for_odds_less_fixtures
  what: for a fixture with no odds row there is no prediction lock, so its as-of
    stamp is taken at begin_match instead of at lock_prediction
  why: the runner only locks a prediction when one is required; nothing advances
    between begin_match and lock_prediction, so the begin_match snapshot IS the
    state at the point a lock would have happened
  consequence: the two stamps are equal wherever both exist, and the audit compares
    them across arms uniformly; an odds-less fixture is still stamped and still
    audited
  status: accepted
- id: roster_selector_installed_by_factory_swap
  what: run_sim_eval.py has no roster-policy flag, so run_arm swaps the module-level
    EmpiricalBowlerSelector for a factory that builds RosterEmpiricalBowlerSelector
    when --bowler-roster-policy is given
  why: adding a flag to the frozen runner would change the runner stage 1 is meant
    to leave alone; the factory swap is confined to the arm runner
  consequence: WITHOUT --bowler-roster-policy no roster policy is applied and the
    arm silently runs the plain empirical selector, which is NOT the registered
    configuration. Every command line in this config carries the flag, and the cross-arm
    audit asserts the selector class and roster hash match across arms
  status: accepted
known_asymmetries:
- id: feature_set_114_vs_50
  what: A carries 114 features; A50, B and C carry 50
  why: the T1 stack was built on a 50-column pre-ball feature list; the production
    ball model uses the full 114-column i7 frame
  consequence: 'B-A and C-A are system contrasts, not model-only contrasts: they
    compare a 114-feature system with a 50-feature one. A50-A isolates the feature
    set at equal information, within one model family (same family, same frame,
    same cache, same hyperparameters, 50 columns instead of 114). C-B is the registered
    full-sequence T1 versus token-MLP contrast (architectures differ in outcome-history
    embedding, attention and parameter count), so it is not an isolation of sequence
    memory: it is a comparison of two specific architectures that happen to differ
    in several ways at once'
  removable_in_stage_0: false
- id: arm_a_path_is_the_replay_lifecycle
  what: arm A runs through the T1 replay lifecycle (SameDayReplayStatsProvider +
    _T1ReplayEvaluator via run_arm.py), not through the BR2 snapshot runner it was
    measured on
  why: identical prediction-time cutoffs across arms are only possible if one runner
    drives every arm; the replay provider's tracker view implements every provider
    method XGBoostModelV2's feature builder calls
  consequence: BR2's G1 winner-LL line is NOT a stage-1 reference number for arm
    A. The only valid reference for every stage-1 contrast is arm A's own stage-1
    run under this config
  removable_in_stage_0: false
- id: br2_g1_is_not_a_stage_1_number
  what: BR2 G1 ran arm A's model with the plain EmpiricalBowlerSelector, the snapshot
    stats provider, and the evaluator's unconditional [0.05, 0.95] clip. Stage 1
    runs the same model with RosterEmpiricalBowlerSelector, the SameDayReplayStatsProvider,
    and the registered [0.01, 0.99] clip
  why: 'three separate stage-1 requirements force the change: the plan''s roster-aware
    selector, one replay chronology shared by every arm, and a clip wide enough
    not to mask the resolution being measured'
  consequence: NO stage-1 number is comparable to BR2, in either direction. A stage-1
    result that differs from BR2's G1 line is not evidence of anything; the only
    admissible baseline for B-A, C-A and A50-A is arm A's own run under this config
  removable_in_stage_0: false
removed_asymmetries:
- id: stats_cache_i7_vs_v3
  removed_on: '2026-09-11'
  what_it_said: A and A50 served from the i7 stats cache while B and C served from
    the legacy v3 cache, so B-A and C-A were contrasts across two caches
  reason: 'removed by the 2026-09-11 retrain on the i7 frame: all four arms now
    serve from models/player_stats_cache_i7.sqlite, and every arm block pins the
    same cache md5'
- id: training_frame_i7_vs_v3
  removed_on: '2026-09-11'
  what_it_said: A and A50 were trained on the i7 identity frame while B and C were
    trained on the pre-I7 v3 frame, so any A-vs-B or A-vs-C difference confounded
    venue identity resolution with the model
  reason: 'removed by the 2026-09-11 retrain on the i7 frame: B and C are retrained
    on data/xgb_data_i7, and each arm block pins that frame''s split md5s and alias
    identity from the checkpoint''s own training contract'
known_limitations:
- id: global_prior_not_as_of
  what: 'the stats cache''s global outcome prior π is summed over the tracker''s
    FINAL-state counts (scripts/build_stats_cache.py, the ''global prior π'' block:
    ''Fixed constant — not rolling, not as-of-date''), so it reflects the whole
    corpus rather than the state before each match. Per-player, per-venue and per-match
    counts remain as-of-date (invariant 2)'
  measured: 2026-09-11 on data/xgb_data_i7 (train 2005-02-17 -> 2024-12-30; corpus
    -> 2026-04-16)
  pi_train_only_vs_whole_corpus:
  - outcome: wicket
    train_only: 0.054037
    whole_corpus: 0.054361
    difference: 0.000324
  - outcome: dot
    train_only: 0.303601
    whole_corpus: 0.304017
    difference: 0.000415
  - outcome: single
    train_only: 0.413227
    whole_corpus: 0.411313
    difference: -0.001915
  - outcome: two
    train_only: 0.076086
    whole_corpus: 0.075796
    difference: -0.000291
  - outcome: four
    train_only: 0.107686
    whole_corpus: 0.107803
    difference: 0.000117
  - outcome: six
    train_only: 0.045362
    whole_corpus: 0.046711
    difference: 0.001349
  difference_convention: whole corpus minus train only
  max_abs_difference: 0.001915
  feature_shift_rule: difference x k/(n+k)
  feature_shift_units: n is the number of balls the cell itself has seen and k is
    its shrinkage constant, so k/(n+k) is the prior's share of the shrunk cell.
    The 0.000174 row is therefore reached at 2,000 balls in a VENUE cell (k = 200)
    and at 300 balls in a PLAYER cell (k = 30) — not at the same ball count for
    both
  feature_shift:
  - cell: venue
    k: 200
    n: 0
    shift: 0.001915
  - cell: venue
    k: 200
    n: 200
    shift: 0.000957
  - cell: venue
    k: 200
    n: 2000
    shift: 0.000174
  - cell: player
    k: 30
    n: 0
    shift: 0.001915
  - cell: player
    k: 30
    n: 30
    shift: 0.000957
  - cell: player
    k: 30
    n: 300
    shift: 0.000174
  feature_shift_is_not_a_log_loss_bound: 'the shifts above are measured in FEATURE
    space: they are how far one shrunk probability column moves. Nothing here measures
    how far a model''s winner log loss moves as a result, and the two are not the
    same quantity. They are deliberately NOT compared with the 0.007 equivalence
    margin, which is a log loss; an earlier version of this block made that comparison
    and it was withdrawn (Astra round 1)'
  identical_across_arms: true
  identical_across_arms_scope: 'the EXPOSURE is identical, and that is all this
    key claims: all four stage-1 arms read one cache, so every arm''s features carry
    the same non-as-of prior. It does NOT claim the exposure affects the arms equally'
  differential_effect_on_arms: unknown_and_unmeasured
  consequence: 'shared exposure, unknown differential effect. The shift enters every
    arm''s inputs identically, but the four arms are different functions of those
    inputs — a 114-feature gradient-boosted model, the same family at 50 columns,
    a token MLP and a transformer — and how much each one''s output moves in response
    has not been measured. This limitation therefore cannot be used to argue that
    a stage-1 contrast is unaffected, nor that any arm is favoured or disfavoured:
    the direction and size of the effect on B-A, C-A, C-B and A50-A are simply unknown.
    It is an inherited limitation of the iteration screen, not a stage-1 defect,
    and it is on the backlog (TODO.md, ''Global outcome prior is not as-of-date'')'
  source: scripts/sequence_track/measure_global_prior_asof.py
  source_note: the script that measures the two priors and the k/(n+k) table above;
    it measures the FEATURE shift only, and measures no downstream model effect
  recorded_in: docs/sequence_track/stage1_acceptance.md, D2 check 2.4
