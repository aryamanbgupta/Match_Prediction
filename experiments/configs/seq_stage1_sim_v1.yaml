clipping:
  bounds:
  - 0.01
  - 0.99
  seam: MatchLevelEvaluator.prob_clip, applied at the single seam MatchLevelEvaluator._clip_and_normalize
  seam_source: scripts/sim_eval/match_evaluator.py
  applied_where: after the tie-free renormalisation and before log loss, Brier,
    edge and bet placement, on both evaluation paths
  default: prob_clip = None, which reproduces the historical DEFAULT_PROB_CLIP =
    [0.05, 0.95] exactly, so every existing runner and every stored BR2 result is
    unchanged
  replaces_not_composes: the seam REPLACES the evaluator's historical unconditional
    [0.05, 0.95] clip; it does not compose with it. The registered stage-1 clip
    is therefore WIDER than every previous run's, including BR2 G1, so a stage-1
    winner log loss is not comparable to any number produced under the [0.05, 0.95]
    clip
  enabled_by: run_arm.py --clip-low 0.01 --clip-high 0.99
  why: at 100 sims the plug-in winner probability has SE 0.05 at p = 0.5; a 0/100
    or 100/100 draw must not cost an unbounded log loss, and a 0.05 floor would
    hide real confidence at the resolution stage 1 is trying to measure
convergence_protocol:
  candidates: 'n_sims doubles from 100 with no ceiling: 100, 200, 400, 800, ...'
  first_candidate: 100
  batches_per_arm_per_candidate: 3
  batch_base_seeds:
  - 20260910
  - 20260911
  - 20260912
  batch_independence: three independent simulation batches per arm per candidate,
    one per registered batch base seed; the fixture set, chronology, selector and
    extras law are identical across batches
  shard: 'the 1b timing shard: 10 fixtures chosen to include long innings'
  statistic: the paired C-B and B-A winner log loss on the shard, computed per batch
  stop_rule: stop at the smallest n_sims at which the 95% range of the paired C-B
    and B-A winner LL across the three batches is below 0.002
  threshold: 0.002
  chosen_n_sims: to_be_filled_before_1d
  chosen_n_sims_drives: the --n-sims token in every arm's full_run.command; both
    are rendered from pin_stage1.CHOSEN_N_SIMS
  spread_table_columns:
  - n_sims
  - contrast
  - batch_1_delta_ll
  - batch_2_delta_ll
  - batch_3_delta_ll
  - range_95
  - below_threshold
  spread_table: []
  fill_before: 1d (the full 255-fixture run)
decision_rule:
  primary_slice: '>=$50k (--min-volume 50000)'
  reported_slices:
  - all
  - '50000'
  - '100000'
  sign_convention: every contrast is candidate minus reference, in winner log loss,
    so a negative delta is favourable to the candidate
  equivalence_margin_ll: 0.007
  margin_basis: the branch-wide seed-noise floor (claim_gate SEED_FLOOR = 0.007);
    a difference below it is not resolvable by this protocol
  confirmatory_family:
  - contrast: C-B
    candidate: C
    reference: B
    slice: '50000'
    question: the registered full-sequence T1 versus token-MLP contrast in rollout,
      on the same 50 features; the two architectures differ in outcome-history embedding,
      attention and parameter count, so this is a comparison of that specific pair
      and not an isolation of sequence memory
    decision_it_feeds: whether this T1 beats this MLP on the same features; it is
      evidence about that pair, not by itself an advancement, and not a measurement
      of what sequence memory is worth
  - contrast: B-A
    candidate: B
    reference: A
    slice: '50000'
    question: system comparison, token MLP vs production
    decision_it_feeds: B advances only if this is favourable
  - contrast: C-A
    candidate: C
    reference: A
    slice: '50000'
    question: system comparison, full T1 vs production
    decision_it_feeds: C advances only if this is favourable
  multiplicity: Holm adjustment across the three confirmatory contrasts (C-B, B-A,
    C-A); the family is fixed here, before any run
  exploratory_contrasts:
  - contrast: A50-A
    candidate: A50
    reference: A
    slice: '50000'
    label: exploratory system contrast
    note: A50 is the equal-information control for the A-vs-B/C comparison; it is
      outside the confirmatory family, is not Holm-adjusted, and cannot advance
      anything
  outcomes:
    parity: the 95% block interval lies entirely inside [-0.007, +0.007]
    favourable: the 95% block interval excludes zero and the point estimate is below
      -0.007
    adverse: the 95% block interval excludes zero and the point estimate is above
      +0.007
    inconclusive: anything else
  advancement: 'symmetric: B advances only if B-A is favourable, C advances only
    if C-A is favourable; a favourable C-B on its own is evidence about that architecture
    pair for stage 2, not an advancement and not a measurement of sequence memory'
  market_claim: no winner-LL result is a market claim. A market claim additionally
    requires the claim gate's market comparison with the registered cost scenarios
    below, and a paired Δprofit or ΔROI interval, per program.md's LANDED rule
  cost_scenarios:
  - spread 0 bps, fee 0 bps on winnings
  - spread 100 bps, fee 0 bps on winnings
  - spread 200 bps, fee 0 bps on winnings
  - spread 100 bps, fee 100 bps on winnings
  - spread 100 bps, fee 100 bps on stake
  estimands_reported_separately:
  - the registered checkpoint's own performance, with uncertainty from paired tournament-block
    resampling of matches and independent simulation batches
  - across-training-seed robustness, which this single-checkpoint screen does NOT
    measure and must not be read from it
scoring:
  winner_log_loss:
    status: confirmatory
    gate: scripts/sim_eval/claim_gate.py
