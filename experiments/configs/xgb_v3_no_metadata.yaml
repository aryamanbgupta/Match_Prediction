experiment:
  name: "xgb_v3_no_metadata"
  description: "Ablation: XGBoost v3 without player metadata features"
  tags: ["xgboost", "v3", "ablation", "no-metadata"]

data:
  version: "v3"
  test_dir: "data/betting_test"
  odds_file: "betting_odds_v3.json"

features:
  groups:
    - basic
    - player_stats
    - h2h
    - momentum
    - pressure
    - chase
    - medium
    # player_metadata removed
    - matchup
    - type_based
  exclude: []
  include_extra: []

model:
  type: "xgboost"
  hyperparameters:
    n_estimators: 444
    max_depth: 10
    learning_rate: 0.24036372383981375
    subsample: 0.8776663421127178
    colsample_bytree: 0.7424085095268674
    reg_alpha: 0.8503122682099661
    reg_lambda: 0.18186045420525845
  tune: false
  tune_trials: 50

evaluation:
  n_sims: 1000
  parallel: false

pipeline:
  skip_parsing: true
  skip_training: false
  skip_evaluation: false
