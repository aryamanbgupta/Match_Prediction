deviations:
  - id: family_key_is_the_registration_slot
    statement: >-
      `family_c114_feats` is registered under the family key
      `candidate: full_50`, although the candidate of every one of its members
      is `full_114`.
    reason: >-
      `stage2_stats.registered_families` refuses a repeated family key
      ("family candidate ... is repeated") and requires every candidate-role
      configuration to be a family key exactly once. Two families whose
      members are all `full_114 - X` therefore cannot both be keyed on
      `full_114`. The family key is a REGISTRATION SLOT, not a claim: each
      member carries its own explicit `contrast: {candidate, reference}`, and
      that is what the statistics read. Found while writing this config; the
      alternative — a `family_key` distinct from the candidate — is a schema
      change and is out of scope for batch 2. Recorded in
      batch2_acceptance.md as the one-line change that would remove the
      awkwardness.
  - id: encoders_fitted_on_train_only
    statement: >-
      the `v7_114` contract fits its four LabelEncoders on TRAIN rows only,
      while the production ball model (scripts/xgboost_v2.py) fits them on the
      union of train, validation and test unique values.
    reason: >-
      the production fitting would let a validation row's category index
      depend on the test split, which stage 2's `score_test: false` contract
      forbids. The consequence is that `full_114` and `mlp_114` see an
      out-of-vocabulary slot where production sees a fitted index, so neither
      is a reproduction of the production model and neither may be compared to
      one. This is the trainer's own registered deviation
      (transformer_t1 V7_114_CATEGORICALS), restated here because it bounds
      what a favourable `full_114 - full_50` licenses.
  - id: epoch_schedule_not_step_budget
    statement: >-
      batch 2 runs the stage 2 epoch loop with live early stopping, while
      night 3's Block B ran a fixed 3,840-step budget.
    reason: >-
      the two are different schedules and their numbers are not comparable. No
      batch-2 arm may be tabled against a Block B arm, and this file registers
      no Block B configuration id.
  - id: full_50_is_a_fresh_run
    statement: >-
      `full_50` is trained fresh under this config and is NOT stage 1's or
      stage 2's `full`.
    reason: >-
      a different config id, a different output tree, a different training
      signature and a different machine mix. Reusing an older `full`
      checkpoint would compare a batch-2 arm to a run selected under another
      registration, so it is trained again and costs five runs.

known_asymmetries:
  - id: contract_adds_identity
    text: >-
      the v7_114 contract carries `batter_encoded` and `bowler_encoded`, which
      no 50-feature arm sees. `full_114 - full_50` therefore moves PLAYER
      IDENTITY together with the other 64 columns; it is "the production
      contract" against "the 50-feature contract" and never "more state
      features". Any identity-specific reading belongs to rung 4b, not here.
  - id: shared_member
    text: >-
      `full_114 - mlp_114 on all` is family_c114_seq's primary AND
      family_c114_feats' `all_row` member. It is ONE estimand on ONE set of
      rows occupying a Holm slot in two families. The two families are
      correlated by construction; a pass in both is not two findings, and the
      Holm adjustment inside each family does not account for the other.
  - id: capacity_differs_between_contracts
    text: >-
      a 114-column input gives a larger first projection than a 50-column one,
      and the two 114-column arms differ from each other only in the attention
      stack. Parameter counts are reported per run in
      `arm_params.n_parameters`; no contrast here is equal-parameter.
  - id: full_arms_are_slower
    text: >-
      `full_114` trains roughly 3-4x slower per step than a token arm at the
      same batch size, and its early stopping may land on a different epoch.
      Steps-to-best and the stopping epoch are reported per run; equal-compute
      is NOT claimed anywhere in this block.

known_limitations:
  - >-
    SEED-MACHINE CONFOUNDING, inherited from nights 1 and 3 and not modelled:
    seeds 7, 29 and 42 run on the laptop and 13, 101 on the mini, and MPS
    kernels are not bit-reproducible across machines. The split is BY SEED, so
    every arm carries the same three-laptop / two-mini mix and no arm is
    advantaged relative to another.
  - >-
    the two families are CORRELATED screens over the same validation rows with
    a shared member and a shared gate reference. Claims are FAMILY-LOCAL only:
    no aggregate, no "either question passes", and no inference from one
    passing where the other does not.
  - >-
    checkpoint selection uses the same validation split the contrasts are
    computed on, so every number of this block is screening evidence.
  - >-
    MPS kernels are not bit-reproducible across runs or machines, so a rerun
    of any checkpoint may differ in the low decimals; every checkpoint records
    mps_bit_reproducible false.
  - >-
    the global outcome prior in the stats cache is not as-of-date, and venue
    history in the frame is not recency-weighted. Both are inherited frame
    limitations shared by all three arms, so they are level effects rather
    than per-arm advantages.

