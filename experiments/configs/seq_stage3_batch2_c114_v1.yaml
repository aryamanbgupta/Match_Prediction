# Sequence track — stage 3, BATCH 2, C114 (the production feature contract).
#
# Registered BEFORE any batch-2 run, from
# docs/sequence_track/night3_design_draft.md (v7, 2026-09-12) § "C114". The
# acceptance contract is docs/sequence_track/batch2_acceptance.md and the
# launch procedure is docs/sequence_track/night3_runbook.md § "Batch 2
# (4d, 4b, C114)".
#
# WHY BATCH 2 IS THREE CONFIGS AND NOT ONE: see the header of
# experiments/configs/seq_stage3_batch2_4d_v1.yaml. One file carries exactly
# one `statistics.families.shared_control`; C114's is `mlp_114`, 4d's is
# `mlp_counts`, and 4b has no run-shaped control at all.
#
# SCHEMA: identical to experiments/configs/seq_stage3_night3_v1.yaml, which
# scripts/sequence_track/retrain_stage2.py `load_config` validates and
# scripts/sequence_track/stage2_stats.py reads — the general family member
# form, `role`, `shared_control`, `slice_predicates`.
#
# SCHEDULE: the STAGE 2 EPOCH LOOP with live early stopping, not night 3's
# step budget. No configuration sets `params.max_steps` / `params.eval_every`,
# no configuration names a `params.train_match_list`, and this file sets no
# `experiment.freeze_manifest`, so `_check_freeze_manifest` opens nothing and
# there is no `freeze:` block: there is no frozen match list or step budget to
# pin.

experiment:
  name: seq_stage3_batch2_c114
  registered: 2026-09-13
  block: C114
  purpose: >-
    Two questions on one set of three arms. (1) Does sequence access buy
    anything ON THE PRODUCTION 114-COLUMN CONTRACT, where every earlier stage
    asked it on the 50-feature contract — `full_114 - mlp_114`. (2) Does the
    114-column contract buy anything over the 50-feature contract for the SAME
    standard-wiring arm — `full_114 - full_50`. The three arms are fresh; none
    reuses a stage 1, stage 2 or night-3 checkpoint.
  predecessor: experiments/configs/seq_stage3_night3_v1.yaml
  predecessor_note: >-
    the night-3 Block B registration, whose general family schema, role key
    and shared-control key this file reuses unchanged. `full_50` is a NEW run
    of the stage 1/2 `full` arm under the batch-2 tree, not stage 2's `full`,
    and must never be tabled against it.
  decision_record: docs/sequence_track/batch2_acceptance.md
  design: docs/sequence_track/night3_design_draft.md
  runbook: docs/sequence_track/night3_runbook.md
  runner: scripts/sequence_track/retrain_stage2.py
  pin: scripts/sequence_track/pin_stage2.py
  queue:
    - research/sequence_track/queue_laptop_batch2.yaml
    - research/sequence_track/queue_mini_batch2.yaml
  queue_note: >-
    batch 2 is split BY SEED across two machines exactly as night 3 was:
    laptop seeds 7, 29, 42 and mini seeds 13, 101, every configuration on both.
    The split is by seed and never by arm. Each job's output_dir is
    models/embeddings/seq_stage3/batch2/runs/<config_id>/seed_<seed>, because
    run_queue.sh decides skip-vs-run from the COMPLETE marker in output_dir
    plus the config sha256 alone and reads neither the command nor the seed
    subset.
  sign_convention: >-
    candidate minus reference, in validation log loss, negative favourable.
  evidence_status: >-
    VALIDATION-ONLY, PROVISIONAL. Checkpoint selection is on the same
    validation split the contrasts are computed on, the untouched cohort is
    NOT opened, and no test split, market price or betting layer is touched
    anywhere. Nothing here can be LANDED (CLAUDE.md invariant 9), nothing
    advances, and no artifact of record changes. In particular a favourable
    `full_114 - full_50` says nothing about the PRODUCTION ball model, which
    is an XGBoost booster on the same columns and is not an arm here.
  forbidden_data:
    - data/golden
    - data/forward_holdout
  forbidden_data_note: >-
    no step of this block reads either tree, and `training.score_test: false`
    keeps the test split closed. The `v7_114` contract's four categorical
    encoders are fitted on TRAIN ROWS ONLY — a stated deviation from
    scripts/xgboost_v2.py, which fits them on the union of train, validation
    and test (see deviations.encoders_fitted_on_train_only).

data:
  directory: data/xgb_data_i7
  frame_version: i7
  frame_role: ball_frame_i7
  stats_cache_role: stats_cache_i7
  splits_read: [train, validation]
  eval_kit: none
  feature_contract: >-
    BOTH. `full_50` reads the 50-column transformer_t1.build_features contract
    that every earlier stage used; `full_114` and `mlp_114` read the `v7_114`
    contract below. The contract is per-configuration
    (`params.feature_contract`), not a file-wide setting.
  n_features: 50
  n_features_note: >-
    the file-wide `n_features` describes the DEFAULT contract, which `full_50`
    runs. The two 114-column arms carry their own count and digest in
    `arm_params.feature_contract_n` / `feature_contract_sha256`.

# ---------------------------------------------------------------------------
# The alternative feature contract. `transformer_t1.v7_114_columns()` resolves
# it from `feature_registry.V6_GROUPS` — the production ball model's own
# ordered list — and refuses to return anything else, so the contract cannot
# silently diverge from the artifact of record. The driver hashes the ORDERED
# list into `arm_params.feature_contract_sha256`, so a reordering is a
# different model input and a different run identity.
# ---------------------------------------------------------------------------
feature_contract_v7_114:
  name: v7_114
  resolver: transformer_t1.v7_114_columns
  source: scripts/feature_registry.py V6_GROUPS
  n_columns: 114
  ordered_columns_sha256: d968f9f93c539c00491fb6b866ba764e9ae365266e5813b12401f9336fefe988
  ordered_columns_sha256_rule: >-
    sha256 of "\n".join(columns) — the driver's own
    `_check_stage3_params` computation, recomputed at load time from the
    resolver and never read from this file.
  categoricals:
    batter_encoded: batter_id
    bowler_encoded: bowler_id
    venue_encoded: venue
    matchup_type_encoded: matchup_type
  categorical_fitting: >-
    LabelEncoders fitted on TRAIN ROWS ONLY, with an out-of-vocabulary slot
    for validation values not seen in train.
  registered_arms: [mlp, full]
  registered_arms_note: >-
    the driver's `C114_ARMS`. `params.feature_contract` is refused for every
    other arm, so this contract cannot leak into a rung it was not designed
    for.

training:
  # The stage 2 EPOCH loop, unchanged: `epochs: 30` with `patience: 3` on the
  # validation log loss, best-validation checkpoint, ties to the earliest
  # epoch. No step budget anywhere in batch 2.
  device: mps
  seeds: [7, 13, 29, 42, 101]
  dmodel: 128
  layers: 2
  heads: 4
  batch: 128
  epochs: 30
  learning_rate: 0.0003
  patience: 3
  aux: false
  no_kit: true
  score_test: false
  save_predictions: true
  early_stopping: >-
    LIVE, the stage 2 rule: training stops when the validation log loss has
    not improved for `patience: 3` consecutive epochs, or at `epochs: 30`,
    whichever comes first.
  selection_rule: >-
    validation log loss = ball-weighted mean negative log-likelihood over ALL
    validation rows, for all three arms.
  seed_policy: >-
    all five registered seeds run for every configuration; a family with fewer
    than five complete paired seeds is NOT_EVALUABLE and is never reported at
    a reduced seed count. Seeds are split laptop 7/29/42 and mini 13/101.

outputs:
  directory: models/embeddings/seq_stage3/batch2/runs
  summary: summary.yaml
  per_run: [metrics.json, model.pt, run_record.json, predictions_validation.npz]
  save_row_aligned_probabilities: true

configurations:
  - id: full_114
    arm: full
    role: candidate
    params: {feature_contract: v7_114}
    access: {features: true, history: true, identity: true, prod_logits: false}
    access_note: >-
      `identity: true` because the v7_114 contract carries `batter_encoded`
      and `bowler_encoded`; the 50-feature arms see no player identity at all.
      This is the single largest difference between the two contracts and is
      why `full_114 - full_50` is not a pure "more state features" contrast
      (known_asymmetries.contract_adds_identity).
    history_input: innings_previous
    wiring: standard
    reference: [mlp_114, full_50]
    tests: >-
      the candidate of both families — standard causal attention wiring over
      the production 114-column contract. Against `mlp_114` it isolates
      sequence access on that contract; against `full_50` it isolates the
      contract at fixed wiring.
    queue_order: 1
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 7 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_114/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 13 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_114/seed_13
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 29 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_114/seed_29
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 42 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_114/seed_42
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 101 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_114/seed_101

  - id: mlp_114
    arm: mlp
    role: control
    params: {feature_contract: v7_114}
    access: {features: true, history: false, identity: true, prod_logits: false}
    history_input: none
    wiring: token_mlp
    reference: []
    reference_note: >-
      the SHARED CONTROL of this config (statistics.families.shared_control):
      every gate of both families is taken against it, and it is a candidate
      in no family.
    tests: >-
      control — the same 114 columns with NO sequence access: a token model
      that sees one ball at a time. `full_114 - mlp_114` is therefore the
      sequence-access contrast on the production contract, with the input
      columns held exactly fixed.
    queue_order: 2
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 7 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_114/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 13 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_114/seed_13
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 29 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_114/seed_29
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 42 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_114/seed_42
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 101 --data-dir data/xgb_data_i7 --feature-contract v7_114 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/mlp_114/seed_101

  - id: full_50
    arm: full
    role: candidate
    params: {}
    access: {features: true, history: true, identity: false, prod_logits: false}
    history_input: innings_previous
    wiring: standard
    reference: [mlp_114]
    reference_note: >-
      it is the REFERENCE of family_c114_feats' primary member and the family
      key that family is registered under; see
      deviations.family_key_is_the_registration_slot for why the key is
      `full_50` and not `full_114`.
    tests: >-
      the 50-feature standard-wiring arm, fresh under the batch-2 tree and the
      batch-2 schedule. It exists so `full_114 - full_50` moves ONLY the
      feature contract: same arm, same wiring, same history input, same
      schedule, same seeds.
    queue_order: 3
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 7 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_50/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 13 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_50/seed_13
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 29 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_50/seed_29
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 42 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_50/seed_42
      - uv run --no-sync python scripts/transformer_t1.py --arm full --seed 101 --data-dir data/xgb_data_i7 --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/batch2/runs/full_50/seed_101

queue_order_note: >-
  registered C114 order: full_114, mlp_114, full_50. Five seeds each: 15 runs,
  three on the laptop (7, 29, 42) and two on the mini (13, 101) per
  configuration. C114 is SECOND in the batch-2 queue order (4d, C114, 4b).

statistics:
  registered_for: docs/sequence_track/batch2_acceptance.md
  per_row_log_loss: >-
    computed from the row-aligned validation probabilities each run saves
    (predictions_validation.npz), never from a scalar.
  contrasts:
    - name: sequence_access_on_v7_114
      definition: "full_114 - mlp_114"
      role: mechanism
      registered_pairs: [[full_114, mlp_114]]
      tests: >-
        sequence access on the production contract — standard causal attention
        against a token model, with the 114 input columns, the schedule and
        the architecture held fixed. This is the ONLY difference between the
        two arms.
    - {name: contract_at_fixed_wiring,
       definition: "full_114 - full_50", role: primary_screen,
       tests: does the production 114-column contract beat the 50-feature
              contract for the same standard-wiring arm on all rows}
  mechanism_note: >-
    exactly one mechanism entry carries `registered_pairs`, so
    stage2_stats.mechanism_contrasts reads the mechanism set FROM THIS CONFIG
    and not from the frozen stage 2 tuple (whose arm ids do not exist here).
    The `primary_screen` entry is a prose registration of family_c114_feats'
    primary member; it is read from the family map, never as a mechanism pair.
  slice_predicates: {}
  slice_predicates_note: >-
    C114 registers NO optional slice. The eight frozen stage 2 names are
    computed unchanged and nothing is composed.
  slices: [all, death, chase, powerplay, middle, innings_1, innings_2,
           thin_pair]
  slices_note: >-
    the eight frozen stage 2 names, computed unchanged. `thin_pair` stays
    UNAVAILABLE: the i7 ball frame carries no exposure column and this config
    registers no
    `slice_predicates.thin_pair.{exposure_columns, threshold}`, so it is
    reported unavailable rather than invented.
  families:
    shared_control: mlp_114
    definition: >-
      TWO registered families, one per candidate-role configuration
      (`full_114` and `full_50`). Both use the GENERAL member form: every
      member names its own contrast {candidate, reference}, slice, kind and
      threshold, and exactly one member carries `primary: true`.
    gate_reference_rule: >-
      every non-inferiority gate of both families is
      `full_114 - mlp_114`, taken against the shared control, so the gate
      always asks "does the 114-column sequence arm lose ground against the
      114-column token model on death overs / in chases" — one question,
      comparable across the two families.
    multiplicity: holm
    multiplicity_scope: within a family, across its members
    multiplicity_not_pooled: >-
      Holm is never pooled across the two families. They share `full_114` as
      the candidate of every member and `mlp_114` as every gate's reference,
      so they are CORRELATED screens over the same rows, not independent
      replications; no aggregate "either question passes" claim exists.
    holm:
      scope: >-
        Holm operates WITHIN each family, separately for each estimand /
        checkpoint readout.
      adjustment: >-
        step-down over the family's sorted raw p-values; with m members the
        adjusted value at rank r is min(1, max over j <= r of (m + 1 - j) *
        p_(j)), which makes the adjusted values monotone in rank.
      ties: stable in the registered member order
      missing_member: >-
        an unavailable member takes a non-rejecting placeholder (adjusted
        p = 1), still occupies its slot, and the family CANNOT pass.
      raw_p: >-
        the threshold-centred two-sided percentile form
        p = min(1, 2 * min[P(d* - t <= 0), P(d* - t >= 0)]) over the bootstrap
        draws d*, with t = 0 for a superiority member and t = +0.002 for a
        non-inferiority gate.
    map:
      - candidate: full_114
        holm_group: family_c114_seq
        all_row_condition: member
        members:
          - name: primary
            primary: true
            kind: superiority
            threshold: 0.0
            slice: all
            contrast: {candidate: full_114, reference: mlp_114}
            label: "full_114 - mlp_114 on all"
            tests: >-
              sequence access on the production contract, on all rows. This
              member IS the inherited candidate-minus-shared-control all-row
              condition, so `all_row_condition: member` discharges it inside
              the family.
          - name: death_gate
            kind: non_inferiority
            threshold: 0.002
            slice: death
            contrast: {candidate: full_114, reference: mlp_114}
            label: "full_114 - mlp_114 on death"
          - name: chase_gate
            kind: non_inferiority
            threshold: 0.002
            slice: chase
            contrast: {candidate: full_114, reference: mlp_114}
            label: "full_114 - mlp_114 on chase"
        screen:
          require: [primary, death_gate, chase_gate]
        note: >-
          SCREEN_PASS requires all three members to reject favourably (primary
          U95 < 0, each gate strictly U95 < +0.002) under Holm, with at least
          ten tournament blocks on each member's slice, five complete paired
          seeds, and at least 4 of 5 favourable per-seed directions on
          `primary`.

      - candidate: full_50
        holm_group: family_c114_feats
        all_row_condition: member
        members:
          - name: primary
            primary: true
            kind: superiority
            threshold: 0.0
            slice: all
            contrast: {candidate: full_114, reference: full_50}
            label: "full_114 - full_50 on all"
            tests: >-
              the feature contract at fixed wiring, on all rows. Both arms are
              the `full` arm with innings-previous history and standard
              wiring; only the input columns differ.
          - name: all_row
            kind: superiority
            threshold: 0.0
            slice: all
            contrast: {candidate: full_114, reference: mlp_114}
            label: "full_114 - mlp_114 on all"
            tests: >-
              the inherited candidate-minus-shared-control all-row member,
              registered explicitly (`all_row_condition: member`). It is the
              SAME estimand as family_c114_seq's primary, computed on the same
              rows; it occupies a Holm slot in BOTH families and is not a
              second piece of evidence (known_asymmetries.shared_member).
          - name: death_gate
            kind: non_inferiority
            threshold: 0.002
            slice: death
            contrast: {candidate: full_114, reference: mlp_114}
            label: "full_114 - mlp_114 on death"
          - name: chase_gate
            kind: non_inferiority
            threshold: 0.002
            slice: chase
            contrast: {candidate: full_114, reference: mlp_114}
            label: "full_114 - mlp_114 on chase"
        screen:
          require: [primary, all_row, death_gate, chase_gate]
        note: >-
          four members, as the design draft registers ("`full_114 - full_50`
          on `all` (primary) plus the all-row member `full_114 - mlp_114` and
          gates vs `mlp_114` (four members)"). SCREEN_PASS requires all four
          to reject favourably under Holm across the four, with at least ten
          tournament blocks on every member's slice, five complete paired
          seeds, and at least 4 of 5 favourable per-seed directions on
          `primary`. The family is keyed on `full_50` for the schema reason in
          deviations.family_key_is_the_registration_slot; its candidate in
          every member is `full_114`.
    map_is_complete: >-
      two families, one per candidate-role configuration. `mlp_114` is the
      shared control and a candidate in no family.
    exploratory: >-
      every contrast on every slice that is not a registered family member:
      `full_50 - mlp_114` on all eight slices, `full_114 - full_50` on the
      seven non-primary slices, each arm against the three frozen stage 4
      references (`ref_eb_ctx` 1.4500, `ref_lin_50` 1.4433, `ref_raw_ctx`
      1.4534) as a DESCRIPTIVE level readout only — those references are
      deterministic npz files, not runs, so no family member may take one as
      its reference (see
      experiments/configs/seq_stage3_batch2_4b_v1.yaml) — and every
      per-contract readout on the five non-gate slices.
  bootstrap:
    contract: tournament_time_block_v1
    blocks_from: scripts/sim_eval/eval_statistics.load_competition_clusters
    block_source_dir: data/t20s_json
    block_key: cricsheet match id
    resample: tournament blocks, not matches
    reps: 2000
    seed: 29
    weighting: ball_weighted
    min_blocks: 10
    below_min_blocks: descriptive
    ten_block_rule_applies_to: >-
      every REQUIRED member slice of every family, checked on tournament
      blocks of that slice's validation rows and never on match counts. A
      required slice with fewer than ten blocks is descriptive and its family
      CANNOT pass.
    invariant: >-
      CLAUDE.md critical invariant 7 — fewer than 10 blocks is descriptive,
      never a CI-clean claim.
  estimands:
    - {id: i, definition: per checkpoint (one seed), reported: separately}
    - {id: ii, definition: joint resampling of seeds and tournament blocks,
       reported: separately}
  non_inferiority:
    margin_ll: 0.002
    sign: >-
      a candidate is non-inferior on a gate slice when U95, the 97.5th
      percentile of the paired harm draws of (full_114 - mlp_114), is STRICTLY
      below +0.002 log loss. U95 = 0.002 exactly does not pass.
    applies_to: [death, chase]
    reference: mlp_114
    raw_p: >-
      the same threshold-centred two-sided percentile form as a superiority
      member, with t = +0.002:
      p = min(1, 2 * min[P(d* - 0.002 <= 0), P(d* - 0.002 >= 0)]).
    not_imported_from_stage_1: >-
      stage 1's +-0.007 parity margin and its parity classification are NOT
      imported; this block's only margin is +0.002 on log loss.
  interval_labelling:
    rank_local: >-
      every per-arm or per-rank interval is labelled "rank-local percentile
      interval; not simultaneous; not the rejection rule". The rejection rule
      is the Holm-adjusted family, never an interval read off a table.
  labelling:
    five_seed_night: screen
    note: >-
      five seeds make the direction count readable; they do not make a
      validation-only, selection-on-the-same-split screen confirmatory. No arm
      is promoted on this block, and no market or betting claim exists.

