deviations:
  - id: ref_train_probs_in_sample
    statement: >-
      the frozen reference's TRAIN probabilities are in-sample: `ref_eb_ctx`
      was fitted on exactly the rows it predicts there (in-sample log loss
      1.4189 against 1.4500 on validation).
    reason: >-
      the identity residual must sit on a base at training time, and the base
      must be the same function it will sit on at validation time. The
      in-sample train probabilities are therefore emitted deliberately and are
      NEVER a performance read. This deviation id was reserved in
      experiments/configs/seq_stage3_night3_v1.yaml precisely for this rung,
      carried in v1 of this file, and is carried UNCHANGED here so the id is
      stable across all three files; it bears on NO Block B arm.
  - id: v1_runs_excluded_from_evidence
    statement: >-
      the ten runs under models/embeddings/seq_stage3/batch2/runs/
      identity_residual_l{2,3}/seed_* are excluded from this rung's evidence
      and are not read.
    reason: >-
      the driver refused every one of their checkpoints (the hard-coded
      `feat_proj` / `head` parameter expectation), so none was ever admitted
      and none carries a verified summary. They are left in place untouched as
      the record of the defect, and v2 writes to a separate output root so
      neither tree can be mistaken for the other.
  - id: two_families_not_one_six_member_family
    statement: >-
      the design draft's single six-member family is registered as TWO
      three-member families, one per lambda.
    reason: >-
      `stage2_stats` keys a family by its candidate and requires every
      candidate-role configuration to be a family candidate exactly once, so
      two candidates cannot share one family. Holm therefore corrects within
      each arm's three members and not across the six; declared in
      `known_limitations` and in `family_registration`.
  - id: epoch_schedule_not_step_budget
    statement: >-
      batch 2 runs the stage 2 epoch loop with live early stopping, while
      night 3's Block B ran a fixed 3,840-step budget.
    reason: >-
      the two are different schedules and their numbers are not comparable.
  - id: lambda_written_in_decimal
    statement: >-
      the penalties are written `0.001` and `0.01`, not `1e-3` and `1e-2`.
    reason: >-
      PyYAML's resolver does not treat `1e-3` as a float (there is no decimal
      point and no sign in the exponent), so it loads as the STRING "1e-3" and
      the driver's float check refuses the entry. The values are the design
      draft's lambdas exactly.

known_asymmetries:
  - id: the_base_cannot_move
    text: >-
      the reference logits are frozen: gradient reaches W, b and the two
      embedding tables and never the base. This is the stated difference from
      E4, where the base was trainable. A null here is evidence about a
      residual on a fixed base and not about identity embeddings in general.
  - id: unk_row_is_trained_the_vocabulary_is_not_complete
    text: >-
      the vocabulary is the players seen in TRAIN; a validation row whose
      batter or bowler is unseen falls to the UNK row, which is trained only
      through id dropout at 0.05. The share of validation rows hitting UNK is
      reported per run; it differs between batter and bowler and is not
      controlled for.
  - id: penalty_is_on_the_residual_function
    text: >-
      the penalty is lambda * mean ||W.[e_bat; e_bowl] + b||^2 over batch
      rows — on the residual logit vector itself, so no rescaling of the
      embeddings against W escapes it. It is NOT weight decay on the
      embeddings, and the two lambdas are therefore comparable to each other
      in a way that two weight decays would not be.
  - id: dmodel_layers_heads_are_inert
    text: >-
      the architecture fields in `training` are carried for schema
      comparability and change nothing for this arm. A reader comparing this
      config's `training` block to another's must not infer a shared
      architecture.

known_limitations:
  - >-
    HOLM DOES NOT COVER BOTH LAMBDAS. Two families means two independent
    three-member Holm corrections, so the pair of primaries is not corrected
    against each other. The rung selects neither lambda, which is why this is
    acceptable, but a reader must not treat "one of the two arms passed" as a
    single corrected finding.
  - >-
    SEED-MACHINE CONFOUNDING, inherited from nights 1 and 3 and not modelled:
    seeds 7, 29 and 42 on the laptop, 13 and 101 on the mini; MPS kernels are
    not bit-reproducible across machines.
  - >-
    checkpoint selection uses the same validation split the family is computed
    on, so these checkpoints are screening artifacts and this rung is a SCREEN,
    never a confirmation.
  - >-
    MPS kernels are not bit-reproducible across runs or machines, so a rerun
    of any checkpoint may differ in the low decimals; every checkpoint records
    mps_bit_reproducible false.
  - >-
    the frozen reference was fitted once, deterministically, and is never
    presented as five seeds. The family pairs on the candidate side only, so
    the reference contributes no variance to either estimand — the intervals
    are about the candidate's seed and block variation alone.
  - >-
    v1 established nothing and is not evidence for this registration: its runs
    were never admitted and its descriptive table was never produced.

