deviations:
  - id: outcome_informed_registration
    statement: >-
      the two target definitions, the negative-transfer hypothesis and the
      conditioning arm follow from the stage 2 five-seed readout, which was
      already read when this config was written.
    reason: >-
      it is a NEW screening hypothesis, frozen in this file and in the design
      draft before any night-3 performance read, so it is pre-registered
      rather than confirmatory. It is not a confirmation of stage 2 and must
      never be reported as one.
  - id: target_E_validation_list_repointed
    statement: >-
      the `target_E` VALIDATION slice is a separate frozen list,
      experiments/stage3a/target_E_validation_matches.json, and NOT the E
      training list experiments/stage3a/target_E_matches.json that
      `mlp_E_tiercond` trains on.
    reason: >-
      the two lists are disjoint by construction: the freeze manifest asserts
      that no match id in any frozen TRAINING list appears in the validation
      parquet (0 leaked for target_E), so reading the E validation slice off
      the training list would select ZERO rows and silently make every
      family_3a_E member NOT_EVALUABLE. The E RULE is one rule applied to two
      splits; the two files are its two halves. Found while writing this
      config; the freeze script was extended to emit the validation half, and
      night3_acceptance N3 checks that both halves exist, that the config pins
      the validation half for the slice and the training half for training,
      and that their sha256s match the regenerated manifest.
  - id: big3_thin_8_matches
    statement: >-
      the `big3` readout has 8 validation matches, 16 innings and 1,895 rows —
      far below the ten-block rule.
    reason: >-
      it is registered as a descriptive readout only, with fixed contrasts,
      row and block counts reported, no family and no screen. It is reported
      because it was designed in, not because it can support an inference.
  - id: all_row_selection_for_target_arms
    statement: >-
      the target-only arms' checkpoints are selected on ALL validation rows,
      including rows from matches outside their target.
    reason: >-
      one shared artifact per (configuration, seed) is what makes the two
      families share controls and keeps the count at 30 runs. The cost — the
      selection can work against target-only performance — is disclosed and is
      part of the shared-artifact contract, not a finding.
  - id: equal_steps_not_equal_tokens
    statement: >-
      all six arms train for exactly 3,840 steps, so the arms trained on
      fewer rows see MORE epochs, and tokens seen and target-tier tokens seen
      differ across arms.
    reason: >-
      equal steps, equal tokens and equal target-tier exposure cannot all hold
      at the pool's proportions. Equal steps is the registered control; the
      residual confounding is stated and every arm reports total tokens seen,
      target-tier tokens seen and steps-to-best.
  - id: ref_train_probs_in_sample
    statement: >-
      RESERVED for Block E rung 4b, whose frozen reference logits are fitted
      on the training rows they are later read on.
    reason: >-
      registered here so the night's deviation ids are stable across its
      blocks. It bears on NO Block B arm: no arm of this config reads a frozen
      reference, and this entry must not be cited in a Block B reading.

known_asymmetries:
  - id: tiercond_arms_see_the_tier_column
    text: >-
      the three conditioned arms see `competition_tier`, which `mlp_pool`
      never sees. So any contrast whose reference is `mlp_pool` — both gates of
      every family, and every exploratory arm-minus-control reading — mixes
      the conditioning with whatever else the arm changed, and only
      `mlp_pool_tiercond - mlp_pool` isolates the conditioning. The two
      superiority members avoid this by taking conditioned references.
  - id: untrained_tier_slots_in_the_target_arms
    text: >-
      `mlp_P_tiercond` sees only tier 3, so its tier embedding rows and output
      bias rows for tiers 0, 1, 2 and 4 stay at initialisation and are recorded
      as untrained; `mlp_E_tiercond` sees tier 3 plus whatever tiers its elite
      internationals carry. Those slots are exercised at validation time on
      every non-target row, which is one mechanism by which a target-only arm
      can be worse on `all` for reasons unrelated to transfer.
  - id: rowmatch_controls_are_row_matched_not_innings_matched
    text: >-
      the row-matched controls match the target's ROW count (overshoot 240 and
      81 rows, at most one match) by adding whole matches, so innings counts
      and per-innings length distributions differ slightly from the target's.
  - id: target_P_and_target_E_overlap
    text: >-
      target E contains all of target P, and the `target_P` and `target_E`
      validation slices overlap heavily. The two families share `mlp_pool` and
      `mlp_pool_tiercond` as well, so their screens are correlated, not
      replications.
  - id: token_mlp_has_no_attention_layer
    text: >-
      every arm here is token_mlp, so none has an attention layer and none of
      this block's readings bears on any sequence mechanism. Parameter counts
      differ between the conditioned and unconditioned arms by the tier
      embedding and bias, reported per run in arm_params.n_parameters.

known_limitations:
  - >-
    SEED-MACHINE CONFOUNDING, inherited from night 1 and not modelled: seeds 7,
    29 and 42 run on the laptop and 13, 101 on the mini, and MPS kernels are
    not bit-reproducible across machines. The split is BY SEED, so every arm
    carries the same three-laptop / two-mini mix and no arm is advantaged
    relative to another; the machine is still a component of each per-seed
    number and is reported, never adjusted for.
  - >-
    family_3a_P and family_3a_E are CORRELATED screens over overlapping rows
    with two shared controls. Claims are FAMILY-LOCAL only: no aggregate,
    no "either target passes", no comparison of the two families' outcomes to
    each other, and no inference from one passing where the other does not.
  - >-
    checkpoint selection uses the same validation split the contrasts are
    computed on, so every number of this block is screening evidence.
  - >-
    MPS kernels are not bit-reproducible across runs or machines, so a rerun of
    any checkpoint may differ in the low decimals; every checkpoint records
    mps_bit_reproducible false.
  - >-
    the global outcome prior in the stats cache is not as-of-date, and venue
    history in the frame is not recency-weighted. Both are inherited frame
    limitations shared by all six arms, so they are level effects rather than
    per-arm advantages.
  - >-
    `competition_tier` is a pre-match EVENT-NAME rule, not a market or quality
    measurement. No market designation attaches to a tier anywhere in this
    block, and "premium" and "elite" are the rule's labels, not findings.

