queue_order_note: >-
  registered Block B order: mlp_pool, mlp_pool_tiercond, mlp_P_tiercond,
  mlp_rowmatch_P_tiercond, mlp_E_tiercond, mlp_rowmatch_E_tiercond. Five seeds
  each: 30 runs, three on the laptop (7, 29, 42) and two on the mini (13, 101)
  per configuration. Block B is FIRST in the night's queue order (B, E(4d),
  C114, E(4b)).

statistics:
  registered_for: docs/sequence_track/night3_acceptance.md
  per_row_log_loss: >-
    computed from the row-aligned validation probabilities each run saves
    (predictions_validation.npz), never from a scalar.
  contrasts:
    - name: tier_conditioning
      definition: "mlp_pool_tiercond - mlp_pool"
      role: mechanism
      registered_pairs: [[mlp_pool_tiercond, mlp_pool]]
      tests: >-
        the conditioning benefit — a dim-8 competition_tier embedding plus a
        per-tier output bias, on all rows, with the training rows and the step
        budget held fixed. This is the ONLY difference between the two arms.
    - {name: target_minus_pooled_conditioned,
       definition: "mlp_<T>_tiercond - mlp_pool_tiercond", role: primary_screen,
       tests: does training on the target's rows beat pooled training under
              identical conditioning, on the target's own validation rows}
    - {name: target_minus_rowmatched,
       definition: "mlp_<T>_tiercond - mlp_rowmatch_<T>_tiercond",
       role: primary_screen,
       tests: does training on the target's rows beat the SAME NUMBER of
              pooled rows, on the target's own validation rows}
  mechanism_note: >-
    exactly one mechanism entry carries `registered_pairs`, so
    stage2_stats.mechanism_contrasts reads the mechanism set FROM THIS CONFIG
    and not from the frozen stage 2 tuple (whose arm ids do not exist here).
    The two `primary_screen` entries above are prose registrations of the two
    superiority members; they are read from the family map, never as mechanism
    pairs, because they are family-local and target-sliced.
  slice_predicates:
    # Optional slices, in the order the tool computes them (they are appended
    # to the eight frozen names below). A composed `<base>@<restrict>` name
    # must be registered AFTER the slice it restricts to, and the restricted
    # slice may not itself be composed.
    # target_P: competition_tier == 3 on the validation rows. 222 of the 243
    # E validation matches are tier 3, so this slice is those 222 matches.
    target_P: {tier: 3}
    target_E:
      match_list: experiments/stage3a/target_E_validation_matches.json
      sha256: 626889fa8d70f0fbcfa9b5690aec6cb651fdbb742c2ccf300a9b9af971019b6d
      membership: >-
        a validation row is in the slice when the MATCH ID SUFFIX of its
        innings_id ('<innings number>_<cricsheet match id>') is in the list:
        243 validation matches, 480 innings, 55,981 of the 124,292 validation
        rows. This is the VALIDATION-side E list: the E rule (target P union every
        international in which both teams are ICC full members) applied to the
        validation split. It is NOT target_E_matches.json — that file is the E
        TRAINING list, and the freeze manifest asserts no training list shares
        a match with the validation parquet, so pinning it here would select
        zero rows (see deviations.target_E_validation_list_repointed).
    big3:
      match_list: experiments/stage3a/big3_validation_matches.json
      sha256: 49e8f62476d9b21352e324da7a660bd1407423fa12a995c166a9a6a545929b77
      definition_note: >-
        the manifest's rule text, verbatim: "E-intersected: both full members
        AND one of India/Australia/England". So it is E intersected with the
        matches of those three teams — an elite SUBSET, and their matches
        against associates are not in it.
      descriptive_only: >-
        8 validation matches, 16 innings, 1,895 rows — far below the ten-block
        rule. Fixed contrasts only (the same six configs' deltas),
        ball-weighted, with row and block counts reported. No family, no
        screen, and no "tier above E" inference.
    death@target_P: {}
    chase@target_P: {}
    death@target_E: {}
    chase@target_E: {}
  slices: [all, death, chase, powerplay, middle, innings_1, innings_2,
           thin_pair, target_P, target_E, big3, death@target_P,
           chase@target_P, death@target_E, chase@target_E]
  slices_note: >-
    the first eight are the frozen stage 2 names, computed unchanged.
    `thin_pair` stays UNAVAILABLE: the i7 ball frame carries no exposure
    column and this config registers no
    `slice_predicates.thin_pair.{exposure_columns, threshold}`, so it is
    reported unavailable rather than invented.
  families:
    shared_control: mlp_pool
    definition: >-
      THREE registered families, one per candidate-role configuration
      (mlp_pool_tiercond, mlp_P_tiercond, mlp_E_tiercond). Each uses the
      GENERAL member form: every member names its own contrast
      {candidate, reference}, slice, kind and threshold, and exactly one member
      carries `primary: true`. The map below is the registration, not a
      template.
    gate_reference_rule: >-
      every non-inferiority gate is taken against the shared control
      `mlp_pool`, whatever the family's superiority references are, so the gate
      always asks "does this arm lose ground against the unconditioned pooled
      model on death overs / in chases" — one question, comparable across
      families. For the two target families the gate is restricted to the
      target's own rows (death@target_T, chase@target_T).
    multiplicity: holm
    multiplicity_scope: within a family, across its members
    multiplicity_not_pooled: >-
      Holm is never pooled across the three families. family_3a_P and
      family_3a_E are correlated screens; no "either target passes" claim
      exists.
    holm:
      scope: >-
        Holm operates WITHIN each family, separately for each estimand /
        checkpoint readout.
      adjustment: >-
        step-down over the family's sorted raw p-values; with m members the
        adjusted value at rank r is min(1, max over j <= r of (m + 1 - j) *
        p_(j)), which makes the adjusted values monotone in rank.
      ties: stable in the registered member order
      missing_member: >-
        an unavailable member (a run that did not finish, a slice with no rows,
        a slice below ten blocks) takes a non-rejecting placeholder (adjusted
        p = 1), still occupies its slot, and the family CANNOT pass.
      raw_p: >-
        the threshold-centred two-sided percentile form
        p = min(1, 2 * min[P(d* - t <= 0), P(d* - t >= 0)]) over the bootstrap
        draws d*, with t = 0 for a superiority member and t = +0.002 for a
        non-inferiority gate.
    map:
      - candidate: mlp_pool_tiercond
        holm_group: family_3a_cond
        all_row_condition: member
        direction_required: [primary]
        members:
          - name: primary
            primary: true
            kind: superiority
            threshold: 0.0
            slice: all
            contrast: {candidate: mlp_pool_tiercond, reference: mlp_pool}
            label: "mlp_pool_tiercond - mlp_pool on all"
            tests: >-
              the conditioning benefit on all rows. This member IS the
              inherited candidate-minus-shared-control all-row condition, so
              `all_row_condition: member` discharges it inside the family.
          - name: death_gate
            kind: non_inferiority
            threshold: 0.002
            slice: death
            contrast: {candidate: mlp_pool_tiercond, reference: mlp_pool}
            label: "mlp_pool_tiercond - mlp_pool on death"
          - name: chase_gate
            kind: non_inferiority
            threshold: 0.002
            slice: chase
            contrast: {candidate: mlp_pool_tiercond, reference: mlp_pool}
            label: "mlp_pool_tiercond - mlp_pool on chase"
        screen:
          require: [primary, death_gate, chase_gate]
        note: >-
          decision-bearing and registered once. SCREEN_PASS requires all three
          members to reject favourably (primary U95 < 0, each gate strictly
          U95 < +0.002) under Holm, with at least ten tournament blocks on each
          member's slice, five complete paired seeds, and at least 4 of 5
          favourable per-seed directions on `primary`.

      - candidate: mlp_P_tiercond
        holm_group: family_3a_P
        all_row_condition: none
        direction_required: [superiority_1, superiority_2]
        members:
          - name: superiority_1
            primary: true
            kind: superiority
            threshold: 0.0
            slice: target_P
            contrast: {candidate: mlp_P_tiercond,
                       reference: mlp_pool_tiercond}
            label: "mlp_P_tiercond - mlp_pool_tiercond on target_P"
            tests: >-
              target-only training against pooled training, conditioning and
              step budget matched, on target P's own validation rows.
          - name: superiority_2
            kind: superiority
            threshold: 0.0
            slice: target_P
            contrast: {candidate: mlp_P_tiercond,
                       reference: mlp_rowmatch_P_tiercond}
            label: "mlp_P_tiercond - mlp_rowmatch_P_tiercond on target_P"
            tests: >-
              target rows against the same NUMBER of pooled rows, conditioning
              and step budget matched.
          - name: death_gate
            kind: non_inferiority
            threshold: 0.002
            slice: death@target_P
            contrast: {candidate: mlp_P_tiercond, reference: mlp_pool}
            label: "mlp_P_tiercond - mlp_pool on death within target_P"
          - name: chase_gate
            kind: non_inferiority
            threshold: 0.002
            slice: chase@target_P
            contrast: {candidate: mlp_P_tiercond, reference: mlp_pool}
            label: "mlp_P_tiercond - mlp_pool on chase within target_P"
        screen:
          require: [superiority_1, superiority_2, death_gate, chase_gate]
        note: >-
          SCREEN_PASS requires BOTH superiority members to reject favourably
          with U95 < 0 AND both gates to hold with strictly U95 < +0.002, under
          Holm across the four members, with at least ten tournament blocks on
          EVERY required slice of this target, five complete paired seeds, and
          at least 4 of 5 favourable per-seed directions on BOTH superiority
          members (`direction_required`). The inherited all-row condition is
          AMENDED AWAY (`all_row_condition: none`): a target-only model is not
          expected to serve rows outside its intended deployment scope, so
          `mlp_P_tiercond - mlp_pool on all` is reported as exploratory and is
          not part of this screen.

      - candidate: mlp_E_tiercond
        holm_group: family_3a_E
        all_row_condition: none
        direction_required: [superiority_1, superiority_2]
        members:
          - name: superiority_1
            primary: true
            kind: superiority
            threshold: 0.0
            slice: target_E
            contrast: {candidate: mlp_E_tiercond,
                       reference: mlp_pool_tiercond}
            label: "mlp_E_tiercond - mlp_pool_tiercond on target_E"
          - name: superiority_2
            kind: superiority
            threshold: 0.0
            slice: target_E
            contrast: {candidate: mlp_E_tiercond,
                       reference: mlp_rowmatch_E_tiercond}
            label: "mlp_E_tiercond - mlp_rowmatch_E_tiercond on target_E"
          - name: death_gate
            kind: non_inferiority
            threshold: 0.002
            slice: death@target_E
            contrast: {candidate: mlp_E_tiercond, reference: mlp_pool}
            label: "mlp_E_tiercond - mlp_pool on death within target_E"
          - name: chase_gate
            kind: non_inferiority
            threshold: 0.002
            slice: chase@target_E
            contrast: {candidate: mlp_E_tiercond, reference: mlp_pool}
            label: "mlp_E_tiercond - mlp_pool on chase within target_E"
        screen:
          require: [superiority_1, superiority_2, death_gate, chase_gate]
        note: >-
          identical screen to family_3a_P on target E's slices. Its target
          slices are read from the E VALIDATION list, never from the E training
          list the candidate trains on (see
          deviations.target_E_validation_list_repointed).
    map_is_complete: >-
      three families, one per candidate-role configuration. `mlp_pool` is the
      shared control and a candidate in no family; `mlp_rowmatch_P_tiercond`
      and `mlp_rowmatch_E_tiercond` declare `role: control` and are candidates
      in no family, which is what lets a four-member family carry a
      reference-only arm without inventing a family for it.
    exploratory: >-
      every contrast on every slice that is not a registered family member:
      each arm minus `mlp_pool` on all fifteen slices (including the two
      target arms on `all`, which the amended all-row condition explicitly
      excludes from their screens), the per-tier readouts for tiers 1, 2 and 4
      (tier 4 has 11 validation matches), and every reading on `big3`.
  bootstrap:
    contract: tournament_time_block_v1
    blocks_from: scripts/sim_eval/eval_statistics.load_competition_clusters
    block_source_dir: data/t20s_json
    block_key: cricsheet match id
    resample: tournament blocks, not matches
    reps: 2000
    seed: 29
    weighting: ball_weighted
    min_blocks: 10
    below_min_blocks: descriptive
    ten_block_rule_applies_to: >-
      every REQUIRED member slice of every family, checked on tournament
      blocks of that slice's validation rows and never on match counts. A
      required slice with fewer than ten blocks is descriptive and its family
      CANNOT pass.
    invariant: >-
      CLAUDE.md critical invariant 7 — fewer than 10 blocks is descriptive,
      never a CI-clean claim.
  estimands:
    - {id: i, definition: per checkpoint (one seed), reported: separately}
    - {id: ii, definition: joint resampling of seeds and tournament blocks,
       reported: separately}
  non_inferiority:
    margin_ll: 0.002
    sign: >-
      a candidate is non-inferior on a gate slice when U95, the 97.5th
      percentile of the paired harm draws of (candidate - mlp_pool), is
      STRICTLY below +0.002 log loss. U95 = 0.002 exactly does not pass.
    applies_to: [death, chase, death@target_P, chase@target_P,
                 death@target_E, chase@target_E]
    reference: mlp_pool
    raw_p: >-
      the same threshold-centred two-sided percentile form as a superiority
      member, with t = +0.002:
      p = min(1, 2 * min[P(d* - 0.002 <= 0), P(d* - 0.002 >= 0)]).
    not_imported_from_stage_1: >-
      stage 1's +-0.007 parity margin and its parity classification are NOT
      imported; this block's only margin is +0.002 on log loss.
  interval_labelling:
    rank_local: >-
      every per-arm or per-rank interval is labelled "rank-local percentile
      interval; not simultaneous; not the rejection rule". The rejection rule
      is the Holm-adjusted family, never an interval read off a table.
  labelling:
    five_seed_night: screen
    note: >-
      five seeds make the direction count readable; they do not make a
      validation-only, selection-on-the-same-split screen confirmatory. No arm
      is promoted on this block, and no market or betting claim exists.

