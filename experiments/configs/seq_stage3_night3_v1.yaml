# Sequence track — stage 3, night 3, Block B (3a negative-transfer screen).
#
# Registered BEFORE any Block B run, from docs/sequence_track/night3_design_draft.md
# (v7, 2026-09-12) § "Block B", § "Family machinery" and § "Capacity". The
# acceptance contract is docs/sequence_track/night3_acceptance.md and the
# launch procedure is docs/sequence_track/night3_runbook.md.
#
# This file registers SIX configurations, THREE families and TWO targets. It
# is the whole of Block B; the 4d, 4b and C114 experiments of the same night
# are registered separately and are appended to the queues, never to this
# config's family map.
#
# SCHEMA: identical to experiments/configs/seq_stage2_5seed_v1.yaml, which
# scripts/sequence_track/retrain_stage2.py `load_config` validates and
# scripts/sequence_track/stage2_stats.py reads. Two generalised keys of the
# night-3 stats code are used here for the first time:
#   * `configurations[].role: candidate | control` — an explicit role, so a
#     reference-only arm need not be a family candidate;
#   * `statistics.families.shared_control` — replaces the `"mlp"` literal;
#   * `statistics.slice_predicates` — the registered optional slices;
#   * `statistics.families.map[].members` — the general 2..6 member form with
#     per-member contrast, slice, kind and threshold, plus `screen.require`,
#     `all_row_condition` and `direction_required`.

experiment:
  name: seq_stage3_night3
  registered: 2026-09-12
  block: B
  purpose: >-
    Screen for negative transfer from pooled T20 training onto two registered
    "elite" targets. Six token-MLP arms under one step budget: a pooled
    unconditioned control, a pooled tier-conditioned arm, and for each target
    T in {P, E} a tier-conditioned arm trained on that target's matches only
    plus a row-matched pooled control trained on a deterministic subsample of
    whole training matches of the same row count. The question is whether
    restricting training to the target buys anything on the target's own
    validation rows over (a) the pooled conditioned arm and (b) a pooled arm
    with the same number of rows; and, separately, whether tier conditioning
    alone buys anything on all rows.
  predecessor: experiments/configs/seq_stage2_5seed_v1.yaml
  predecessor_note: >-
    the stage 2 five-seed analysis registration. Nothing here reuses a stage 2
    checkpoint: every arm is trained fresh (D2.2), and `mlp_pool` is a NEW run
    of the stage 2 `mlp` arm under the STEP schedule, not the epoch schedule,
    so it is not stage 2's `mlp` and must never be tabled against it.
  decision_record: docs/sequence_track/night3_acceptance.md
  design: docs/sequence_track/night3_design_draft.md
  runbook: docs/sequence_track/night3_runbook.md
  runner: scripts/sequence_track/retrain_stage2.py
  pin: scripts/sequence_track/pin_stage2.py
  queue:
    - research/sequence_track/queue_laptop_night3.yaml
    - research/sequence_track/queue_mini_night3.yaml
  queue_note: >-
    night 3 is split BY SEED across two machines, as night 1 was: laptop seeds
    7, 29, 42 and mini seeds 13, 101, every configuration on both. The split is
    by seed and never by arm, so no arm's five seeds are confounded with a
    machine relative to another arm's. Each half's job output_dir is
    models/embeddings/seq_stage3/night3/runs/<config_id>/seed_<seed>, because
    run_queue.sh decides skip-vs-run from the COMPLETE marker in output_dir
    plus the config sha256 alone and reads neither the command nor the seed
    subset.
  sign_convention: >-
    candidate minus reference, in validation log loss, negative favourable.
  evidence_status: >-
    VALIDATION-ONLY, PROVISIONAL. Every number of this block is screening
    evidence: checkpoint selection is on the same validation split the
    contrasts are computed on, the target definitions and the whole screening
    hypothesis are OUTCOME-INFORMED by the stage 2 five-seed readout (they are
    frozen here before any night-3 performance read, which makes them
    pre-registered, not confirmatory), the untouched cohort is NOT opened, and
    no test split, market price or betting layer is touched anywhere. Nothing
    here can be LANDED (CLAUDE.md invariant 9), nothing advances, and no
    artifact of record changes.
  forbidden_data:
    - data/golden
    - data/forward_holdout
  forbidden_data_note: >-
    no step of this block reads either tree. The frozen match lists under
    experiments/stage3a/ were built from the i7 train and validation parquets
    and data/t20s_json only (see experiments/stage3a/manifest.json).

data:
  # Identical to stage 2's data block.
  directory: data/xgb_data_i7
  frame_version: i7
  frame_role: ball_frame_i7
  stats_cache_role: stats_cache_i7
  splits_read: [train, validation]
  eval_kit: none
  feature_contract: transformer_t1.build_features
  n_features: 50
  extra_column_read: >-
    `competition_tier`, loaded per row by transformer_t1.load_split for the
    tier embedding, the training-row filter and the tier slices. It is NOT one
    of the 50 features: the unconditioned control never sees it, and a
    conditioned arm sees it only through the registered embedding.

training:
  # Identical to stage 2's training block, including the epoch fields, which
  # are kept so the schema and the training signature are comparable. EVERY
  # configuration overrides the epoch schedule with the registered step budget
  # (params.max_steps / params.eval_every), so `epochs: 30` is carried for the
  # schema and is not what any night-3 arm runs.
  device: mps
  seeds: [7, 13, 29, 42, 101]
  dmodel: 128
  layers: 2
  heads: 4
  batch: 128
  epochs: 30
  learning_rate: 0.0003
  patience: 3
  aux: false
  no_kit: true
  score_test: false
  save_predictions: true
  early_stopping: >-
    NONE. Under the step budget there is no early termination: every arm runs
    exactly max_steps optimiser steps, the validation split is scored every
    eval_every steps, and the selected checkpoint is the best validation log
    loss among those evaluations with ties broken by the earliest step. The
    `patience: 3` field above is the schema's epoch-mode value and is inert.
  step_budget:
    source: experiments/stage3a/steps.json
    max_steps: 3840
    eval_every: 128
    n_train_innings: 16319
    batch: 128
    epochs_equivalent: 30
    rule: >-
      one optimiser step = one batch of 128 innings, the final partial batch of
      an epoch kept; E = ceil(n_train_innings / batch) = 128 and
      S = 30 * E = 3840, with n_train_innings the UNFILTERED pooled training
      innings count (16,319). Both integers are identical for all six arms and
      were computed by scripts/sequence_track/stage3a_freeze_tiers.py from the
      pinned train parquet before any performance read.
    residual_confounding: >-
      equal steps, equal tokens and equal target-tier exposure cannot all hold
      at the pool's proportions. EQUAL STEPS is registered; tokens seen and
      target-tier tokens seen therefore DIFFER across arms, a smaller training
      set sees more epochs, and every arm reports total tokens seen,
      target-tier tokens seen and steps-to-best so the difference is visible.
  selection_rule: >-
    validation log loss = ball-weighted mean negative log-likelihood over ALL
    validation rows, for EVERY arm including the target-only arms. Checkpoint
    selection is never re-done per target (see the shared-artifact contract).
  seed_policy: >-
    all five registered seeds run for every configuration on the first night;
    a family with fewer than five complete paired seeds is NOT_EVALUABLE and is
    never reported at a reduced seed count. Seeds are split laptop 7/29/42 and
    mini 13/101.
  # REPORTING ONLY (reviewer MUST-FIX 2, 2026-09-13). Rendered as one
  # `--report-match-lists` flag on EVERY configuration of this block, so every
  # arm — pooled, conditioned and target-only alike — records how many of each
  # target's training tokens it actually saw, in
  # metrics.json training_schedule.tokens_seen_by_list keyed by basename. The
  # registered step budget makes tokens seen and target-tier tokens seen DIFFER
  # across arms (see training.step_budget.residual_confounding); this is the
  # measurement that makes that difference readable instead of assumed. It
  # selects nothing, changes no tensor, enters neither `arm_params` nor the
  # training signature, and therefore cannot fork a shared pooled checkpoint.
  report_match_lists:
    - experiments/stage3a/target_P_matches.json
    - experiments/stage3a/target_E_matches.json

outputs:
  # The driver writes <outputs.directory>/<config_id>/seed_<seed>, and each
  # queue job's output_dir must be exactly that directory, so this ends in
  # `/runs` and the night's tree is models/embeddings/seq_stage3/night3/.
  directory: models/embeddings/seq_stage3/night3/runs
  summary: summary.yaml
  per_run: [metrics.json, model.pt, run_record.json, predictions_validation.npz]
  save_row_aligned_probabilities: true

# ---------------------------------------------------------------------------
# The frozen Block B inputs. Written by
# scripts/sequence_track/stage3a_freeze_tiers.py before any run; every sha256
# below is the sha256 of the file's bytes as committed, and the driver
# recomputes the sha256 of every `params.train_match_list` into the training
# signature, so a list that drifts changes every affected run's identity.
# ---------------------------------------------------------------------------
freeze:
  generator: scripts/sequence_track/stage3a_freeze_tiers.py
  manifest: experiments/stage3a/manifest.json
  # Re-frozen 2026-09-13 (reviewer MUST-FIX 1): the freeze script now records
  # the ICC full-member name set, the big-3 names and the (empty) alias table
  # it evaluated the E and big3 rules against. The re-run is PURELY ADDITIVE —
  # every list file and steps.json is byte-identical and every sha256 below is
  # unchanged; only manifest.json gained the `team_name_rules` block, so this
  # digest moved from 006ce060f1b17093194aa370a44b2a0491ffec8eac3e551e3cab2bf37138c3eb.
  # retrain_stage2.py now VERIFIES this digest and every list sha256 below
  # against the manifest on disk and refuses on any mismatch.
  manifest_sha256: 6cad98e0766d8112fb7f63fe6645b6b157b3cf888a690bcf167e74cce4c8db4a
  rowmatch_seed: 42
  frame:
    train_parquet_md5: fac0b7bededf0aae1989d654e3eba9e8
    validation_parquet_md5: 326436317310adadabe0175825e57d1b
  steps_json: experiments/stage3a/steps.json
  steps_json_sha256: 10c342e4729bfe5289fe94e1bc2ebbcd079bea503a212105882b6bf598061ac8
  target_definitions:
    target_P: >-
      premium leagues: frame `competition_tier == 3`, the pre-match event-name
      rule in parsing_v2.classify_match_context (PREMIUM_LEAGUES: IPL, BBL,
      CPL, PSL, SA20, ILT20, MLC).
    target_E: >-
      elite: target P union every international (frame `is_international == 1`)
      in which BOTH teams are ICC full members under the frozen name mapping
      parsing_v2.ICC_FULL_MEMBERS, team names as they appear in the cricsheet
      info.teams. The event name plays no role: a qualifier or World Cup match
      between two full members is in E, and any match with an associate side
      is not.
    big3: >-
      E intersected with matches involving at least one of India, Australia or
      England. An elite SUBSET, not a tier above E; those teams' matches
      against associates are not in it. Descriptive readout only.
  lists:
    - id: target_P
      file: experiments/stage3a/target_P_matches.json
      sha256: ad05b7fd1b75feaa15b1b3c2a2013dadfbd04094d72e429a3520c245458a9413
      split: train
      n_matches: 2516
      n_innings: 5063
      n_rows: 591342
      used_by: {training: [mlp_P_tiercond], slices: []}
    - id: rowmatch_P
      file: experiments/stage3a/rowmatch_P_matches.json
      sha256: 82ab077b71d895a70934c6e796e8cc8854bee378fe7d57c3c658dde6a586a605
      split: train
      n_matches: 2570
      n_innings: 5152
      n_rows: 591582
      overshoot_rows: 240
      target_rows: 591342
      used_by: {training: [mlp_rowmatch_P_tiercond], slices: []}
    - id: target_E
      file: experiments/stage3a/target_E_matches.json
      sha256: 5ff0ebd088079139a2fcbca62ac3c30b4506164715e6202bae99aaab2ab7385d
      split: train
      n_matches: 3475
      n_innings: 6990
      n_rows: 812169
      n_from_tier3: 2516
      n_from_elite_intl: 959
      used_by: {training: [mlp_E_tiercond], slices: []}
    - id: target_E_validation
      file: experiments/stage3a/target_E_validation_matches.json
      sha256: 626889fa8d70f0fbcfa9b5690aec6cb651fdbb742c2ccf300a9b9af971019b6d
      split: validation
      n_matches: 243
      n_innings: 480
      n_rows: 55981
      n_from_tier3: 222
      definition: >-
        the SAME E rule applied to the validation split: validation matches
        whose competition_tier is 3, plus validation internationals in which
        both teams are ICC full members. Disjoint from target_E by
        construction, which is exactly why it is a separate file. 222 of its
        243 matches are tier 3, i.e. the target_P validation slice, and 21 are
        elite internationals outside tier 3.
      used_by: {training: [], slices: [target_E]}
    - id: rowmatch_E
      file: experiments/stage3a/rowmatch_E_matches.json
      sha256: 4237f52132db20f5da465199773a4b9f952b29eb5be8060f0a830ea65ffc8f9e
      split: train
      n_matches: 3525
      n_innings: 7070
      n_rows: 812250
      overshoot_rows: 81
      target_rows: 812169
      used_by: {training: [mlp_rowmatch_E_tiercond], slices: []}
    - id: big3_validation
      file: experiments/stage3a/big3_validation_matches.json
      sha256: 49e8f62476d9b21352e324da7a660bd1407423fa12a995c166a9a6a545929b77
      split: validation
      n_matches: 8
      n_innings: 16
      n_rows: 1895
      used_by: {training: [], slices: [big3]}
  assertions_recorded_in_manifest:
    - no match id in any frozen TRAINING list appears in the validation parquet
    - competition_tier and is_international are constant within a match
  train_validation_disjointness: >-
    0 leaked matches for each of target_P, rowmatch_P, target_E, rowmatch_E
    (manifest `train_validation_disjoint`). This is why the E VALIDATION slice
    cannot be read off target_E_matches.json and is its own frozen list — see
    deviations.target_E_validation_list_repointed.

# ---------------------------------------------------------------------------
# Shared-artifact contract (night 3 draft § Block B).
# ---------------------------------------------------------------------------
shared_artifact_contract:
  statement: >-
    exactly ONE checkpoint and ONE row-aligned validation prediction file is
    trained per (configuration, seed) — 6 x 5 = 30 runs — and every family that
    names a configuration reads that same artifact. No configuration is
    retrained per target, per family or per slice.
  selection: >-
    the common all-validation rule (best validation log loss over ALL
    validation rows among the eval_every checkpoints, earliest step on a tie),
    for every configuration, never re-selected per target.
  disclosure: >-
    all-row selection can select AGAINST target-only performance for the
    target-only arms, because their checkpoint is chosen on rows they were not
    trained on. It is registered anyway: one artifact per (config, seed) is
    what makes the two families share controls and keeps the run count at 30.
  multiplicity: >-
    claims are FAMILY-LOCAL only. family_3a_P and family_3a_E are correlated
    screens over overlapping rows with shared controls, not independent
    replications; no aggregate "either target passes" claim is made, and no
    Holm correction is pooled across families.

configurations:
  - id: mlp_pool
    arm: mlp
    role: control
    params: {max_steps: 3840, eval_every: 128}
    access: {features: true, history: false, identity: false, prod_logits: false}
    history_input: none
    wiring: token_mlp
    reference: []
    reference_note: >-
      the SHARED CONTROL of this config (statistics.families.shared_control):
      every family's non-inferiority gates are taken against it, and it is a
      candidate in no family.
    tests: >-
      control — pooled, UNCONDITIONED token model: all training rows, no tier
      input of any kind. It carries NO reporting-only tier param: a pooled
      checkpoint must be shareable by every family that names it, and a
      reporting flag that entered the training signature would fork the
      artifact for no modelling reason. Target-tier exposure for this arm is
      read from the training-row counts in the freeze manifest instead.
    queue_order: 1
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 7 --data-dir data/xgb_data_i7 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 13 --data-dir data/xgb_data_i7 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool/seed_13
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 29 --data-dir data/xgb_data_i7 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool/seed_29
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 42 --data-dir data/xgb_data_i7 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool/seed_42
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 101 --data-dir data/xgb_data_i7 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool/seed_101

  - id: mlp_pool_tiercond
    arm: mlp
    role: candidate
    params: {max_steps: 3840, eval_every: 128, tier_embed: 8}
    access: {features: true, history: false, identity: false, prod_logits: false}
    history_input: none
    wiring: token_mlp
    reference: [mlp_pool]
    reference_note: >-
      candidate of family_3a_cond against mlp_pool, and the CONDITIONING-MATCHED
      reference (superiority_1) of both family_3a_P and family_3a_E.
    tests: >-
      tier conditioning alone — all training rows, plus a dim-8
      `competition_tier` embedding concatenated to the token input and a
      per-tier output bias on the six logits. The night-3 plan's "partially
      pooled" arm and its conditioning-matched pooled control collapse to this
      one arm under shared weights; recorded as such.
    queue_order: 2
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 7 --data-dir data/xgb_data_i7 --tier-embed 8 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool_tiercond/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 13 --data-dir data/xgb_data_i7 --tier-embed 8 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool_tiercond/seed_13
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 29 --data-dir data/xgb_data_i7 --tier-embed 8 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool_tiercond/seed_29
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 42 --data-dir data/xgb_data_i7 --tier-embed 8 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool_tiercond/seed_42
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 101 --data-dir data/xgb_data_i7 --tier-embed 8 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_pool_tiercond/seed_101

  - id: mlp_P_tiercond
    arm: mlp
    role: candidate
    params: {max_steps: 3840, eval_every: 128, tier_embed: 8, train_tier: 3}
    access: {features: true, history: false, identity: false, prod_logits: false}
    history_input: none
    wiring: token_mlp
    reference: [mlp_pool_tiercond, mlp_rowmatch_P_tiercond, mlp_pool]
    tests: >-
      target P only — identical conditioning to mlp_pool_tiercond, trained on
      whole innings of `competition_tier == 3` training matches only (2,516
      matches, 5,063 innings, 591,342 rows). Validation is NEVER filtered: the
      full validation split is scored and the checkpoint is selected on all of
      it. Tier embeddings and biases for tiers this arm never sees stay at
      initialisation and are recorded as untrained.
    train_row_filter: >-
      `--train-tier 3`, the frame column, which is exactly the membership of
      experiments/stage3a/target_P_matches.json (a tier filter and that list
      select the same training innings; the list is carried in `freeze.lists`
      for provenance and row counts, and the filter is what the driver passes).
    queue_order: 3
    command:
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 7 --data-dir data/xgb_data_i7 --tier-embed 8 --train-tier 3 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_P_tiercond/seed_7
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 13 --data-dir data/xgb_data_i7 --tier-embed 8 --train-tier 3 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_P_tiercond/seed_13
      - uv run --no-sync python scripts/transformer_t1.py --arm mlp --seed 29 --data-dir data/xgb_data_i7 --tier-embed 8 --train-tier 3 --max-steps 3840 --eval-every 128 --report-match-lists experiments/stage3a/target_P_matches.json,experiments/stage3a/target_E_matches.json --dmodel 128 --layers 2 --heads 4 --batch 128 --epochs 30 --lr 0.0003 --patience 3 --device mps --no-kit --save-predictions --stats-cache-role stats_cache_i7 --out models/embeddings/seq_stage3/night3/runs/mlp_P_tiercond/seed_29
