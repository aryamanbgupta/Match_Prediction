# Stage 2 SEED EXTENSION 2: ownership and window families. See
# experiments/configs/seq_stage2_ext2_v1.yaml for why this set completes the
# five-seed window requirement. One retry can consume 4x expected_hours.
defaults:
  memory_floor_gb: 12
  memory_cap_gb: 24
  poll_seconds: 30
  stop_file: research/sequence_track/STOP_laptop_ext2
jobs:
