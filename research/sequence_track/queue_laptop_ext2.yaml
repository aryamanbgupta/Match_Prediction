  config: experiments/configs/seq_stage2_ext2_v1.yaml
  command: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2 VECLIB_MAXIMUM_THREADS=2 uv run --no-sync python scripts/sequence_track/retrain_stage2.py --config experiments/configs/seq_stage2_ext2_v1.yaml
    --config-ids same_entity_k0 --seeds 29 --machine laptop
  output_dir: models/embeddings/seq_stage2/runs/same_entity_k0/seed_29
  expected_hours: 0.2
  machine: laptop
