# Sequence-track job queue — BATCH 2 rung 4b VERSION 2, MINI HALF.
# Read by research/sequence_track/run_queue.sh.
#
# Jobs run in listed order, one at a time, on the machine whose tag matches
# --machine. A job is skipped when its output_dir holds a COMPLETE marker whose
# config_sha256 equals the sha256 of its config file, so a batch that was
# stopped resumes where it left off.
#
# Paths are relative to the repository root unless absolute. Commands run
# through /bin/bash -c with the repository root as the working directory.
#
# ---------------------------------------------------------------------------
# RUNG 4b VERSION 2 ONLY. These queues carry the two `identity_residual`
# configurations of experiments/configs/seq_stage3_batch2_4b_v2.yaml and
# nothing else: 4d and C114 already ran from
# research/sequence_track/queue_{laptop,mini}_batch2.yaml and are not
# re-queued here.
#
# WHY A v2. Rung 4b's v1 runs all trained and were then REFUSED by the driver's
# checkpoint verification, which hard-coded `feat_proj` / `head` as the
# parameter set of every non-recurrent arm; the `identity_residual` arm builds
# neither. That is fixed, and the rung's family — which v1 had to defer because
# stage2_stats could not difference a member against a fixed npz — is now
# registered in the v2 config, BEFORE any v2 run exists.
#
# THE v1 OUTPUT ROOT IS NOT TOUCHED. v1's runs stay under
# models/embeddings/seq_stage3/batch2/runs/ with their FAILED markers, as the
# record of the defect; every job below writes under
# models/embeddings/seq_stage3/batch2_4b_v2/runs/, a separate tree.
#
# SPLIT BY SEED, as nights 1 and 3 and batch 2 were: seeds 7, 29 and 42 on the
# laptop and seeds 13 and 101 on the mini. Both configurations run on both
# machines. The split is by SEED and never by arm, so both lambdas carry the
# same three-laptop / two-mini mix and neither is advantaged; the residual
# seed-machine confounding is reported, not modelled.
#
# This half holds 4 jobs.
#
# ORDER IS SEED-MAJOR, then registered configuration order (l3 then l2): one
# whole seed pass across both configurations before the next seed, so a
# truncated queue leaves WHOLE paired seeds rather than one lambda ahead of the
# other.
#
# --config IS EXPLICIT ON EVERY COMMAND. retrain_stage2.py defaults --config to
# experiments/configs/seq_stage2_v1.yaml, so a job that omitted it would
# silently train STAGE 2 arms into this rung's output directories.
#
# WHY output_dir IS SEED-SPECIFIC: run_queue.sh decides skip-vs-run from the
# COMPLETE marker in output_dir and the config sha256 ALONE -- it does not look
# at the command or at the seed subset. Each job's output_dir is exactly the
# directory retrain_stage2.py writes that seed's run into, so one marker means
# one finished run.
#
# THREAD CAPS LIVE IN EACH COMMAND, NOT IN defaults:
# scripts/sequence_track/queue_lib.py validates `defaults` against
# {memory_floor_gb, memory_cap_gb, poll_seconds, stop_file} and IGNORES every
# other field with a warning.
#
# EXPECTED HOURS: unchanged from the v1 queues' identity_residual budget,
# 0.3 h on the mini. The arm, its inputs and its schedule are v1's
# verbatim, so the measured cost is v1's; nothing here is re-estimated.
#
# RETRY BUDGET: run_queue.sh gives each job a per-attempt alarm of
# 2 * expected_hours AND retries once after a failure or a timeout, so a hung
# job can consume up to 4 * expected_hours before the queue moves on. Sum of
# expected_hours over these 4 jobs is 1.20 h; sum of
# 4 * expected_hours is 4.80 h.
# ---------------------------------------------------------------------------

defaults:
  # Refuse to launch a job when available memory (vm_stat: free + inactive +
  # speculative) is below this. The mini has 16 GB and runs nothing
  # interactive, so the floor is lower and the cap is tighter than the
  # laptop's.
  memory_floor_gb: 4
  # Kill a job whose process-tree RSS exceeds this.
  memory_cap_gb: 10
  # Watchdog poll interval, seconds.
  poll_seconds: 30
  # Touch this file to stop THIS queue between jobs; remove it to resume.
  # Each half has its own stop file, and the v2 files are distinct from the
  # batch-2 files so stopping one never stops the other.
  stop_file: research/sequence_track/STOP_mini_batch2_4b_v2

jobs:
  - id: identity_residual_l3-s13
    config: experiments/configs/seq_stage3_batch2_4b_v2.yaml
    command: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2 VECLIB_MAXIMUM_THREADS=2 uv run --no-sync python scripts/sequence_track/retrain_stage2.py --config experiments/configs/seq_stage3_batch2_4b_v2.yaml --config-ids identity_residual_l3 --seeds 13 --machine mini
    output_dir: models/embeddings/seq_stage3/batch2_4b_v2/runs/identity_residual_l3/seed_13
    expected_hours: 0.3
    machine: mini
    notes: >
      Rung 4b v2 job 1 of 4 (mini): configuration identity_residual_l3, seed 13.
      rung 4b, lambda 0.001: identity residual over the frozen ref_eb_ctx probabilities. Candidate of family_4b_l3.
      Budget 0.3 h; the identity_residual row of the capacity table in
      docs/sequence_track/night3_runbook.md § "Batch 2 (4d, 4b, C114)".

  - id: identity_residual_l2-s13
    config: experiments/configs/seq_stage3_batch2_4b_v2.yaml
    command: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2 VECLIB_MAXIMUM_THREADS=2 uv run --no-sync python scripts/sequence_track/retrain_stage2.py --config experiments/configs/seq_stage3_batch2_4b_v2.yaml --config-ids identity_residual_l2 --seeds 13 --machine mini
    output_dir: models/embeddings/seq_stage3/batch2_4b_v2/runs/identity_residual_l2/seed_13
    expected_hours: 0.3
    machine: mini
    notes: >
      Rung 4b v2 job 2 of 4 (mini): configuration identity_residual_l2, seed 13.
      rung 4b, lambda 0.01: the same arm, the other registered penalty. Candidate of family_4b_l2.
      Budget 0.3 h; the identity_residual row of the capacity table in
      docs/sequence_track/night3_runbook.md § "Batch 2 (4d, 4b, C114)".

  - id: identity_residual_l3-s101
    config: experiments/configs/seq_stage3_batch2_4b_v2.yaml
    command: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2 VECLIB_MAXIMUM_THREADS=2 uv run --no-sync python scripts/sequence_track/retrain_stage2.py --config experiments/configs/seq_stage3_batch2_4b_v2.yaml --config-ids identity_residual_l3 --seeds 101 --machine mini
    output_dir: models/embeddings/seq_stage3/batch2_4b_v2/runs/identity_residual_l3/seed_101
    expected_hours: 0.3
    machine: mini
    notes: >
      Rung 4b v2 job 3 of 4 (mini): configuration identity_residual_l3, seed 101.
      rung 4b, lambda 0.001: identity residual over the frozen ref_eb_ctx probabilities. Candidate of family_4b_l3.
      Budget 0.3 h; the identity_residual row of the capacity table in
      docs/sequence_track/night3_runbook.md § "Batch 2 (4d, 4b, C114)".

  - id: identity_residual_l2-s101
    config: experiments/configs/seq_stage3_batch2_4b_v2.yaml
    command: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2 VECLIB_MAXIMUM_THREADS=2 uv run --no-sync python scripts/sequence_track/retrain_stage2.py --config experiments/configs/seq_stage3_batch2_4b_v2.yaml --config-ids identity_residual_l2 --seeds 101 --machine mini
    output_dir: models/embeddings/seq_stage3/batch2_4b_v2/runs/identity_residual_l2/seed_101
    expected_hours: 0.3
    machine: mini
    notes: >
      Rung 4b v2 job 4 of 4 (mini): configuration identity_residual_l2, seed 101.
      rung 4b, lambda 0.01: the same arm, the other registered penalty. Candidate of family_4b_l2.
      Budget 0.3 h; the identity_residual row of the capacity table in
      docs/sequence_track/night3_runbook.md § "Batch 2 (4d, 4b, C114)".
