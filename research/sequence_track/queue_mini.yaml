# Sequence-track job queue, read by research/sequence_track/run_queue.sh.
#
# Jobs run in listed order, one at a time, on the machine whose tag matches
# --machine (default: laptop). A job is skipped when its output_dir holds a
# COMPLETE marker whose config_sha256 equals the sha256 of its config file,
# so a night that was stopped resumes where it left off.
#
# Paths are relative to the repository root unless absolute. Commands run
# through /bin/bash -c with the repository root as the working directory.
#
# ---------------------------------------------------------------------------
# Stage 2, night 1 (docs/sequence_track/stage2_acceptance.md, D8 checks 8.2
# and 8.3). THE NIGHT IS SPLIT BY SEED ACROSS TWO MACHINES (Astra MUST-FIX 9,
# the user's decision 2026-09-12): seed 7 runs on the laptop
# (research/sequence_track/queue_laptop.yaml) and seed 13 on the Mac mini
# (research/sequence_track/queue_mini.yaml). This file is the mini half:
# sixteen jobs, one per registered configuration, in the registered queue
# order, ONE seed each (seed 13).
#
# Every job names the SAME config file, so a change to the config changes all
# sixteen signatures on both machines and the driver's reuse check then
# re-runs only what is missing.
#
# WHY output_dir IS SEED-SPECIFIC: run_queue.sh decides skip-vs-run from the
# COMPLETE marker in output_dir and the config sha256 ALONE -- it does not
# look at the command or at the seed subset. A per-configuration marker
# directory shared by both halves would therefore let seed 7's COMPLETE
# suppress seed 13 (or the reverse) as soon as the two trees are synced. Each
# job's output_dir is models/embeddings/seq_stage2/runs/<config_id>/seed_<seed>,
# which is exactly the directory retrain_stage2.py writes that seed's run
# into, so one marker means one finished run.
#
# THREAD CAPS LIVE IN EACH COMMAND, NOT IN defaults: scripts/sequence_track/
# queue_lib.py validates `defaults` against
# {memory_floor_gb, memory_cap_gb, poll_seconds, stop_file} and every other
# field -- per-job memory fields included -- is IGNORED with a warning
# (KNOWN_DEFAULT_FIELDS / KNOWN_JOB_FIELDS). So the memory floor and cap are
# queue-wide defaults, and the thread caps are environment prefixes on each
# command.
#
# EXPECTED HOURS: expected_hours = ceil_to_0.05((30 * smoke_seconds * F + 120)
# / 3600), with F = 3 on the mini and smoke_seconds the D6.3 laptop
# load-plus-one-epoch wall time. 30 is the registered epoch ceiling (patience
# 3 usually stops earlier, so this is an upper bound), and 120 s covers frame
# load and startup.
#
# RETRY BUDGET: run_queue.sh gives each job a per-attempt alarm of
# 2 * expected_hours AND retries once after a failure or a timeout, so a hung
# job can consume up to 4 * expected_hours of the night before the queue moves
# on. The sum of 4 * expected_hours over these sixteen jobs is 27.0 h;
# the sum of expected_hours is 6.75 h.
#
# xLSTM RECALIBRATED (2026-09-12): the xLSTM cell's normalisation fix (Astra
# MUST-FIX 1) and its restored output gate changed the arm, so it was re-smoked
# on an idle machine at 73.2 s per load-plus-epoch (was 62.7 s). xlstm's
# expected_hours below is computed FROM THAT CORRECTED SMOKE:
# (30 x 73.2 x 3 + 120)/3600 = 1.8633 h -> 1.90. No other job's budget
# changed. A one-hour blanket timeout is what Astra flagged as able to kill
# legitimate training -- do not reintroduce one.
# ---------------------------------------------------------------------------

defaults:
  # Refuse to launch a job when available memory (vm_stat: free + inactive +
  # speculative) is below this. Mini-sized: the Mac mini has 16 GB and runs nothing else.
  memory_floor_gb: 3
  # Kill a job whose process-tree RSS exceeds this.
  memory_cap_gb: 12
  # Watchdog poll interval, seconds.
  poll_seconds: 30
  # Touch this file to stop THIS queue between jobs; remove it to resume.
  # Each half has its own stop file so stopping one machine never stops the
  # other.
  stop_file: research/sequence_track/STOP_mini

jobs:
  - id: mlp-s13
    config: experiments/configs/seq_stage2_v1.yaml
    command: OMP_NUM_THREADS=4 uv run --no-sync python scripts/sequence_track/retrain_stage2.py --config-ids mlp --seeds 13 --machine mini
    output_dir: models/embeddings/seq_stage2/runs/mlp/seed_13
    expected_hours: 0.20
    machine: mini
    notes: >
      Configuration 1 of 16, seed 13: the shared control; every family's gate reference.
      Budget: 30 x 6.5 s x 3 + 120 s = 705.0 s
      = 0.1958 h, rounded up to 0.20.

  - id: full-s13
