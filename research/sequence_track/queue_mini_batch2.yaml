# Sequence-track job queue — BATCH 2 (4d, C114, 4b), MINI HALF. Read by
# research/sequence_track/run_queue.sh.
#
# Jobs run in listed order, one at a time, on the machine whose tag matches
# --machine. A job is skipped when its output_dir holds a COMPLETE marker whose
# config_sha256 equals the sha256 of its config file, so a batch that was
# stopped resumes where it left off.
#
# Paths are relative to the repository root unless absolute. Commands run
# through /bin/bash -c with the repository root as the working directory.
#
# ---------------------------------------------------------------------------
# BATCH 2 (docs/sequence_track/batch2_acceptance.md; design
# docs/sequence_track/night3_design_draft.md v7 § "Block E" and § "C114").
# THE BATCH IS SPLIT BY SEED ACROSS TWO MACHINES, as nights 1 and 3 were:
# seeds 7, 29 and 42 on the laptop and seeds 13 and 101 on the Mac mini. Every
# configuration runs on both machines. The split is by SEED and never by arm,
# so every arm carries the same three-laptop / two-mini mix and no arm is
# advantaged relative to another; the residual seed-machine confounding is
# reported, not modelled.
#
# THREE CONFIG FILES, not one. `statistics.families.shared_control` is
# file-wide, and the three rungs have three different controls (mlp_counts,
# mlp_114, and — for 4b — a frozen npz that is not a configuration at all), so
# the batch is registered as three files and this queue carries three job
# groups. Every job names its own --config explicitly.
#
# This half holds 14 jobs.
#
# ORDER IS RUNG-MAJOR, THEN SEED-MAJOR, then registered configuration order:
# all of 4d, then all of C114, then all of 4b; and inside each rung, one whole
# seed pass across that rung's configurations before the next seed. Rationale:
# a truncated batch then leaves WHOLE paired seeds of the rungs that ran and
# loses the tail rungs entirely, rather than leaving every rung half-seeded and
# every family NOT_EVALUABLE. 4d is first because the design draft registers it
# first ("4d first"); 4b is last because it is the rung with no family, so it
# is the cheapest thing to lose.
#
# --config IS EXPLICIT ON EVERY COMMAND. retrain_stage2.py defaults --config to
# experiments/configs/seq_stage2_v1.yaml, so a batch-2 job that omitted it
# would silently train STAGE 2 arms into batch-2 output directories.
#
# WHY output_dir IS SEED-SPECIFIC: run_queue.sh decides skip-vs-run from the
# COMPLETE marker in output_dir and the config sha256 ALONE -- it does not look
# at the command or at the seed subset. A per-configuration marker directory
# shared by both halves would let one machine's COMPLETE suppress the other's
# as soon as the two trees are synced. Each job's output_dir is exactly the
# directory retrain_stage2.py writes that seed's run into, so one marker means
# one finished run.
#
# THREAD CAPS LIVE IN EACH COMMAND, NOT IN defaults:
# scripts/sequence_track/queue_lib.py validates `defaults` against
# {memory_floor_gb, memory_cap_gb, poll_seconds, stop_file} and IGNORES every
# other field with a warning. So the memory floor and cap are queue-wide
# defaults and the thread caps are environment prefixes on each command.
#
# EXPECTED HOURS ARE PER ARM CLASS, NOT PER RUNG, because the cost driver is
# the architecture and the input width, not which rung a config belongs to.
# From the code-gate smokes at 200 steps -- identity_residual 6 s, mlp with 66
# inputs 7 s, full with 114 inputs 16 s -- a full 30-epoch run is about 45 s
# (identity_residual), 60 s (any token arm) and 240 s (any `full` arm) on the
# laptop, and roughly three times that on the mini. Rounded up to the 0.05 h
# grid with the same margin the night-3 queues used:
#   token arms (mlp_counts, mlp_spread_recency, mlp_114) and the two
#   identity_residual arms  ->  0.30 h
#   `full` arms (full_114, full_50)                      ->  0.90 h
# `full_50` is budgeted at the `full` rate although it reads only 50 columns:
# it is the same architecture and the smoke that produced 240 s was the wider
# of the two, so the budget is deliberately generous rather than measured
# separately. The populated per-configuration, per-machine capacity table --
# smoke seconds, budgeted hours, maximum duration, overheads and the queue
# deadline -- is docs/sequence_track/night3_runbook.md § "Batch 2 (4d, 4b,
# C114)". LAUNCH IS REFUSED IF ANY ROW OF THAT TABLE IS BLANK.
#
# RETRY BUDGET: run_queue.sh gives each job a per-attempt alarm of
# 2 * expected_hours AND retries once after a failure or a timeout, so a hung
# job can consume up to 4 * expected_hours before the queue moves on. Sum of
# expected_hours over these 14 jobs is 6.60 h; sum of 4 * expected_hours is
# 26.40 h.
# ---------------------------------------------------------------------------

defaults:
  # Refuse to launch a job when available memory (vm_stat: free + inactive +
  # speculative) is below this. The mini has 16 GB and runs nothing
  # interactive, so the floor is lower and the cap is tighter than the
  # laptop's.
  memory_floor_gb: 4
  # Kill a job whose process-tree RSS exceeds this.
  memory_cap_gb: 10
  # Watchdog poll interval, seconds.
  poll_seconds: 30
  # Touch this file to stop THIS queue between jobs; remove it to resume.
  # Each half has its own stop file so stopping one machine never stops the
  # other, and batch 2's files are distinct from night 3's.
  stop_file: research/sequence_track/STOP_mini_batch2

jobs:
  - id: mlp_counts-s13
    config: experiments/configs/seq_stage3_batch2_4d_v1.yaml
    command: OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2 VECLIB_MAXIMUM_THREADS=2 uv run --no-sync python scripts/sequence_track/retrain_stage2.py --config experiments/configs/seq_stage3_batch2_4d_v1.yaml --config-ids mlp_counts --seeds 13 --machine mini
    output_dir: models/embeddings/seq_stage3/batch2/runs/mlp_counts/seed_13
    expected_hours: 0.3
    machine: mini
    notes: >
      Batch 2 job 1 of 14 (mini): rung 4d, configuration mlp_counts, seed 13.
      rung 4d control: 50-feature contract + the two as-of ball counts; the shared control of family_4d.
      Budget 0.3 h; see the capacity table in
      docs/sequence_track/night3_runbook.md § "Batch 2 (4d, 4b, C114)".

