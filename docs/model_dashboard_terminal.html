<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CricML — Model Terminal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #07080a;
    --surface: #0f1115;
    --surface-2: #14171d;
    --border: #232831;
    --border-strong: #3a4150;
    --text: #d6dde6;
    --text-2: #9aa4b2;
    --muted: #5d6675;
    --amber: #f6b73c;
    --amber-soft: rgba(246,183,60,0.12);
    --cyan: #4dd0e1;
    --green: #3fc67e;
    --red: #ff5d5d;
    --orange: #ff8a3d;
    --blue: #6ea8ff;
    --violet: #b58cff;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; }
  body {
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    display: flex; align-items: center; gap: 24px;
    background: #03050b; border-bottom: 1px solid var(--border);
    padding: 6px 12px;
    font-size: 11px; color: var(--text-2);
    letter-spacing: 0.04em;
  }
  .topbar .brand { color: var(--amber); font-weight: 700; letter-spacing: 0.18em; }
  .topbar .sep { color: var(--muted); }
  .topbar .pill {
    padding: 2px 8px; border: 1px solid var(--border); border-radius: 2px;
    color: var(--text); background: var(--surface);
  }
  .topbar .pill.live { color: var(--green); border-color: rgba(63,198,126,0.4); }
  .topbar .clock { margin-left: auto; color: var(--cyan); }

  .tabs { display: flex; gap: 2px; padding: 0 8px; background: #03050b; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 6px 14px; cursor: pointer; color: var(--text-2);
    border-top: 2px solid transparent;
    border-left: 1px solid transparent; border-right: 1px solid transparent;
    background: transparent;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .tab:hover { color: var(--text); background: var(--surface); }
  .tab.active {
    background: var(--bg); color: var(--amber);
    border-top: 2px solid var(--amber);
    border-left-color: var(--border); border-right-color: var(--border);
  }

  .status-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .status-cell {
    padding: 10px 14px;
    border-right: 1px solid var(--border);
  }
  .status-cell:last-child { border-right: none; }
  .status-cell .lbl {
    font-size: 9.5px; letter-spacing: 0.16em; color: var(--muted);
    text-transform: uppercase;
  }
  .status-cell .val { font-size: 22px; color: var(--text); margin-top: 4px; font-weight: 600; }
  .status-cell .val.amber { color: var(--amber); }
  .status-cell .val.green { color: var(--green); }
  .status-cell .val.cyan  { color: var(--cyan); }
  .status-cell .sub { font-size: 10.5px; color: var(--text-2); margin-top: 2px; }
  .status-cell .delta-pos { color: var(--green); }
  .status-cell .delta-neg { color: var(--red); }

  .grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 8px;
    padding: 8px;
  }
  .pane {
    background: var(--surface); border: 1px solid var(--border); border-radius: 0;
    overflow: hidden;
  }
  .pane-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    font-size: 10px; letter-spacing: 0.16em; color: var(--amber);
    text-transform: uppercase;
  }
  .pane-header .meta { color: var(--muted); letter-spacing: 0.04em; text-transform: none; }
  .pane-body { padding: 8px 10px; }
  .pane-body.scroll { max-height: 400px; overflow-y: auto; }

  /* === LADDER TABLE === */
  table.ladder { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.ladder th, table.ladder td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.ladder th { color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; font-size: 9.5px; cursor: pointer; user-select: none; background: var(--surface-2); position: sticky; top: 0; }
  table.ladder th:hover { color: var(--amber); }
  table.ladder td.left { text-align: left; }
  table.ladder tbody tr:hover { background: rgba(246,183,60,0.05); cursor: pointer; }
  table.ladder tbody tr.prod { background: rgba(246,183,60,0.08); }
  table.ladder tbody tr.prod td.left { color: var(--amber); font-weight: 700; }
  table.ladder .pos { color: var(--green); }
  table.ladder .neg { color: var(--red); }
  table.ladder .dim { color: var(--muted); }
  .badge {
    display: inline-block; padding: 1px 6px; font-size: 9.5px;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--border-strong); border-radius: 2px;
    color: var(--text-2);
  }
  .badge.prod    { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
  .badge.landed  { color: var(--green); border-color: rgba(63,198,126,0.5); }
  .badge.dropped { color: var(--red);   border-color: rgba(255,93,93,0.5); }
  .badge.dropped_at_corr { color: var(--orange); border-color: rgba(255,138,61,0.5); }
  .badge.ref     { color: var(--cyan);  border-color: rgba(77,208,225,0.5); }
  .badge.archived{ color: var(--muted); border-color: var(--border-strong); }
  .badge.prod_props { color: var(--violet); border-color: rgba(181,140,255,0.5); }
  .gates { font-family: monospace; letter-spacing: 1px; }
  .gates .on  { color: var(--green); }
  .gates .off { color: var(--muted); }
  .gates .na  { color: var(--muted); opacity: 0.4; }

  /* === HEATMAP === */
  .heat-tbl { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  .heat-tbl th, .heat-tbl td { padding: 4px 6px; text-align: center; }
  .heat-tbl th { color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; font-size: 9.5px; }
  .heat-tbl td.label { text-align: left; color: var(--text-2); }
  .heat-cell { padding: 6px 4px; border-radius: 2px; font-weight: 600; }

  /* === LINEAGE TREE === */
  .lineage { font-size: 11px; line-height: 1.6; padding: 4px 0; }
  .lineage-node {
    display: grid;
    grid-template-columns: 28px 14px 1fr;
    align-items: start;
    padding: 2px 0;
  }
  .lineage-pipe { color: var(--border-strong); white-space: pre; padding-left: 4px; }
  .lineage-mark { color: var(--amber); }
  .lineage-mark.green { color: var(--green); }
  .lineage-mark.red { color: var(--red); }
  .lineage-mark.orange { color: var(--orange); }
  .lineage-mark.cyan { color: var(--cyan); }
  .lineage-mark.muted { color: var(--muted); }
  .lineage-text { color: var(--text); }
  .lineage-text .meta { color: var(--text-2); }
  .lineage-text .label { color: var(--text); font-weight: 600; }
  .lineage-text.prod .label { color: var(--amber); }
  .lineage-text.dropped .label { color: var(--text-2); }

  /* === SIZING TABLE === */
  table.sizing { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.sizing th, table.sizing td { padding: 4px 6px; text-align: right; }
  table.sizing th { color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; font-size: 9.5px; border-bottom: 1px solid var(--border); }
  table.sizing tbody tr:hover { background: rgba(246,183,60,0.05); }
  table.sizing td.left { text-align: left; }
  table.sizing tr.opt td { color: var(--green); font-weight: 600; }
  .ci-bar-cell { width: 100px; }
  .ci-bar { height: 8px; background: var(--surface-2); border: 1px solid var(--border); position: relative; border-radius: 1px; }
  .ci-bar-fill { position: absolute; top: 0; bottom: 0; background: var(--green); }
  .ci-bar-fill.neg { background: var(--red); }
  .ci-zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--text-2); }

  /* === TICKER === */
  .ticker { background: #03050b; border-top: 1px solid var(--border); overflow: hidden; height: 24px; position: relative; }
  .ticker-track { display: flex; gap: 32px; white-space: nowrap; padding: 4px 0; animation: ticker-scroll 60s linear infinite; }
  .ticker-item { font-size: 11px; color: var(--text-2); }
  .ticker-item .tag { color: var(--amber); margin-right: 6px; letter-spacing: 0.1em; }
  .ticker-item .tag.green { color: var(--green); }
  .ticker-item .tag.red   { color: var(--red); }
  @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

  /* === MODAL === */
  .modal-bg {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    align-items: flex-start; justify-content: center; padding: 40px 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border-strong);
    width: 100%; max-width: 880px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .modal-header .title { color: var(--amber); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
  .modal-header .close { color: var(--text-2); cursor: pointer; padding: 2px 8px; }
  .modal-header .close:hover { color: var(--red); }
  .modal-body { padding: 16px; }
  .modal-body h3 { color: var(--cyan); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin: 16px 0 6px; }
  .modal-body h3:first-child { margin-top: 0; }
  .modal-body .kvtable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .modal-body .kvtable td { padding: 3px 6px; border-bottom: 1px dotted var(--border); }
  .modal-body .kvtable td.k { color: var(--muted); width: 40%; }
  .modal-body p { color: var(--text-2); margin: 4px 0; }

  .nav-foot {
    text-align: center; padding: 10px;
    color: var(--muted); font-size: 10px; letter-spacing: 0.1em;
    border-top: 1px solid var(--border);
  }
  .nav-foot a { color: var(--cyan); text-decoration: none; padding: 0 12px; }
  .nav-foot a:hover { color: var(--amber); }

  .err {
    padding: 24px; text-align: center; color: var(--red);
  }
  .err code { color: var(--amber); }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">CRICML // TERMINAL</span>
  <span class="sep">│</span>
  <span class="pill live">●&nbsp;PROD</span>
  <span id="prod-name">xgb_match_v3_m7_production</span>
  <span class="sep">│</span>
  <span class="pill">SIZE: flat 1u, edge ≥ 0</span>
  <span class="sep">│</span>
  <span class="pill">EVAL: iter ≥$50k (n=170)</span>
  <span class="clock" id="clock">2026-05-14</span>
</div>

<div class="tabs">
  <button class="tab active" data-tab="match">Match-level direct</button>
  <button class="tab" data-tab="ball">Ball-level / props</button>
  <button class="tab" data-tab="lineage">Lineage</button>
  <button class="tab" data-tab="sizing">Sizing</button>
  <button class="tab" data-tab="features">Features</button>
</div>

<div id="content"><div class="err">Loading <code>dashboard_data.json</code>…</div></div>

<div class="ticker">
  <div class="ticker-track" id="ticker-track"></div>
</div>

<div class="nav-foot">
  <a href="model_dashboard_trader.html">[ Trader desk view → ]</a>
  <a href="predictions_tracker.html">[ Live predictions tracker → ]</a>
  <a href="project_overview.html">[ Project overview → ]</a>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <span class="title" id="modal-title">—</span>
      <span class="close" onclick="closeModal()">[ × ]</span>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
let DATA = null;
let CURRENT_TAB = 'match';

function fmt(x, dp=2) {
  if (x == null) return '<span class="dim">—</span>';
  return Number(x).toFixed(dp);
}
function fmtPct(x, dp=1) {
  if (x == null) return '<span class="dim">—</span>';
  const sign = x > 0 ? '+' : '';
  const cls = x > 0 ? 'pos' : (x < 0 ? 'neg' : 'dim');
  return `<span class="${cls}">${sign}${Number(x).toFixed(dp)}%</span>`;
}
function fmtCI(ci, dp=1, suffix='') {
  if (!ci || ci.length !== 2) return '<span class="dim">—</span>';
  return `[${ci[0].toFixed(dp)}${suffix}, ${ci[1].toFixed(dp)}${suffix}]`;
}
function gateBlocks(m) {
  const order = ['iter_50k_ll_beats_market', 'iter_50k_roi_ci_pos', 'iter_100k_roi_ci_pos', 'golden_50k_roi_ci_pos', 'close_roi_ci_pos'];
  return '<span class="gates">' + order.map(k => {
    const v = m.gates ? m.gates[k] : null;
    if (v === true) return '<span class="on">●</span>';
    if (v === false) return '<span class="off">○</span>';
    return '<span class="na">·</span>';
  }).join('') + '</span>';
}

function renderStatusStrip() {
  const p = DATA.production.match_level;
  const i50k = p.headline_iter_50k;
  const i100k = p.headline_iter_100k;
  const close = p.headline_close;
  const ipl = p.headline_2026_04_ipl;
  const llDelta = i50k.ll - i50k.market_ll;
  return `
    <div class="status-strip">
      <div class="status-cell">
        <div class="lbl">PROD MODEL</div>
        <div class="val amber">M7</div>
        <div class="sub">${p.feature_count} features · ${p.mode}</div>
        <div class="sub">${p.sizing}</div>
      </div>
      <div class="status-cell">
        <div class="lbl">ITER ≥$50K LL</div>
        <div class="val ${llDelta < 0 ? 'green' : ''}">${i50k.ll.toFixed(4)}</div>
        <div class="sub">vs market ${i50k.market_ll.toFixed(4)} <span class="${llDelta<0?'delta-pos':'delta-neg'}">${llDelta>0?'+':''}${llDelta.toFixed(4)}</span></div>
      </div>
      <div class="status-cell">
        <div class="lbl">ITER ≥$50K FLAT ROI</div>
        <div class="val green">+${i50k.roi.toFixed(2)}%</div>
        <div class="sub">CI [${i50k.roi_ci[0].toFixed(2)}%, ${i50k.roi_ci[1].toFixed(2)}%]</div>
      </div>
      <div class="status-cell">
        <div class="lbl">CLOSE-SLICE ROI · 2026-04 IPL</div>
        <div class="val cyan">+${close.roi.toFixed(2)}% · +${ipl.roi.toFixed(2)}%</div>
        <div class="sub">close win ${close.win_pct}% · IPL win ${ipl.win_pct}%</div>
      </div>
    </div>
  `;
}

// =============================== TAB 1: MATCH-LEVEL ==========================
function renderMatchTab() {
  const status = renderStatusStrip();
  const ladder = renderLadder(DATA.match_level_models);
  const heatmap = renderWalkForwardHeatmap(DATA.match_level_models);
  const phases = renderPhasePane(DATA.phase_narrative);
  const slices = renderSlicePane(DATA.match_level_models);
  return `
    ${status}
    <div class="grid">
      <div class="pane" style="grid-column: 1; grid-row: 1 / span 2;">
        <div class="pane-header"><span>MODEL LADDER · MATCH-LEVEL</span><span class="meta">click row to drill down</span></div>
        <div class="pane-body scroll" style="padding: 0;">${ladder}</div>
      </div>
      <div class="pane" style="grid-column: 2; grid-row: 1;">
        <div class="pane-header"><span>WALK-FWD ROI · M7 PROD</span><span class="meta">monthly</span></div>
        <div class="pane-body">${heatmap}</div>
      </div>
      <div class="pane" style="grid-column: 2; grid-row: 2;">
        <div class="pane-header"><span>SLICE BREAKDOWN · M7 PROD</span><span class="meta">iter ≥$50k</span></div>
        <div class="pane-body">${slices}</div>
      </div>
      <div class="pane" style="grid-column: 1 / span 2; grid-row: 3;">
        <div class="pane-header"><span>PHASE NARRATIVE · M1 → M8</span><span class="meta">step through the journey</span></div>
        <div class="pane-body scroll" style="max-height: 280px;">${phases}</div>
      </div>
    </div>
  `;
}

function renderLadder(models) {
  const rows = models.map(m => {
    const i50 = m.metrics.iter_50k_raw || m.metrics.iter_50k_platt || {};
    const i100 = m.metrics.iter_100k_raw || m.metrics.iter_100k_platt || {};
    const ll = i50.ll != null ? i50.ll.toFixed(4) : '<span class="dim">—</span>';
    const roi = i50.roi != null ? `${i50.roi>=0?'+':''}${i50.roi.toFixed(2)}%` : '<span class="dim">—</span>';
    const roiCls = i50.roi != null ? (i50.roi >= 0 ? 'pos' : 'neg') : 'dim';
    const ci = i50.roi_ci ? `[${i50.roi_ci[0].toFixed(1)}, ${i50.roi_ci[1].toFixed(1)}]` : '<span class="dim">—</span>';
    const ll100 = i100.ll != null ? i100.ll.toFixed(4) : '<span class="dim">—</span>';
    const roi100 = i100.roi != null ? `${i100.roi>=0?'+':''}${i100.roi.toFixed(2)}%` : '<span class="dim">—</span>';
    const roi100Cls = i100.roi != null ? (i100.roi >= 0 ? 'pos' : 'neg') : 'dim';
    const statusCls = m.status.toLowerCase().replace('_', '_');
    return `
      <tr class="${m.status==='PROD'?'prod':''}" onclick="openModalForModel('${m.id}')">
        <td class="left">${m.label}</td>
        <td class="dim">${m.phase}</td>
        <td><span class="badge ${statusCls}">${m.status}</span></td>
        <td>${m.feature_count != null ? m.feature_count : '<span class="dim">—</span>'}</td>
        <td>${ll}</td>
        <td><span class="${roiCls}">${roi}</span></td>
        <td class="dim">${ci}</td>
        <td>${ll100}</td>
        <td><span class="${roi100Cls}">${roi100}</span></td>
        <td>${gateBlocks(m)}</td>
      </tr>
    `;
  }).join('');
  return `
    <table class="ladder">
      <thead>
        <tr>
          <th class="left">model</th>
          <th>phase</th>
          <th>status</th>
          <th>feats</th>
          <th>≥$50k LL</th>
          <th>ROI</th>
          <th>CI</th>
          <th>≥$100k LL</th>
          <th>ROI</th>
          <th>gates</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderWalkForwardHeatmap(models) {
  const candidates = models.filter(m => m.walk_forward && m.walk_forward.length);
  if (!candidates.length) return '<div class="dim">no walk-forward data</div>';
  // Pull all unique months across candidates
  const monthSet = new Set();
  candidates.forEach(c => c.walk_forward.forEach(w => monthSet.add(w.month)));
  const months = Array.from(monthSet).sort();
  const rows = candidates.map(c => {
    const cells = months.map(m => {
      const w = c.walk_forward.find(x => x.month === m);
      if (!w) return `<td><div class="heat-cell" style="background:var(--surface-2); color:var(--muted)">·</div></td>`;
      const v = w.roi;
      // ROI -100 to +100 mapped to color
      const intensity = Math.min(1, Math.abs(v) / 60);
      const color = v >= 0
        ? `rgba(63,198,126,${0.15 + intensity*0.65})`
        : `rgba(255,93,93,${0.15 + intensity*0.65})`;
      const txtColor = intensity > 0.5 ? '#fff' : 'var(--text)';
      return `<td><div class="heat-cell" style="background:${color}; color:${txtColor}" title="n=${w.n} LL ${w.ll.toFixed(3)}">${v>=0?'+':''}${v.toFixed(0)}</div></td>`;
    }).join('');
    return `<tr><td class="label" style="white-space: nowrap; padding-right: 8px;">${c.label}</td>${cells}</tr>`;
  }).join('');
  return `
    <table class="heat-tbl">
      <thead><tr><th></th>${months.map(m=>`<th>${m.slice(5)}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="font-size:10px; color:var(--muted); margin-top:6px;">cells = monthly flat ROI %, color = direction × magnitude</div>
  `;
}

function renderSlicePane(models) {
  const m = models.find(x => x.id === 'xgb_match_v3_m7_production');
  if (!m) return '<div class="dim">prod model not found</div>';
  const slices = [
    ['iter ≥$50k', m.metrics.iter_50k_raw],
    ['iter ≥$100k', m.metrics.iter_100k_raw],
    ['close (|ELO|≤5)', m.metrics.close],
    ['mismatch (|ELO|≥15)', m.metrics.mismatch],
    ['IPL', m.metrics.ipl],
  ];
  const rows = slices.map(([label, sl]) => {
    if (!sl) return '';
    const ll = sl.ll != null ? sl.ll.toFixed(4) : '—';
    const roi = sl.roi != null ? `${sl.roi>=0?'+':''}${sl.roi.toFixed(2)}%` : '—';
    const roiCls = sl.roi != null ? (sl.roi >= 0 ? 'pos' : 'neg') : 'dim';
    const ci = sl.roi_ci ? `[${sl.roi_ci[0].toFixed(1)}, ${sl.roi_ci[1].toFixed(1)}]` : '—';
    const win = sl.win_pct != null ? `${sl.win_pct}%` : '—';

// =============================== TAB 3: LINEAGE TREE =========================
function renderLineageTab() {
  // Build a tree from match-level models by parent
  const models = DATA.match_level_models;
  const byId = Object.fromEntries(models.map(m => [m.id, m]));
  const children = {};
  models.forEach(m => {
    if (!children[m.parent]) children[m.parent] = [];
    children[m.parent].push(m);
  });
  // Find roots (parents not in our model list)
  const knownIds = new Set(models.map(m => m.id));
  const roots = models.filter(m => !knownIds.has(m.parent));
  // Render tree
  const nodes = [];
  function walk(m, depth, isLast, prefix) {
    const pipe = prefix + (depth === 0 ? '' : (isLast ? '└─' : '├─'));
    const colorMap = {
      'PROD': 'amber', 'LANDED': 'green', 'DROPPED': 'red',
      'DROPPED_AT_CORR': 'orange', 'REF': 'cyan', 'ARCHIVED': 'muted',
    };
    const c = colorMap[m.status] || 'muted';
    const sym = m.status === 'PROD' ? '★' : (m.status === 'LANDED' ? '✓' : (m.status.startsWith('DROPPED') ? '✗' : '·'));
    const i50 = m.metrics.iter_50k_raw || m.metrics.iter_50k_platt || {};
    const llStr = i50.ll != null ? `LL ${i50.ll.toFixed(4)}` : '';
    const roiStr = i50.roi != null ? `ROI ${i50.roi>=0?'+':''}${i50.roi.toFixed(1)}%` : '';
    const ciStr = i50.roi_ci ? `[${i50.roi_ci[0].toFixed(1)}, ${i50.roi_ci[1].toFixed(1)}]` : '';
    nodes.push(`
      <div class="lineage-node" onclick="openModalForModel('${m.id}')" style="cursor:pointer;">
        <div class="lineage-pipe">${pipe}</div>
        <div class="lineage-mark ${c}">${sym}</div>
        <div class="lineage-text ${m.status==='PROD'?'prod':''} ${m.status.startsWith('DROPPED')?'dropped':''}">
          <span class="label">${m.label}</span>
          <span class="badge ${m.status.toLowerCase()}">${m.status}</span>
          <span class="meta"> · ${m.phase} · ${llStr} · ${roiStr} <span style="color:var(--muted)">${ciStr}</span></span>
          <div class="meta" style="margin-top: 2px;">${m.what_changed}</div>
        </div>
      </div>`);
    const kids = children[m.id] || [];
    kids.forEach((k, i) => {
      const childPrefix = prefix + (depth === 0 ? '' : (isLast ? '   ' : '│  '));
      walk(k, depth + 1, i === kids.length - 1, childPrefix);
    });
  }
  roots.forEach((r, i) => walk(r, 0, i === roots.length - 1, ''));
  return `
    <div class="grid" style="grid-template-columns: 1fr;">
      <div class="pane">
        <div class="pane-header"><span>LINEAGE TREE · MATCH-LEVEL DIRECT</span><span class="meta">click any node for full metrics</span></div>
        <div class="pane-body scroll" style="max-height: 75vh;">
          <div class="lineage">${nodes.join('')}</div>
        </div>
      </div>
    </div>
  `;
}

      <tr><td class="k">ROI CI</td><td>${i50.roi_ci?`[${i50.roi_ci[0]}, ${i50.roi_ci[1]}]`:'—'}</td></tr>
    </table>
    ${m.prop_skill?`<h3>Prop skill (Brier vs base rate)</h3>${m.prop_skill.map(p=>`<div style="font-size:11.5px;"><b>${p.family}</b>: skill ${p.skill>=0?'+':''}${p.skill.toFixed(3)} (n=${p.n}) · ${p.verdict}</div>`).join('')}`:''}
  `;
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

// =============================== TICKER ======================================
function renderTicker() {
  const items = [];
  DATA.phase_narrative.forEach(p => {
    const tag = p.outcome_color === 'green' ? 'green' : (p.outcome_color === 'red' ? 'red' : '');
    items.push(`<div class="ticker-item"><span class="tag ${tag}">${p.phase}</span> ${p.outcome.toUpperCase()} · ${p.title}</div>`);
  });
  // Duplicate for seamless loop
  const html = (items.concat(items)).join('');
  document.getElementById('ticker-track').innerHTML = html;
}

// =============================== DRIVER ======================================
function selectTab(t) {
  CURRENT_TAB = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  const renderers = {match: renderMatchTab, ball: renderBallTab, lineage: renderLineageTab, sizing: renderSizingTab, features: renderFeaturesTab};
  document.getElementById('content').innerHTML = renderers[t]();
}

async function init() {
  try {
    const r = await fetch('dashboard_data.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="err">Could not load <code>dashboard_data.json</code>. Run <code>uv run python scripts/build_dashboard_data.py</code> from repo root, then serve <code>docs/</code> via a local HTTP server (e.g. <code>cd docs && uv run python -m http.server 8765</code>) and open this page from there.</div>`;
    return;
  }
  document.getElementById('clock').textContent = DATA.generated_at;
  selectTab('match');
  renderTicker();
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => selectTab(b.dataset.tab)));
}

init();
</script>

</body>
</html>
